<html lang="vi">
<head>

<title>Dashboard · ArticuWrite</title>
<link rel="stylesheet" href="aw-theme.css">
<style>
  .aw-mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-bottom:28px}
  .aw-mode-card.aw-mode-locked{cursor:not-allowed;opacity:.55;filter:grayscale(.5)}
  .aw-mode-card.aw-mode-locked:hover{transform:none;box-shadow:var(--aw-shadow-sm)}
  .aw-lock-badge{font-size:.68rem;font-weight:700;background:var(--aw-surface-2);color:var(--aw-ink-3);padding:2px 8px;border-radius:10px;vertical-align:middle}
  .aw-mode-card{background:var(--aw-surface);border:1px solid var(--aw-border-2);border-radius:var(--aw-r-lg);padding:24px;cursor:pointer;transition:transform .14s,box-shadow .16s,border-color .16s;box-shadow:var(--aw-shadow-sm);position:relative;overflow:hidden}
  .aw-mode-card:hover{transform:translateY(-4px);box-shadow:var(--aw-shadow-lg);border-color:var(--aw-primary)}
  .aw-mode-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.5rem;margin-bottom:14px}
  .aw-mode-free .aw-mode-ic{background:#E4F5EA}
  .aw-mode-inclass .aw-mode-ic{background:var(--aw-primary-lt)}
  .aw-mode-hw .aw-mode-ic{background:#FEF3D6}
  /* Chart thumbnail hover in assignment card */
  .aw-chart-thumb-wrap{position:relative;display:inline-flex;align-items:center}
  .aw-chart-thumb-pop{
    display:none;position:absolute;top:24px;right:0;z-index:200;
    width:320px;max-width:80vw;border-radius:10px;
    border:2px solid #1A9E5C;box-shadow:0 8px 32px rgba(0,0,0,.22);
    background:#fff;object-fit:contain
  }
  .aw-chart-thumb-wrap:hover .aw-chart-thumb-pop{display:block}
  /* Free Writing task selector panel */
  .aw-free-panel{background:var(--aw-surface);border:1px solid var(--aw-border-2);border-radius:var(--aw-r-lg);padding:24px;margin-bottom:20px;box-shadow:var(--aw-shadow-sm)}
  .aw-free-panel h3{font-family:var(--aw-font-display);margin:0 0 6px;font-size:1.15rem}
  .aw-free-panel p{margin:0 0 18px;color:var(--aw-ink-2);font-size:.9rem;line-height:1.5}
  .aw-free-tasks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:540px){.aw-free-tasks{grid-template-columns:1fr}}
  .aw-free-task{border:2px solid var(--aw-border);border-radius:var(--aw-r);padding:16px 18px;cursor:pointer;transition:all .18s;background:#fff;text-align:left}
  .aw-free-task:hover{border-color:var(--aw-primary);background:var(--aw-primary-lt);transform:translateY(-2px);box-shadow:var(--aw-shadow)}
  .aw-free-task.t1:hover{border-color:#1A9E5C;background:#EAF7F0}
  .aw-free-task .ft-icon{font-size:1.6rem;margin-bottom:8px}
  .aw-free-task .ft-badge{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:800;padding:2px 9px;border-radius:12px;margin-bottom:6px;letter-spacing:.03em}
  .t2 .ft-badge{background:var(--aw-primary-lt);color:var(--aw-primary);border:1px solid #A8CCE8}
  .t1 .ft-badge{background:#EAF7F0;color:#1A9E5C;border:1px solid #9FDEC0}
  .aw-free-task h4{margin:0 0 4px;font-size:.95rem;font-family:var(--aw-font-display)}
  .aw-free-task p{margin:0;font-size:.8rem;color:var(--aw-ink-3);line-height:1.4}
  .aw-free-task .ft-crits{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
  .aw-free-task .ft-crit{font-size:.65rem;font-weight:700;padding:1px 7px;border-radius:12px;border:1px solid currentColor;background:#fff}
  .aw-mode-card h3{margin:0 0 6px;font-size:1.15rem;font-family:var(--aw-font-display)}
  .aw-mode-card p{margin:0;color:var(--aw-ink-2);font-size:.9rem;line-height:1.5}
  .aw-hist-list{display:flex;flex-direction:column;gap:10px}
  .aw-hist{display:flex;align-items:center;gap:14px;background:var(--aw-surface);border:1px solid var(--aw-border-2);border-radius:var(--aw-r);padding:14px 18px;box-shadow:var(--aw-shadow-sm)}
  .aw-hist-main{flex:1;min-width:0}
  .aw-hist-topic{font-weight:600;color:var(--aw-ink);margin-bottom:2px}
  .aw-hist-meta{font-size:.8rem;color:var(--aw-ink-3)}
  .aw-sec-title{font-family:var(--aw-font-display);font-size:1.25rem;font-weight:600;margin:0 0 16px;color:var(--aw-ink)}
  .p-res-wrap{border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(10,58,93,.08);border:1px solid var(--aw-border-2)}
  .p-res-table{width:100%;border-collapse:collapse;font-size:.84rem;white-space:nowrap}
  .p-res-table th,.p-res-table td{border:1px solid #EEF2F6;padding:9px 11px;text-align:center;position:relative}
  .p-res-table td:hover{z-index:200}
  .p-res-table thead tr:first-child th{background:linear-gradient(135deg,#0A6EBD,#1A5F9E);color:#fff;font-family:var(--aw-font-display);font-size:.82rem;padding:12px 11px}
  .p-res-table thead tr:nth-child(2) th{font-size:.7rem;font-weight:700}
  .pg-1{background:#EAF2FB} .pg-2{background:#EEEBFA} .pg-3{background:#E9F5EE} .pg-b{background:#FEF6E3}
  .p-score{font-weight:800;cursor:pointer;position:relative;display:inline-block;padding:5px 10px;border-radius:9px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .p-score small{display:block;font-size:.58rem;color:var(--aw-ink-3);font-weight:600}
  .p-score:hover{box-shadow:0 2px 10px rgba(10,110,189,.3)}
  .p-score:hover .p-pop{display:block}
  .p-pop{display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--aw-primary-dk);color:#fff;padding:8px 12px;border-radius:8px;font-size:.72rem;font-weight:500;white-space:nowrap;z-index:500;box-shadow:var(--aw-shadow-lg);pointer-events:none}
  .p-pop:after{content:'';position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:var(--aw-primary-dk)}
  .aw-rev-bg{position:fixed;inset:0;background:rgba(16,34,46,.55);z-index:600;display:none;align-items:flex-start;justify-content:center;padding:30px 20px;overflow-y:auto}
  .aw-rev-bg.show{display:flex}
  .aw-rev-modal{background:#fff;border-radius:16px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:26px}
  .aw-rev-modal .rv-block{margin-top:14px;padding-top:14px;border-top:1px solid var(--aw-border-2)}
  .aw-rev-modal .rv-block h4{color:var(--aw-primary);margin:0 0 6px;font-size:.85rem;text-transform:uppercase;letter-spacing:.03em}
  .aw-rev-modal .rv-block p{margin:0 0 6px;line-height:1.55;font-size:.9rem;color:var(--aw-ink-2)}
</style>
</head>
<body>
<div id="app"></div>
<div class="aw-rev-bg" id="reviewModal"><div class="aw-rev-modal" id="reviewModalBody"></div></div>
<div class="aw-rev-bg" id="discussModal"><div class="aw-rev-modal dm-body" style="max-width:480px"></div></div>

<script src="aw-common.js"></script>
<script src="aw-cefr.js"></script>
<style>
  /* CEFR vocab profile — shared with write.html */
  .aw-vocab-bar-wrap{margin:10px 0 14px}
  .aw-vocab-bar{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:1px;margin-bottom:6px}
  .aw-vocab-seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:#fff;transition:flex .4s;min-width:0;overflow:hidden;white-space:nowrap}
  .aw-vocab-legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}
  .aw-vocab-legend-item{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--aw-ink-2)}
  .aw-vocab-legend-dot{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
  .aw-vocab-wordlist{margin-top:12px}
  .aw-vocab-wordlist h4{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--aw-ink-3);margin:10px 0 5px}
  .aw-vocab-words{display:flex;flex-wrap:wrap;gap:4px}
  .aw-vocab-word{font-size:.75rem;padding:2px 8px;border-radius:12px;font-weight:600}
</style>
<script>
if (window.AW && !AW.groqKey) {
  AW.groqKey = {
    get: function(){ return localStorage.getItem('aw_groq_key') || ''; },
    set: function(k){ localStorage.setItem('aw_groq_key', k || ''); }
  };
}
if (window.AW && !AW.renderTodaysWord) { AW.renderTodaysWord = function(){}; }
if (window.AW && !AW.bumpLoginCount) { AW.bumpLoginCount = function(){}; }
</script>
<script>
if (typeof AW === 'undefined') {
  document.body.innerHTML = '<div style="max-width:560px;margin:80px auto;padding:30px;border:2px solid #EA4335;border-radius:14px;font-family:system-ui;color:#10222E"><h2>&#9888; Kh&ocirc;ng t&#7843;i &#273;&#432;&#7907;c aw-common.js</h2><p>File <b>aw-common.js</b> v&agrave; <b>aw-theme.css</b> ph&#7843;i n&#7857;m <b>c&ugrave;ng th&#432; m&#7909;c</b> v&#7899;i file HTML n&agrave;y tr&ecirc;n GitHub. Upload &#273;&#7911; ch&uacute;ng r&#7891;i t&#7843;i l&#7841;i trang.</p></div>';
  throw new Error('aw-common.js not loaded');
}

var sess = AW.session.require('student');
if (!sess) throw 'redirect';

/* Is this student in an AI (experimental) class or a control class?
   Resolved before the first render so Free Writing never flashes unlocked. */
var AW_AI_ON = true;

var nav = [
  { id:'modes',   label:'Practice Modes', icon:'modes', active:true },
  { id:'board',   label:'Interactive Board', icon:'modes', href:'board.html' },
  { id:'library', label:'Library', icon:'library', href:'library.html' },
  { id:'progress',label:'My Progress', icon:'progress' },
  { id:'translate',label:'Translation Practice', icon:'results' },
  { id:'qa',      label:'Q&A with Teacher', icon:'results' },
  { id:'settings',label:'Settings', icon:'settings' },
];

var content = AW.renderShell({
  mount:'app', nav:nav, eyebrow:'Student Interface', title:'Practice Modes',
  onNav: function(id){
    // set the hash; routeFromHash() does the rendering (single source of truth)
    if((location.hash||'').replace('#','')===id) return;
    location.hash=id;
  }
});

function showModes(){
  document.getElementById('awPageTitle').textContent='Practice Modes';
  content.innerHTML =
    '<div id="todaysWord"></div>' +
    '<div class="aw-mode-grid">' +
      modeCard('free','✍️','Free Writing',
        AW_AI_ON ? 'Choose any topic and get instant AI feedback. Practice at your own pace.'
                 : 'Không khả dụng cho lớp của bạn.',
        'aw-mode-free' + (AW_AI_ON ? '' : ' aw-mode-locked')) +
      modeCard('inclass','⏱️','In-class Practice','Timed writing assigned by your teacher, with live guidance.','aw-mode-inclass') +
      modeCard('homework','📝','Homework','Complete assigned essays with the required number of revisions.','aw-mode-hw') +
      modeCard('translate','🔄','Translation Practice','Translate EN↔VI sentences graded by AI on meaning. Complete rounds of 5 sentences until all are cleared.','aw-mode-translate') +
    '</div>' +
    '<h2 class="aw-sec-title">Recent Practice</h2>' +
    '<div id="hist" class="aw-hist-list"><div class="aw-empty"><span class="aw-spin aw-spin-dark"></span></div></div>';
  AW.renderTodaysWord('todaysWord');

  AW.els('.aw-mode-card').forEach(function(c){
    c.onclick=function(){
      var m=c.dataset.mode;
      if(m==='free' && !AW_AI_ON){
        AW.toast('Mục Free Writing không khả dụng cho lớp của bạn. Hãy làm bài trong mục Homework hoặc In-class Practice.','err',5000);
        return;
      }
      if(m==='free'){ showFreeTaskSelector(); }
      else if(m==='translate'){ location.hash='translate'; }
      else { loadAssignments(m); }
    };
  });
  loadHistory();
}

function modeCard(mode,ic,title,desc,cls){
  var locked = cls.indexOf('aw-mode-locked') !== -1;
  return '<div class="aw-mode-card '+cls+'" data-mode="'+mode+'">' +
    '<div class="aw-mode-ic">'+ic+'</div><h3>'+title+(locked?' <span class="aw-lock-badge">🔒 Khoá</span>':'')+'</h3><p>'+desc+'</p></div>';
}

/*── Free Writing: chọn Task 1 hoặc Task 2 trước khi vào write.html ──
  Render ngay trong content area (không dùng modal) để SV thấy
  mô tả đầy đủ và quyết định có chủ đích.                             */
function showFreeTaskSelector(){
  document.getElementById('awPageTitle').textContent='Free Writing';
  content.innerHTML =
    '<button class="aw-btn aw-btn-ghost" style="margin-bottom:18px" onclick="showModes()">← Back to modes</button>'+
    '<div class="aw-free-panel">'+
      '<h3>✍️ Chọn dạng bài luyện tập</h3>'+
      '<p>Free Writing không giới hạn số lần thử. Chọn Task 1 để luyện mô tả biểu đồ, hoặc Task 2 để luyện viết luận.</p>'+
      '<div class="aw-free-tasks">'+

        // Task 1 card
        '<div class="aw-free-task t1" id="freeTask1">'+
          '<div class="ft-icon">📊</div>'+
          '<div class="ft-badge">Task 1</div>'+
          '<h4>Data / Chart / Diagram</h4>'+
          '<p>Mô tả, tóm tắt hoặc so sánh thông tin từ biểu đồ, bảng, sơ đồ. Tối thiểu 150 từ.</p>'+
          '<div class="ft-crits">'+
            '<span class="ft-crit" style="color:#1A9E5C">TA</span>'+
            '<span class="ft-crit" style="color:#0A6EBD">CC</span>'+
            '<span class="ft-crit" style="color:#E0A32E">LR</span>'+
            '<span class="ft-crit" style="color:#E8730C">GRA</span>'+
          '</div>'+
        '</div>'+

        // Task 2 card
        '<div class="aw-free-task t2" id="freeTask2">'+
          '<div class="ft-icon">📝</div>'+
          '<div class="ft-badge">Task 2</div>'+
          '<h4>Essay / Opinion</h4>'+
          '<p>Thảo luận, lập luận hoặc trình bày quan điểm về một vấn đề. Tối thiểu 250 từ.</p>'+
          '<div class="ft-crits">'+
            '<span class="ft-crit" style="color:#0A6EBD">TR</span>'+
            '<span class="ft-crit" style="color:#0A6EBD">CC</span>'+
            '<span class="ft-crit" style="color:#E0A32E">LR</span>'+
            '<span class="ft-crit" style="color:#E8730C">GRA</span>'+
          '</div>'+
        '</div>'+

      '</div>'+
    '</div>'+
    // Show recent free writing history below
    '<h2 class="aw-sec-title">Recent Free Writing</h2>'+
    '<div id="hist" class="aw-hist-list"><div class="aw-empty"><span class="aw-spin aw-spin-dark"></span></div></div>';

  // Task 1 click → show prompt input panel for Task 1
  document.getElementById('freeTask1').onclick = function(){
    showFreePromptInput('task1');
  };
  // Task 2 click → show prompt input panel for Task 2
  document.getElementById('freeTask2').onclick = function(){
    showFreePromptInput('task2');
  };

  loadHistory();
}

/*── Free Writing: nhập đề bài (optional) rồi bắt đầu viết ──*/
function showFreePromptInput(taskType){
  var isT1 = taskType === 'task1';
  var taskLabel   = isT1 ? 'Task 1 — Data / Chart / Diagram' : 'Task 2 — Essay / Opinion';
  var taskIcon    = isT1 ? '📊' : '📝';
  var placeholder = isT1
    ? 'VD: The chart below shows the percentage of households in four European countries with at least one car from 1996 to 2011. Summarise the information…'
    : 'VD: Some people think that modern technology is making people more sociable, while others think it is making them less sociable. Discuss both views and give your opinion.';
  var minWords    = isT1 ? '150' : '250';
  var badgeColor  = isT1 ? '#1A9E5C' : 'var(--aw-primary)';
  var badgeBg     = isT1 ? '#EAF7F0' : 'var(--aw-primary-lt)';

  document.getElementById('awPageTitle').textContent='Free Writing';
  content.innerHTML =
    '<button class="aw-btn aw-btn-ghost" style="margin-bottom:18px" onclick="showFreeTaskSelector()">← Chọn lại dạng bài</button>'+
    '<div class="aw-free-panel">'+
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">'+
        '<span style="font-size:1.6rem">'+taskIcon+'</span>'+
        '<div>'+
          '<span style="display:inline-block;font-size:.72rem;font-weight:800;padding:2px 10px;border-radius:12px;background:'+badgeBg+';color:'+badgeColor+';border:1px solid;letter-spacing:.03em">'+taskLabel+'</span>'+
          '<div style="font-size:.8rem;color:var(--aw-ink-3);margin-top:3px">Min. '+minWords+' words · AI grading after submission</div>'+
        '</div>'+
      '</div>'+
      '<div class="aw-field">'+
        '<label class="aw-label">Đề bài (Prompt) <span style="font-weight:400;color:var(--aw-ink-3)">— tuỳ chọn, có thể để trống</span></label>'+
        '<textarea id="freePromptInput" rows="3" class="aw-input" style="resize:vertical" placeholder="'+AW.esc(placeholder)+'"></textarea>'+
        '<p style="margin:6px 0 0;font-size:.78rem;color:var(--aw-ink-3)">💡 Nếu để trống, bạn có thể nhập đề bài trong trang viết, hoặc AI sẽ chấm theo chất lượng Task '+(isT1 ? '1' : '2')+' chung.</p>'+
      '</div>'+
      (isT1 ?
        '<div class="aw-field" style="margin-top:14px" id="chartUploadBlock">'+
          '<label class="aw-label">📊 Biểu đồ / hình <span style="font-weight:400;color:var(--aw-ink-3)">— tuỳ chọn</span></label>'+
          '<div id="chartDropZone" style="border:2px dashed var(--aw-border);border-radius:10px;padding:18px;text-align:center;cursor:pointer;background:var(--aw-surface-2);transition:border-color .18s">'+
            '<div id="chartPreviewWrap" style="display:none;margin-bottom:10px">'+
              '<img id="chartPreviewImg" style="max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--aw-border-2)" alt="Chart preview">'+
              '<button id="chartRemoveBtn" style="display:block;margin:8px auto 0;font-size:.75rem;color:var(--aw-danger);border:none;background:none;cursor:pointer">✕ Xoá hình</button>'+
            '</div>'+
            '<div id="chartPlaceholder">'+
              '<div style="font-size:1.8rem;margin-bottom:6px">📊</div>'+
              '<div style="font-size:.85rem;color:var(--aw-ink-2)">Kéo thả hoặc <b>chọn file</b> ảnh biểu đồ</div>'+
              '<div style="font-size:.75rem;color:var(--aw-ink-3);margin-top:4px">JPG · PNG · WebP · GIF — tối đa 4MB</div>'+
            '</div>'+
            '<input type="file" id="chartFileInput" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none">'+
          '</div>'+
          '<p style="margin:5px 0 0;font-size:.76rem;color:var(--aw-ink-3)">Hoặc <b>dán ảnh từ clipboard</b> (Ctrl+V / Cmd+V) sau khi chụp màn hình biểu đồ.</p>'+
        '</div>'
      : '')+
      '<div style="display:flex;gap:10px;margin-top:14px">'+
        '<button class="aw-btn aw-btn-primary" id="freeStartBtn" style="flex:1;padding:13px">'+taskIcon+' Bắt đầu viết →</button>'+
      '</div>'+
    '</div>';

  // ── Chart image handling (Task 1 only) ──
  var _chartDataUrl = '';
  if (isT1) {
    var dropZone = document.getElementById('chartDropZone');
    var fileInput = document.getElementById('chartFileInput');
    var previewWrap = document.getElementById('chartPreviewWrap');
    var previewImg  = document.getElementById('chartPreviewImg');
    var placeholder = document.getElementById('chartPlaceholder');

    function loadChartFile(file) {
      if (!file || !file.type.startsWith('image/')) { AW.toast('Vui lòng chọn file ảnh (JPG/PNG/WebP/GIF).','err'); return; }
      if (file.size > 4 * 1024 * 1024) { AW.toast('Ảnh quá lớn (tối đa 4MB). Hãy resize lại trước.','err'); return; }
      var reader = new FileReader();
      reader.onload = function(ev) {
        _chartDataUrl = ev.target.result;
        previewImg.src = _chartDataUrl;
        previewWrap.style.display = '';
        placeholder.style.display = 'none';
        dropZone.style.borderColor = '#1A9E5C';
        AW.toast('Đã tải ảnh biểu đồ.','ok');
      };
      reader.readAsDataURL(file);
    }

    dropZone.onclick = function(e) { if (e.target.id !== 'chartRemoveBtn') fileInput.click(); };
    fileInput.onchange = function() { if (fileInput.files[0]) loadChartFile(fileInput.files[0]); };

    // Drag & drop
    dropZone.addEventListener('dragover', function(e){ e.preventDefault(); dropZone.style.borderColor='var(--aw-primary)'; });
    dropZone.addEventListener('dragleave', function(){ dropZone.style.borderColor = _chartDataUrl ? '#1A9E5C' : 'var(--aw-border)'; });
    dropZone.addEventListener('drop', function(e){ e.preventDefault(); dropZone.style.borderColor = 'var(--aw-border)'; var f=e.dataTransfer.files[0]; if(f) loadChartFile(f); });

    // Paste from clipboard (anywhere on the page while this screen is visible)
    var _pasteHandler = function(e) {
      var items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (var i=0; i<items.length; i++) {
        if (items[i].type.startsWith('image/')) { loadChartFile(items[i].getAsFile()); break; }
      }
    };
    document.addEventListener('paste', _pasteHandler);

    // Remove chart
    document.getElementById('chartRemoveBtn').onclick = function(e) {
      e.stopPropagation();
      _chartDataUrl = '';
      previewImg.src = '';
      previewWrap.style.display = 'none';
      placeholder.style.display = '';
      dropZone.style.borderColor = 'var(--aw-border)';
      fileInput.value = '';
    };
  }

  document.getElementById('freeStartBtn').onclick = function(){
    var prompt = (document.getElementById('freePromptInput').value||'').trim();
    var topic  = prompt
      ? prompt.slice(0, 60) + (prompt.length > 60 ? '…' : '')
      : (isT1 ? 'Free Writing — Task 1' : 'Free Writing — Task 2');
    var params = new URLSearchParams({
      mode:   'free',
      type:   taskType,
      topic:  topic
    });
    if (prompt) params.set('prompt', prompt);
    // Task 1: pass chart image via sessionStorage (avoids URL length limits)
    if (isT1 && _chartDataUrl) {
      try {
        sessionStorage.setItem('aw_free_chart', _chartDataUrl);
        params.set('hasFreeChart', '1');
      } catch(e) {
        // sessionStorage full (rare) — proceed without chart
        console.warn('Could not store chart in sessionStorage:', e);
      }
    } else {
      sessionStorage.removeItem('aw_free_chart');
    }
    // Remove paste listener before leaving
    document.removeEventListener('paste', _pasteHandler || function(){});
    location.href = 'write.html?' + params.toString();
  };

  // Allow Enter in textarea to submit (Shift+Enter for newline)
  document.getElementById('freePromptInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      document.getElementById('freeStartBtn').click();
    }
  });
}

// Cache getMyResults to avoid calling it twice (loadHistory + showProgress)
var _myResultsCache = null;
var _myResultsCacheTime = 0;
var _myResultsCacheTTL = 60000; // 60s cache — fresh enough for a writing session

function fetchMyResults(cb) {
  var now = Date.now();
  if (_myResultsCache && (now - _myResultsCacheTime) < _myResultsCacheTTL) {
    cb(_myResultsCache); return;
  }
  AW.api('write.getMyResults',{studentId:sess.studentId}).then(function(res){
    if (res && res.success) {
      _myResultsCache = res.data || [];
      _myResultsCacheTime = Date.now();
    }
    cb((res && res.data) || []);
  });
}
// Invalidate cache after submit so fresh data shows immediately
window._invalidateMyResults = function(){ _myResultsCache = null; };

function renderProgress(){
  var box=document.getElementById('progressBox'); if(!box)return;
  var q=(document.getElementById('pSearch').value||'').toLowerCase();
  var mode=document.getElementById('pMode').value;
  var modeLabel={free:'Free Writing',homework:'Homework',inclass:'In-class'};
  var rows=(window._myGroups||[]).filter(function(g){
    if(mode && g.mode!==mode) return false;
    if(q && (g.topic||'').toLowerCase().indexOf(q)===-1) return false;
    return true;
  });
  if(_progressSort==='best') rows.sort(function(a,b){return (parseFloat(b.bestResult)||0)-(parseFloat(a.bestResult)||0);});
  else if(_progressSort==='topic') rows.sort(function(a,b){return (a.topic||'').localeCompare(b.topic||'');});
  else rows.sort(function(a,b){return new Date(b.latestTime)-new Date(a.latestTime);});

  if(!rows.length){box.innerHTML='<div class="aw-empty">'+AW.icon('progress')+'<p>No matching submissions.</p></div>';return;}

  function scoreCell(w,gi,wi,cl){
    cl=cl||'';
    if(!w) return '<td class="'+cl+'">—</td><td class="'+cl+'">—</td><td class="'+cl+'">—</td><td class="'+cl+'">—</td>';
    function tm(x){if(!x)return '—';var d=new Date(x);return isNaN(d)?x:(d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'));}
    function du(s){if(!s)return '—';s=parseInt(s,10);if(isNaN(s))return '—';var m=Math.floor(s/60);return m+'m';}
    var o=w.overall||w.teacher||'—';
    var pop='TR '+(w.tr||'—')+' · CC '+(w.cc||'—')+' · LR '+(w.lr||'—')+' · GRA '+(w.gra||'—');
    return '<td class="'+cl+'">'+tm(w.startTime)+'</td><td class="'+cl+'">'+tm(w.finishTime)+'</td><td class="'+cl+'">'+du(w.duration)+'</td>'+
      '<td class="'+cl+'"><span class="p-score" data-gi="'+gi+'" data-wi="'+wi+'" title="Click to review">'+o+'<small>/9</small><span class="p-pop">'+pop+'</span></span></td>';
  }
  var writeLabels=[['First Write','pg-1'],['Second Write','pg-2'],['Third Write','pg-3'],['★ Best','pg-b']];
  var top='<tr><th rowspan="2">Assigned / Deadline</th><th rowspan="2">Title</th><th rowspan="2">Prompt (đề bài)</th><th rowspan="2">Mode</th>';
  writeLabels.forEach(function(l){top+='<th colspan="4" class="'+l[1]+'">'+l[0]+'</th>';});
  top+='<th rowspan="2" class="pg-b">Attempt & Teacher Score</th><th rowspan="2"></th></tr><tr>';
  writeLabels.forEach(function(l){top+='<th class="'+l[1]+'">Start</th><th class="'+l[1]+'">Finish</th><th class="'+l[1]+'">Dur</th><th class="'+l[1]+'">Band</th>';});
  top+='</tr>';

  var body=rows.map(function(g){
    var gi=(window._myGroups||[]).indexOf(g);
    var w=g.writes||[];
    var best=null,bestI=-1;
    w.forEach(function(x,xi){var v=parseFloat(x.overall);if(!isNaN(v)&&(best===null||v>parseFloat(best.overall))){best=x;bestI=xi;}});
    var picks=[w[0],w[1],w[2],best];
    var idxs=[0,1,2,bestI];
    var groups=['pg-1','pg-2','pg-3','pg-b'];
    var assigned=g.assignedDate?AW.fmtDate(g.assignedDate):'—';
    var deadline=g.deadline?AW.fmtDate(g.deadline):'';
    var dateCell='<div style="font-size:.78rem;line-height:1.5">'+
      '<div style="color:var(--aw-writing);font-weight:700">'+assigned+'</div>'+
      '<div style="font-size:.68rem;color:var(--aw-ink-3)">Assigned</div>'+
      (deadline?'<div style="color:var(--aw-danger);margin-top:4px">'+deadline+'</div><div style="font-size:.68rem;color:var(--aw-ink-3)">Deadline</div>':'')+
    '</div>';
    var ts=g.teacherScore;
    // teacher scoring cell — blank hint if not graded
    var teacherCell;
    if(ts && (ts.overall||ts.tr||ts.cc||ts.lr||ts.gra||ts.privateNote)){
      teacherCell='<div style="font-size:.76rem;line-height:1.5;width:210px"><b>'+w.length+'/3</b> attempts'+
        '<div style="margin-top:4px;padding-top:4px;border-top:1px solid var(--aw-border-2)">'+
        (ts.overall?'<div style="margin-bottom:2px"><b style="color:var(--aw-primary);font-size:.9rem">Teacher: '+ts.overall+'</b></div>':'')+
        ((ts.tr||ts.cc||ts.lr||ts.gra)?'<div style="color:var(--aw-ink-2)">TR '+(ts.tr||'—')+' · CC '+(ts.cc||'—')+' · LR '+(ts.lr||'—')+' · GRA '+(ts.gra||'—')+'</div>':'')+
        (ts.privateNote?'<div style="margin-top:5px;padding:6px;background:#EAF6EF;border-radius:6px;color:var(--aw-ink-2);white-space:normal;word-break:break-word"><b>💬 Teacher note:</b><br>'+AW.esc(ts.privateNote)+'</div>':'')+
        '</div></div>';
    } else {
      teacherCell='<div style="font-size:.76rem;line-height:1.5;width:200px"><b>'+w.length+'/3</b> attempts'+
        '<div style="margin-top:4px;color:var(--aw-ink-3);font-style:italic">Not graded by teacher yet</div></div>';
    }
    var promptPlain = g.prompt ? (AW.stripHtml?AW.stripHtml(g.prompt):g.prompt.replace(/<[^>]*>/g,' ')) : '';
    var tds='<td>'+dateCell+'</td>'+
      '<td style="text-align:left;white-space:normal;word-break:break-word;min-width:150px;max-width:200px"><b>'+AW.esc(g.topic||'')+'</b></td>'+
      '<td style="text-align:left;white-space:normal;word-break:break-word;min-width:220px;max-width:300px;font-size:.82rem;color:var(--aw-ink-2)">'+AW.esc(promptPlain)+'</td>'+
      '<td><span class="aw-tag aw-tag-type" style="font-size:.7rem">'+AW.esc(modeLabel[g.mode]||g.mode)+'</span></td>';

    return '<tr>'+tds+'</tr>';
  }).join('');

  box.innerHTML='<p style="font-size:.82rem;color:var(--aw-ink-3);margin:0 0 10px">💡 Click any <b>Band</b> score to review that attempt.</p>'+
    '<div class="p-res-wrap" style="overflow-x:auto"><table class="p-res-table"><thead>'+top+'</thead><tbody>'+body+'</tbody></table></div>';
  AW.els('.p-score').forEach(function(c){
    c.onclick=function(){ reviewGroupWrite(+c.dataset.gi,+c.dataset.wi); };
  });
}
window.reviewGroupWrite=function(gi,wi){
  var g=(window._myGroups||[])[gi]; if(!g)return;
  var w=(g.writes||[])[wi]; if(!w){AW.toast('You have not completed this attempt yet.','ok');return;}
  // build a flat record for reviewFeedback
  window._myResults=window._myResults||[];
  var rec={topic:g.topic,topicId:g.topicId,mode:g.mode,attempt:w.attempt,
    overall:w.overall,tr:w.tr,cc:w.cc,lr:w.lr,gra:w.gra,duration:w.duration,
    timestamp:w.timestamp,essay:w.essay,feedback:w.feedback};
  window._reviewRec=rec;
  reviewFeedbackRec(rec,gi);
};
window.retryFromProgress=function(mode,topicId,topic,taskType){
  location.href='write.html?mode='+encodeURIComponent(mode)+'&retry=1&topicId='+encodeURIComponent(topicId)+'&topic='+encodeURIComponent(topic)+'&type='+encodeURIComponent(taskType||'task2');
};
window.reviewFeedback=function(i){
  var r=(window._myResults||[])[i]; if(!r)return;
  reviewFeedbackRec(r,i);
};
function reviewFeedbackRec(r, refIdx){
  var i=refIdx;
  var fb=null, parseError=false;
  if(r.feedback && String(r.feedback).trim()){
    try{ fb=JSON.parse(r.feedback); }
    catch(e){ fb=null; parseError=true; console.warn('Feedback parse failed:',e,r.feedback&&r.feedback.slice(0,120)); }
  }
  window._reviewRec=r;
  // if no stored feedback (older submission), show essay + scores only
  if(!fb){
    var noticeMsg = parseError
      ? 'The stored feedback for this attempt could not be read (data format issue). Score and essay are shown below.'
      : 'This attempt has no stored AI feedback yet. This happens for submissions made before feedback storage was enabled, or if the tab was reset. New submissions show full feedback here.';
    var bodyNoFb='<div id="reviewContent">'+
      '<div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">'+
        '<div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#0A6EBD,#0A93BD);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff"><b style="font-size:1.5rem">'+(r.overall||'—')+'</b><span style="font-size:.5rem">BAND</span></div>'+
        '<div><b>'+AW.esc(r.topic||'')+'</b><p style="margin:2px 0 0;font-size:.82rem;color:#667">TR '+(r.tr||'—')+' · CC '+(r.cc||'—')+' · LR '+(r.lr||'—')+' · GRA '+(r.gra||'—')+'</p></div>'+
      '</div>'+
      '<div class="rv-block" style="background:#FFF8EC"><p style="margin:0">'+noticeMsg+'</p></div>'+
      (r.essay?'<div class="rv-block"><h4>Your essay</h4><div style="white-space:pre-wrap;font-size:.88rem;line-height:1.6;color:#334">'+AW.esc(r.essay)+'</div></div>':'<div class="rv-block"><p style="color:#889">No essay text stored.</p></div>')+
    '</div>';
    document.getElementById('reviewModalBody').innerHTML=
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'+
        '<h2 style="margin:0;font-family:var(--aw-font-display);font-size:1.3rem">Submission Review</h2>'+
        '<div><button class="aw-btn aw-btn-ghost" style="padding:6px 14px;margin-right:6px" onclick="exportReviewPDF()">⤓ Print/PDF</button>'+
        '<button class="aw-btn aw-btn-ghost" style="padding:6px 14px" onclick="closeReview()">Close</button></div>'+
      '</div>'+bodyNoFb;
    document.getElementById('reviewModal').classList.add('show');
    return;
  }
  var s=fb.scores||{};
  function crit(name,val){var pct=val?Math.min(100,(parseFloat(val)/9)*100):0;
    return '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:.85rem"><span>'+name+'</span><b>'+(val||'—')+'</b></div><div style="height:6px;background:#E5E9EE;border-radius:4px"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#0A6EBD,#0A93BD);border-radius:4px"></div></div></div>';}

  // ── Fix: repeated_errors_vi may be a string, object, or array ──
  function formatRepeated(err) {
    if (!err) return '';
    if (typeof err === 'string') return AW.esc(err);
    if (Array.isArray(err)) return err.map(function(e){
      if (typeof e === 'string') return '• ' + AW.esc(e);
      return '• ' + AW.esc(e.message || e.text || e.error || JSON.stringify(e));
    }).join('<br>');
    if (typeof err === 'object') return AW.esc(err.message || err.text || err.error || JSON.stringify(err));
    return AW.esc(String(err));
  }

  // ── Build CEFR vocab block (client-side, free) ──
  function buildCefrBlock(essay) {
    if (!essay || !window.AW || !AW.analyseVocabulary) return '';
    try {
      var vp = AW.analyseVocabulary(essay);
      if (!vp || !vp.totalWords) return '';
      var BANDS = [
        {key:'C2',label:'C2',color:'#D93025'},{key:'C1',label:'C1',color:'#E8730C'},
        {key:'B2',label:'B2',color:'#E0A32E'},{key:'B1',label:'B1',color:'#0A6EBD'},
        {key:'A2',label:'A2',color:'#1A9E5C'},{key:'A1',label:'A1',color:'#888'}
      ];
      var total = vp.listed || 1;
      function pct(key){ return Math.round(((vp.countByLevel&&vp.countByLevel[key])||0)/total*100); }
      var bar = BANDS.map(function(b){ var w=pct(b.key); return w?'<div class="aw-vocab-seg" style="flex:'+w+';background:'+b.color+'" title="'+b.label+': '+w+'%">'+(w>=8?w+'%':'')+'</div>':''; }).join('');
      var legend = BANDS.filter(function(b){ return pct(b.key)>0; }).map(function(b){
        return '<span class="aw-vocab-legend-item"><span class="aw-vocab-legend-dot" style="background:'+b.color+'"></span><b>'+b.label+'</b> '+pct(b.key)+'%</span>';
      }).join('');
      var chips = [{key:'C2',label:'C2',color:'#D93025'},{key:'C1',label:'C1',color:'#E8730C'},
                   {key:'B2',label:'B2',color:'#E0A32E'},{key:'B1',label:'B1',color:'#0A6EBD'}].map(function(b){
        var words=(vp.wordsByLevel&&vp.wordsByLevel[b.key])||[];
        if(!words.length) return '';
        return '<div class="aw-vocab-wordlist"><h4 style="color:'+b.color+'">'+b.label+' <span style="font-weight:400">('+words.length+')</span></h4>'+
          '<div class="aw-vocab-words">'+words.map(function(w){ return '<span class="aw-vocab-word" style="background:'+b.color+'18;color:'+b.color+';border:1px solid '+b.color+'44">'+AW.esc(w)+'</span>'; }).join('')+'</div></div>';
      }).join('');
      var kpi = function(val,lbl,col){ return '<div style="flex:1;min-width:60px;background:#fff;border:1px solid var(--aw-border-2);border-radius:8px;padding:7px 8px;text-align:center"><div style="font-size:1.1rem;font-weight:800;color:'+col+'">'+val+'</div><div style="font-size:.65rem;color:var(--aw-ink-3);margin-top:1px">'+lbl+'</div></div>'; };
      return '<div class="rv-block">'+
        '<h4>📊 Vocabulary Profile (CEFR)</h4>'+
        '<div class="aw-vocab-bar-wrap"><div class="aw-vocab-bar">'+bar+'</div><div class="aw-vocab-legend">'+legend+'</div></div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px">'+
          kpi((vp.pctAdvanced||0)+'%','C1+','#E8730C')+
          kpi((vp.pctUpperMid||0)+'%','B2+','#E0A32E')+
          kpi((vp.diversity||0)+'%','Đa dạng','var(--aw-primary)')+
          kpi(vp.uniqueLemmas||0,'Từ khác nhau','var(--aw-ink-2)')+
        '</div>'+
        '<div style="font-size:.73rem;color:var(--aw-ink-3);margin-bottom:8px">'+vp.listed+'/'+vp.totalWords+' từ nhận diện được</div>'+
        (chips ? '<div style="border-top:1px solid var(--aw-border-2);padding-top:10px"><div style="font-size:.8rem;font-weight:700;color:var(--aw-ink-2);margin-bottom:4px">💡 Từ vựng bạn đã dùng (B1+)</div>'+chips+'</div>' : '')+
      '</div>';
    } catch(e) { return ''; }
  }

  var body='<div id="reviewContent">'+
    '<div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">'+
      '<div style="width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#0A6EBD,#0A93BD);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff"><b style="font-size:1.5rem">'+(fb.overall||'—')+'</b><span style="font-size:.5rem">BAND</span></div>'+
      '<div><b>'+AW.esc(fb.band_description||'')+'</b><p style="margin:2px 0 0;font-size:.82rem;color:#667">'+AW.esc(r.topic||'')+' · Attempt '+(r.attempt||1)+'</p></div>'+
    '</div>'+
    crit('Task Response',s.TR)+crit('Coherence & Cohesion',s.CC)+crit('Lexical Resource',s.LR)+crit('Grammar',s.GRA)+
    (fb.overall_feedback_vi?'<div class="rv-block"><h4>Overall assessment</h4><p>'+AW.esc(fb.overall_feedback_vi)+'</p></div>':'')+
    (fb.repeated_errors_vi?'<div class="rv-block" style="background:#FFF8EC"><h4>⚠ Repeated errors</h4><p>'+formatRepeated(fb.repeated_errors_vi)+'</p></div>':'')+
    ((fb.gra_errors||[]).length?'<div class="rv-block"><h4>Grammar</h4>'+fb.gra_errors.slice(0,10).map(function(e){return '<p><span style="color:#EA4335;text-decoration:line-through">'+AW.esc(e.wrong)+'</span> → <span style="color:#1E7E42;font-weight:600">'+AW.esc(e.correct)+'</span>'+(e.explanation_vi?'<br><span style="font-size:.8rem;color:#667">'+AW.esc(e.explanation_vi)+'</span>':'')+'</p>';}).join('')+'</div>':'')+
    ((fb.lr_issues||[]).length?'<div class="rv-block"><h4>Lexical Resource</h4>'+fb.lr_issues.slice(0,8).map(function(e){return '<p><span style="color:#EA4335;text-decoration:line-through">'+AW.esc(e.original)+'</span> → <span style="color:#1E7E42;font-weight:600">'+AW.esc(e.better)+'</span>'+(e.explanation_vi?'<br><span style="font-size:.8rem;color:#667">'+AW.esc(e.explanation_vi)+'</span>':'')+'</p>';}).join('')+'</div>':'')+
    (fb.cc_feedback&&fb.cc_feedback.assessment_vi?'<div class="rv-block"><h4>Coherence & Cohesion</h4><p>'+AW.esc(fb.cc_feedback.assessment_vi)+'</p></div>':'')+
    buildCefrBlock(r.essay)+
    (r.essay?'<div class="rv-block"><h4>Your essay</h4><div style="white-space:pre-wrap;font-size:.88rem;line-height:1.6;color:#334">'+AW.esc(r.essay)+'</div></div>':'')+
  '</div>';
  document.getElementById('reviewModalBody').innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">'+
      '<h2 style="margin:0;font-family:var(--aw-font-display);font-size:1.3rem">Feedback Review</h2>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
      '<button class="aw-btn aw-btn-accent" style="padding:6px 14px" onclick="exportGoogleDoc('+i+')" title="Mở file nhận xét trên Google Docs">📄 Open Doc</button>'+
      '<button class="aw-btn aw-btn-ghost" style="padding:6px 14px" onclick="exportReviewPDF()">⤓ PDF</button>'+
      '<button class="aw-btn aw-btn-ghost" style="padding:6px 14px" onclick="shareReview('+i+')">🔗 Share</button>'+
      '<button class="aw-btn aw-btn-ghost" style="padding:6px 14px" onclick="openDiscuss('+i+')">💬 Ask teacher</button>'+
      '<button class="aw-btn aw-btn-ghost" style="padding:6px 14px" onclick="closeReview()">Close</button></div>'+
    '</div>'+body;
  document.getElementById('reviewModal').classList.add('show');
};

function routeFromHash(){
  var h=(location.hash||'').replace('#','');
  if(h==='progress'){ showProgress(); AW.setActiveNav('progress'); }
  else if(h==='translate'){ showTranslate(); AW.setActiveNav('translate'); }
  else if(h==='qa'){ showQA(); AW.setActiveNav('qa'); }
  else if(h==='settings'){ showSettings(); AW.setActiveNav('settings'); }
  else { showModes(); AW.setActiveNav('modes'); }   // '' or 'modes'
}

var _trSet=null, _trProgress=null, _trBatch=[], _trBatchResults=[], _trBatchIdx=0, _trRunStart=0;

function fmtTrTime(str){
  if(!str) return '—';
  var d=new Date(str); if(isNaN(d)) return str;
  return d.toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
}

function openTrSet(setId,preview,status){
  content.innerHTML='<div class="aw-empty"><span class="aw-spin aw-spin-dark"></span></div>';

      _trSet=r1.data;
      _trProgress=r2.success?r2.data:{runs:0,clearedItemIds:[],bestScore:0,nextRunIndex:1};
      renderTrIntro(status);

  }).catch(function(){AW.toast('Lỗi tải bài dịch.','err');});

function renderTrIntro(status){

        '</div>'+

  var sb=document.getElementById('trStartBtn');
  if(sb) sb.onclick=function(){

      _trProgress.clearedItemIds = [];
    }
    startTrRun();
  };
}

function pickTrBatch(items, clearedIds, n, shuffle){
  var cs={}; clearedIds.forEach(function(id){cs[id]=true;});
  function sh(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
  var pending = items.filter(function(it){return !cs[it.id];});
  // Ordered mode: keep original array order; Random mode: shuffle
  if(shuffle !== false) pending = sh(pending.slice());
  var batch = pending.slice(0,n);
  if(batch.length < n){
    var rest = items.filter(function(it){return !pending.some(function(p){return p.id===it.id;});});
    if(shuffle !== false) rest = sh(rest.slice());
    batch = batch.concat(rest.slice(0, n-batch.length));
  }
  return batch;
}

function startTrRun(){
  var doShuffle = _trSet.shuffle !== false; // default true
  _trBatch=pickTrBatch(_trSet.items||[],_trProgress.clearedItemIds||[],5,doShuffle);
  _trBatchResults=[]; _trBatchIdx=0; _trRunStart=Date.now();
  renderTrQuestion();
}

/*── Offline-first grading ─────────────────────────────────────────
  1. Score instantly with token-overlap (shows result immediately).
  2. Fire AI verify in background — if score differs significantly,
     silently update the display and stored result.
  This gives near-instant UX while AI refines edge cases.          */
function gradeTrItem(item,answer,cb){
  var key=AW.geminiKey.get();
  var groq=AW.groqKey&&AW.groqKey.get?AW.groqKey.get():'';

  // Step 1: immediate offline score
  var offlineResult = offlineTrGrade(item, answer);

  // If no AI key at all — return offline immediately, done
  if(!key && !groq){
    cb(offlineResult);
    return;
  }

  // Step 2: show offline result right away
  cb(offlineResult);

  // Step 3: AI refines in background (fire-and-update)
  var prompt=[
    'You are an EFL translation grader. Evaluate semantic meaning accuracy only.',
    'Direction: '+(item.direction==='en2vi'?'EN→VI':'VI→EN'),
    'Source: '+item.source,
    'Model answer: '+item.modelAnswer,
    'Student answer: '+answer,
    'Target words to check: '+(item.targetWords||[]).join(', '),
    'Be generous: partial answers that convey the main meaning score 60–75.',
    'Return ONLY valid JSON, no markdown:',
    '{"score":0-100,"feedback":"1-2 sentences in Vietnamese","usedTargets":[],"missedTargets":[]}'
  ].join('\n');

  function parse(text){
    text=text.replace(/```json[\n]?/g,'').replace(/```[\n]?/g,'').trim();
    var o=JSON.parse(text);
    return {score:Math.max(0,Math.min(100,parseInt(o.score,10)||0)),feedback:o.feedback||'',
            usedTargets:o.usedTargets||[],missedTargets:o.missedTargets||[]};
  }

  function aiUpdate(aiResult){
    // Only update if score differs by more than 5 points or has real feedback
    if(Math.abs(aiResult.score - offlineResult.score) > 5 || aiResult.missedTargets.length){
      // Find the stored result and update it
      var ps=(_trSet&&_trSet.passScore)||85;
      var wasOfflinePassed = offlineResult.score >= ps;
      var isAiPassed = aiResult.score >= ps;
      // Update in _trBatchResults
      for(var i=0;i<_trBatchResults.length;i++){
        if(_trBatchResults[i].itemId===item.id){
          _trBatchResults[i].score=aiResult.score;
          _trBatchResults[i].feedback=aiResult.feedback;
          break;
        }
      }
      // Update feedback UI if still visible
      var fbWrap=document.getElementById('trFbWrap');
      var fbContent=document.getElementById('trFbContent');
      if(fbWrap&&fbContent&&fbWrap.style.display!=='none'){
        showTrFeedbackContent(item, answer, aiResult);
        // If pass/fail changed, update next button too
        if(wasOfflinePassed !== isAiPassed){
          updateNextBtn(item, isAiPassed);
        }
        // Subtle AI-updated indicator
        var indicator = document.createElement('div');
        indicator.style.cssText='font-size:.7rem;color:var(--aw-ink-3);margin-top:4px;text-align:right';
        indicator.textContent='✓ AI verified';
        if(fbContent.parentNode) fbContent.parentNode.appendChild(indicator);
        setTimeout(function(){ if(indicator.parentNode) indicator.parentNode.removeChild(indicator); }, 3000);
      }
    }
  }

  if(key){
    var MODELS=['gemini-2.0-flash','gemini-1.5-flash'];
    var mi=0;
    function tryG(){
      if(mi>=MODELS.length){if(groq)tryGroq();return;}
      var m=MODELS[mi++];
      fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+encodeURIComponent(key),{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:200,temperature:0.1}})
      }).then(function(r){return r.json();}).then(function(d){
        var t=((((d.candidates||[])[0]||{}).content||{}).parts||[]).map(function(p){return p.text||'';}).join('');
        if(!t) throw new Error('empty'); aiUpdate(parse(t));
      }).catch(function(){tryG();});
    }
    tryG();
  } else {
    function tryGroq(){
      fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+groq},
        body:JSON.stringify({model:'llama3-8b-8192',messages:[{role:'user',content:prompt}],max_tokens:200,temperature:0.1})
      }).then(function(r){return r.json();}).then(function(d){
        var t=((d.choices||[])[0]||{}).message&&d.choices[0].message.content||'';
        if(!t) throw new Error('empty'); aiUpdate(parse(t));
      }).catch(function(){});
    }
    tryGroq();
  }
}

function offlineTrGrade(item,answer){
  function tok(s){return (s||'').toLowerCase().replace(/[^a-záàảãạăắặẳẵâấầẩẫậéèẻẽẹêếềểễệíìỉĩịóòỏõọôốồổỗộơớờởỡợúùủũụưứừửữựýỳỷỹỵđ\s]/g,'').split(/\s+/).filter(Boolean);}
  var ref=tok(item.modelAnswer),ans=tok(answer);
  var m=ans.filter(function(t){return ref.indexOf(t)>=0;}).length;
  var sc=ref.length?Math.round(Math.min(100,m/ref.length*100)):0;
  // offline is optimistic: boost by 10 to account for paraphrasing the model misses
  sc=Math.min(100, sc + 10);
  return {score:sc,feedback:'Đang chờ AI xác nhận…',usedTargets:[],missedTargets:[]};
}

function showTrFeedbackContent(item, answer, result){
  var sc=result.score, ps=(_trSet&&_trSet.passScore)||85;
  var col=sc>=ps?'var(--aw-writing)':(sc>=60?'#A66B00':'var(--aw-danger)');
  var passed=sc>=ps;
  document.getElementById('trFbContent').innerHTML=
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">'+
      '<div style="font-size:1.6rem;font-weight:800;color:'+col+'">'+sc+'%</div>'+
      '<div><div style="font-size:.82rem;font-weight:700;color:'+col+';margin-bottom:2px">'+
        (passed?'✅ Passed':'❌ Not passed — try again')+'</div>'+
        '<div style="font-size:.82rem;color:var(--aw-ink-2)">'+AW.esc(result.feedback)+'</div></div>'+
    '</div>'+
    '<div style="font-size:.82rem;background:var(--aw-surface);border-radius:8px;padding:10px 12px;border-left:3px solid var(--aw-writing);margin-bottom:4px">'+
      '<b style="font-size:.72rem;color:var(--aw-ink-3);display:block;margin-bottom:3px">MODEL ANSWER</b>'+AW.esc(item.modelAnswer)+
    '</div>'+
    (item.pattern?'<div style="font-size:.78rem;color:#8B5CF6;margin-top:8px">💡 Pattern: <b>'+AW.esc(item.pattern)+'</b></div>':'')+
    (result.missedTargets&&result.missedTargets.length?
      '<div style="font-size:.76rem;color:var(--aw-danger);margin-top:6px">Missed words: '+AW.esc(result.missedTargets.join(', '))+'</div>':'');
}

function updateNextBtn(item, passed){
  var nextBtn=document.getElementById('trNextBtn');
  if(!nextBtn) return;
  if(!passed){
    nextBtn.textContent='🔄 Try again';
    nextBtn.style.background='var(--aw-danger)';

      document.getElementById('trGradeSt').textContent='';
    };
  } else {
    nextBtn.textContent='Next →'; nextBtn.style.background='';
    nextBtn.onclick=function(){ _trBatchIdx++; if(_trBatchIdx>=_trBatch.length) renderTrRunResult(); else renderTrQuestion(); };
  }
}

function showTrFeedback(item,answer,result){
  showTrFeedbackContent(item, answer, result);
  document.getElementById('trFbWrap').style.display='';
  if(item.isTreasure){
    document.getElementById('trChestWrap').style.display='';
    document.getElementById('trAddChest').onclick=function(){
      AW.toast('💎 Saved to chest!','ok');
      _trBatch[_trBatchIdx]._savedToChest=true;
      this.disabled=true; this.textContent='✓ Saved';
    };
  }
  var passed=result.score>=( (_trSet&&_trSet.passScore)||85 );
  updateNextBtn(item, passed);
  document.getElementById('trSubmitBtn').style.display='none';
}

function renderTrRunResult(){
  var total=_trBatchResults.length||1;
  var runScore=Math.round(_trBatchResults.reduce(function(a,r){return a+(r.score||0);},0)/total);
  var passed=runScore>=(_trSet.passScore||85);
  var durSec=Math.round((Date.now()-_trRunStart)/1000);
  var prev={}; (_trProgress.clearedItemIds||[]).forEach(function(id){prev[id]=true;});
  _trBatchResults.forEach(function(r){if((r.score||0)>=(_trSet.passScore||85)) prev[r.itemId]=true;});
  var newCleared=Object.keys(prev);
  var chest=_trBatch.filter(function(it){return it._savedToChest;}).map(function(it){
    return {itemId:it.id,source:it.source,modelAnswer:it.modelAnswer,pattern:it.pattern||null};
  });
  var runIdx=_trProgress.nextRunIndex||1;
  var sessionOpen=(_trSet.sessionStatus||'open')==='open';
  if(sessionOpen){
    AW.api('translate.saveResult',{
      studentId:sess.studentId,name:sess.name||'',class:sess.class||'',
      setId:_trSet.setId,title:_trSet.title,
      runIndex:runIdx,score:runScore,passed:passed,durationSec:durSec,
      itemScores:_trBatchResults,clearedItemIds:newCleared,chest:chest
    }).then(function(r){
      if(r&&r.success){_trProgress.clearedItemIds=newCleared;_trProgress.nextRunIndex=runIdx+1;_trProgress.runs=(_trProgress.runs||0)+1;}
      else if(r&&r.error) AW.toast(r.error,'err',4000);
    }).catch(function(){AW.toast('Lỗi lưu kết quả.','err');});
    // Final heartbeat marking run complete
    AW.api('write.heartbeat',{
      studentId:sess.studentId, name:sess.name||'', class:sess.class||'',
      topicId:_trSet.setId, topic:_trSet.title, mode:'translate',
      status:'Submitted',
      wordCount: _trBatchResults.length,
      snapshot: JSON.stringify({
        setId:_trSet.setId, title:_trSet.title,
        questionsAnswered: _trBatchResults.length,
        clearedCount: newCleared.length,
        totalItems: (_trSet.items||[]).length,
        runIndex: runIdx, runScore: runScore,
      })
    });
  }
  var cleared=newCleared.length, ttl=(_trSet.items||[]).length, pct=ttl?Math.round(cleared/ttl*100):0;
  var scCol=runScore>=85?'var(--aw-writing)':(runScore>=60?'#A66B00':'var(--aw-danger)');
  var allCleared = cleared >= ttl;
  document.getElementById('awPageTitle').textContent='Round '+runIdx+' result';
  content.innerHTML=
    '<div style="max-width:520px;margin:16px auto;text-align:center;background:var(--aw-surface);border:1px solid var(--aw-border-2);border-radius:var(--aw-r);padding:28px 24px">'+
      '<div style="font-size:2.8rem;font-weight:800;color:'+scCol+'">'+runScore+'%</div>'+
      '<div style="font-size:.95rem;font-weight:700;margin:6px 0 4px;color:'+scCol+'">'+
        (passed?'✅ Passed!':'❌ Not passed')+' · Round '+runIdx+' · '+cleared+'/'+ttl+' cleared</div>'+
      '<div style="font-size:.78rem;color:var(--aw-ink-3);margin-bottom:14px">Attempt #'+runIdx+'</div>'+
      '<div style="height:8px;background:var(--aw-border-2);border-radius:4px;margin-bottom:16px">'+
        '<div style="width:'+pct+'%;height:100%;background:var(--aw-writing);border-radius:4px"></div>'+
      '</div>'+
      (allCleared?
        '<div style="background:#F0FDF4;border:1px solid #BBF7D0;border-radius:8px;padding:10px 14px;margin-bottom:16px">'+
          '<p style="font-size:.9rem;color:var(--aw-writing);font-weight:700;margin:0 0 4px">🎉 All '+ttl+' sentences cleared!</p>'+
          '<p style="font-size:.82rem;color:var(--aw-ink-2);margin:0">Play again to reinforce — sentences restart from the beginning.</p>'+
        '</div>'
        :(passed&&cleared<ttl?'<p style="font-size:.86rem;color:var(--aw-ink-2);margin-bottom:16px">'+(ttl-cleared)+' sentences left. Keep going!</p>':
        '<p style="font-size:.86rem;color:var(--aw-ink-3);margin-bottom:16px">Need ≥ '+(_trSet.passScore||85)+'% per sentence to clear. Try again!</p>'))+
      '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+
        // Always show a "continue" or "play again" button — no completion lock
        (passed&&cleared<ttl?
          '<button class="aw-btn aw-btn-primary" id="trCont" style="padding:11px 24px">Continue 5 more →</button>':'')+
        (allCleared?
          '<button class="aw-btn aw-btn-primary" id="trPlayAgain" style="padding:11px 24px">🔄 Play again</button>':'')+
        (!passed?
          '<button class="aw-btn aw-btn-primary" id="trRetry" style="padding:11px 22px">Retry this round</button>':'')+
        '<button class="aw-btn aw-btn-ghost" onclick="showTranslate()" style="padding:11px 18px">← List</button>'+
      '</div>'+
    '</div>';

  // Continue (still sentences left)
  var cb=document.getElementById('trCont');
  if(cb) cb.onclick=function(){ startTrRun(); };

  // Play again — reset cleared so all 20 sentences come back fresh
  var pa=document.getElementById('trPlayAgain');
  if(pa) pa.onclick=function(){
    _trProgress.clearedItemIds=[];  // reset for a fresh full run
    startTrRun();
  };

  // Retry same round (didn't pass)
  var rb=document.getElementById('trRetry');
  if(rb) rb.onclick=function(){_trBatchResults=[];_trBatchIdx=0;_trRunStart=Date.now();renderTrQuestion();};
}

function showTrHistory(){
  AW.api('translate.myProgress',{setId:_trSet.setId,studentId:sess.studentId}).then(function(r){
    var p=r.success?r.data:_trProgress;
    var cleared=(p.clearedItemIds||[]).length, total=(_trSet.items||[]).length;
    var pct=total?Math.round(cleared/total*100):0;
    content.innerHTML=
      '<button class="aw-btn aw-btn-ghost" onclick="renderTrIntro(\'closed\')" style="margin-bottom:14px;padding:6px 14px">← Giới thiệu</button>'+
      '<div style="max-width:520px;margin:0 auto;background:var(--aw-surface);border:1px solid var(--aw-border-2);border-radius:var(--aw-r);padding:22px 24px">'+
        '<h4 style="font-family:var(--aw-font-display);margin:0 0 14px">📊 Kết quả của bạn</h4>'+
        '<div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px">'+
          '<div style="text-align:center"><b style="font-size:1.3rem">'+p.runs+'</b><br><span style="font-size:.72rem;color:var(--aw-ink-3)">Lượt làm</span></div>'+
          '<div style="text-align:center"><b style="font-size:1.3rem;color:var(--aw-writing)">'+p.bestScore+'%</b><br><span style="font-size:.72rem;color:var(--aw-ink-3)">Best score</span></div>'+
          '<div style="text-align:center"><b style="font-size:1.3rem">'+cleared+'/'+total+'</b><br><span style="font-size:.72rem;color:var(--aw-ink-3)">Câu cleared</span></div>'+
        '</div>'+
        '<div style="height:8px;background:var(--aw-border-2);border-radius:4px;margin-bottom:14px">'+
          '<div style="width:'+pct+'%;height:100%;background:var(--aw-writing);border-radius:4px"></div>'+
        '</div>'+
        (pct===100?'<p style="color:var(--aw-writing);font-weight:700;margin:0">🎉 Đã hoàn thành 100%!</p>':
          '<p style="font-size:.85rem;color:var(--aw-ink-3);margin:0">Còn '+(total-cleared)+' câu chưa clear.</p>')+
      '</div>';
  });
}
</script>
</body>
</html>
