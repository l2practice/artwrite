<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- App icon: SVG data URI — no file, no extra request, no 404 -->
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#5661E0">
<title>Writing App</title>
<link rel="stylesheet" href="aw-theme.css">
<style>
  .aw-board-toolbar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:var(--aw-surface);border:none;border-radius:20px;padding:8px 10px;margin-bottom:14px;box-shadow:var(--aw-shadow);position:sticky;top:12px;z-index:50}
  .aw-tbtn{min-width:38px;height:38px;border:none;background:none;border-radius:12px;cursor:pointer;color:var(--aw-ink-2);font-weight:700;display:inline-grid;place-items:center;font-size:.9rem;padding:0 8px}
  .aw-tbtn:hover{background:var(--aw-primary-lt);color:var(--aw-primary)}
  .aw-tbtn.on{background:var(--aw-primary);color:#fff}
  .aw-tsep{width:1px;height:22px;background:var(--aw-border);margin:0 4px}
  .aw-tcolor{width:26px;height:26px;border:none;border-radius:6px;cursor:pointer;padding:0;background:none}
  .aw-tcolor-sw{width:22px;height:22px;border-radius:4px;border:2px solid rgba(0,0,0,.15);cursor:pointer;display:inline-block;vertical-align:middle;padding:0;margin:0 1px;transition:transform .12s,border-color .12s;flex-shrink:0}
  .aw-tcolor-sw:hover{transform:scale(1.25);border-color:rgba(0,0,0,.5)}
  .aw-canvas-wrap{background:var(--aw-surface);border:none;border-radius:var(--aw-r-lg);box-shadow:var(--aw-shadow);overflow:auto;padding:0}
  .aw-canvas{min-height:60vh;padding:40px 48px;font-size:16px;line-height:1.7;color:var(--aw-ink);outline:none;transform-origin:top left;transition:transform .15s,font-size .15s;overflow-wrap:break-word}
  .aw-canvas:empty:before{content:attr(data-ph);color:var(--aw-ink-3)}
  .aw-canvas img{max-width:100%;height:auto;border-radius:14px;margin:6px 0;cursor:pointer}
  /*── tables ──*/
  .aw-canvas table{border-collapse:collapse;table-layout:fixed;margin:8px 0;max-width:none}
  .aw-canvas td,.aw-canvas th{border:1px solid var(--aw-ink-3,#6b7280);padding:6px 8px;vertical-align:top;overflow-wrap:anywhere;min-width:20px}
  .aw-canvas table.aw-nob td,.aw-canvas table.aw-nob th{border-color:transparent}
  /*── free layer (text boxes, drawing, shapes) ──*/
  .aw-canvas{position:relative}
  .aw-fl{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:2;user-select:none}
  .aw-fl.t-pen,.aw-fl.t-hl,.aw-fl.t-eraser,.aw-fl.t-shape,.aw-fl.t-text,.aw-fl.t-select{pointer-events:auto;touch-action:none}
  .aw-fl.t-pen,.aw-fl.t-hl,.aw-fl.t-shape,.aw-fl.t-text{cursor:crosshair}
  .aw-fl.t-eraser{cursor:cell}
  .aw-fl.t-select{cursor:default}
  .aw-fl-svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .aw-fl .fo{pointer-events:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .aw-fl .fo path,.aw-fl .fo ellipse{vector-effect:non-scaling-stroke}
  .aw-fl .fo[data-k="pen"],.aw-fl .fo[data-k="hl"]{fill:none}
  .aw-fl .fo[data-k="hl"]{stroke-opacity:.45;mix-blend-mode:multiply;stroke-linecap:butt}
  .aw-fl.t-select .fo,.aw-fl.t-select .fo *,.aw-fl.t-eraser .fo,.aw-fl.t-eraser .fo *{pointer-events:visiblePainted}
  .aw-fb{position:absolute;min-width:60px;padding:4px 6px;line-height:1.35;outline:none;overflow-wrap:anywhere;white-space:pre-wrap;box-sizing:border-box;pointer-events:auto;user-select:text;border-radius:4px}
  .aw-fb[contenteditable="true"]{outline:2px dashed var(--aw-primary);background:rgba(255,255,255,.6);cursor:text}
  .aw-fb[contenteditable="true"]:empty:before{content:'Type here…';color:#999}
  .aw-fl.t-pen .aw-fb,.aw-fl.t-hl .aw-fb,.aw-fl.t-shape .aw-fb,.aw-fl.t-text .aw-fb,.aw-fl.t-eraser .aw-fb{pointer-events:none}
  .aw-fl.t-select .aw-fb{cursor:move}
  .aw-canvas.free-on{caret-color:transparent}
  .aw-cols{column-gap:32px;column-rule:1px solid var(--aw-border)}
  .aw-flsel{position:fixed;z-index:60;border:1.5px solid var(--aw-primary);pointer-events:none;box-sizing:border-box}
  .aw-flsel .h{position:absolute;width:10px;height:10px;background:#fff;border:2px solid var(--aw-primary);border-radius:50%;pointer-events:auto;touch-action:none}
  .aw-flsel .h[data-h="nw"]{left:-6px;top:-6px;cursor:nwse-resize}.aw-flsel .h[data-h="n"]{left:calc(50% - 5px);top:-6px;cursor:ns-resize}
  .aw-flsel .h[data-h="ne"]{right:-6px;top:-6px;cursor:nesw-resize}.aw-flsel .h[data-h="e"]{right:-6px;top:calc(50% - 5px);cursor:ew-resize}
  .aw-flsel .h[data-h="se"]{right:-6px;bottom:-6px;cursor:nwse-resize}.aw-flsel .h[data-h="s"]{left:calc(50% - 5px);bottom:-6px;cursor:ns-resize}
  .aw-flsel .h[data-h="sw"]{left:-6px;bottom:-6px;cursor:nesw-resize}.aw-flsel .h[data-h="w"]{left:-6px;top:calc(50% - 5px);cursor:ew-resize}
  .aw-flsel .mv,.aw-flsel .rt{position:absolute;width:28px;height:28px;border-radius:50%;background:var(--aw-primary);color:#fff;display:grid;place-items:center;pointer-events:auto;cursor:move;box-shadow:0 2px 6px rgba(0,0,0,.25);touch-action:none;font-style:normal}
  .aw-flsel .mv{left:-36px;bottom:-36px}
  .aw-flsel .rt{left:50%;top:-52px;margin-left:-14px;cursor:grab;display:none}
  .aw-flsel .rt::after{content:'';position:absolute;left:50%;top:100%;width:1.5px;height:24px;background:var(--aw-primary);transform:translateX(-50%)}
  .aw-flsel.rotok .rt{display:grid}
  .aw-flsel .mv svg,.aw-flsel .rt svg{width:16px;height:16px;pointer-events:none;transform:rotate(calc(-1 * var(--rot,0deg)))}
  .aw-flsel .ic svg{transform:rotate(calc(-1 * var(--rot,0deg)))}
  .aw-flsel .ic{position:absolute;width:28px;height:28px;border-radius:50%;background:#fff;border:1.5px solid var(--aw-primary);color:var(--aw-primary);display:grid;place-items:center;pointer-events:auto;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18);touch-action:none}
  .aw-flsel .ic svg{width:15px;height:15px;pointer-events:none}
  .aw-flsel .ic.dl{left:-36px;top:-36px;color:#B42318;border-color:#B42318}
  .aw-flsel .ic.dp{right:-36px;top:-36px}
  .aw-flsel .ic.co{right:-36px;bottom:-36px}
  .aw-flsel.edge-l .ic.dl,.aw-flsel.edge-l .mv{left:6px}
  .aw-flsel.edge-r .ic.dp,.aw-flsel.edge-r .ic.co{right:6px}
  .aw-flsel.edge-t .ic.dl,.aw-flsel.edge-t .ic.dp{top:6px}
  .aw-flsel.edge-b .mv,.aw-flsel.edge-b .ic.co{bottom:6px}
  .aw-flsel .fl{position:absolute;left:50%;bottom:-38px;transform:translateX(-50%);background:var(--aw-primary);color:#fff;font-style:normal;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;cursor:pointer;pointer-events:auto;white-space:nowrap;display:none}
  .aw-flsel.free .fl{display:block}
  .aw-flsel.pic .ic.co{display:none}
  .aw-flsel.tbl .h[data-h="n"],.aw-flsel.tbl .h[data-h="s"],.aw-flsel.tbl .h[data-h="e"],.aw-flsel.tbl .h[data-h="w"]{display:none}
  .aw-tfree{box-shadow:0 0 0 1px rgba(86,97,224,.25)}
  body.aw-embed .aw-side,body.aw-embed .aw-topbar,body.aw-embed .aw-menu-btn,body.aw-embed [data-fs]{display:none!important}
  body.aw-embed .aw-shell{grid-template-columns:minmax(0,1fr);padding:8px;gap:0}
  body.aw-fs .aw-side,body.aw-fs .aw-topbar,body.aw-fs .aw-menu-btn{display:none!important}
  body.aw-fs .aw-shell{grid-template-columns:minmax(0,1fr);padding:8px;gap:0}
  body.aw-fs .aw-content{padding-top:6px}
  #fsExit{position:fixed;right:14px;bottom:14px;z-index:950;border:none;border-radius:999px;background:#15171C;color:#fff;font-weight:700;font-size:.8rem;padding:9px 16px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);opacity:.85}
  #fsExit:hover{opacity:1}
  .aw-fb:hover{outline:1px dashed var(--aw-primary-lt)}
  .aw-flsel .vp{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--aw-primary);pointer-events:auto;cursor:crosshair;display:none;touch-action:none}
  .aw-flsel .vp.mid{border-color:#F08C00}
  .aw-flsel.poly .h{display:none}
  .aw-flbadge{position:fixed;z-index:70;transform:translate(-50%,-50%);background:#15171C;color:#fff;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:999px;pointer-events:none;white-space:nowrap}
  .aw-fllasso{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:60;pointer-events:none}
  .aw-ruler{position:fixed;left:0;top:0;height:46px;z-index:55;display:none;pointer-events:none;border-radius:6px;background:rgba(255,236,170,.72);border:1.5px solid rgba(120,90,0,.55);box-shadow:0 2px 8px rgba(0,0,0,.18);transform-origin:50% 50%;background-image:repeating-linear-gradient(90deg,rgba(80,60,0,.6) 0 1px,transparent 1px 37.8px),repeating-linear-gradient(90deg,rgba(80,60,0,.4) 0 1px,transparent 1px 7.56px);background-size:100% 12px,100% 6px;background-repeat:no-repeat;background-position:0 0,0 0}
  .aw-ruler .rl-mid{position:absolute;left:50%;top:50%;width:46px;height:20px;transform:translate(-50%,-50%);background:rgba(120,90,0,.18);border-radius:10px;cursor:move;pointer-events:auto;touch-action:none}
  .aw-ruler .rl-end{position:absolute;top:50%;width:24px;height:24px;margin-top:-12px;border-radius:50%;background:rgba(120,90,0,.28);cursor:grab;pointer-events:auto;touch-action:none}
  .aw-ruler .rl-end.l{left:6px}.aw-ruler .rl-end.r{right:6px}
  .aw-ruler .rl-deg{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);font-size:.7rem;color:#5a4300}
  .aw-rb-b.aw-txt{font-size:.74rem;white-space:nowrap}
  .aw-rb-b.aw-ls{min-width:38px}
  .aw-fltick{position:fixed;width:2.4px;height:15px;background:var(--aw-primary);border-radius:2px;pointer-events:none;z-index:70}
  .aw-flband{position:fixed;z-index:60;border:1.5px dashed var(--aw-primary);background:rgba(86,97,224,.1);pointer-events:none}
  .aw-fpanel{position:fixed;z-index:800;background:var(--aw-surface);border-radius:16px;box-shadow:0 10px 32px rgba(0,0,0,.25);max-height:68vh;display:flex;flex-direction:column;overflow:hidden}
  .aw-fp-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--aw-primary);color:#fff;cursor:move;user-select:none;touch-action:none}
  .aw-fp-x{border:none;background:none;color:#fff;font-size:1.3rem;cursor:pointer;line-height:1}
  .aw-fp-body{padding:10px;overflow:auto;flex:1;min-height:0}
  .aw-fp-rs{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 52%,var(--aw-border) 52%,var(--aw-border) 60%,transparent 60%,transparent 70%,var(--aw-border) 70%,var(--aw-border) 78%,transparent 78%);border-bottom-right-radius:16px}
  .aw-fp-tip{font-size:.72rem;color:var(--aw-ink-3);margin-top:8px;line-height:1.4}
  .aw-shgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px}
  .aw-shsep{grid-column:1/-1;height:1px;background:var(--aw-border);margin:3px 0}
  .aw-shbtn{height:40px;border:1px solid var(--aw-border);background:var(--aw-surface);border-radius:8px;cursor:pointer;color:var(--aw-ink-2);display:grid;place-items:center;padding:0}
  .aw-shbtn svg{width:26px;height:26px}
  .aw-shbtn:hover,.aw-shbtn.cur{background:var(--aw-primary-lt);color:var(--aw-primary);border-color:var(--aw-primary)}
  .aw-symseg{display:flex;gap:4px;margin-bottom:8px}
  .aw-symseg button{flex:1;border:none;background:var(--aw-surface-2);border-radius:8px;padding:6px;font-weight:600;cursor:pointer;color:var(--aw-ink-2)}
  .aw-symseg button.cur{background:var(--aw-primary);color:#fff}
  .aw-symhd{display:flex;align-items:center;justify-content:space-between;font-size:.74rem;font-weight:700;color:var(--aw-ink-2);margin:10px 0 4px}
  .aw-symhd label{font-weight:500;color:var(--aw-ink-3);display:inline-flex;gap:3px;align-items:center}
  .aw-symgrid{display:flex;flex-wrap:wrap;gap:4px}
  .sym-chip{min-width:34px;height:32px;padding:0 9px;border-radius:7px;border:1px solid var(--aw-border);font-size:13px;font-weight:700;color:var(--aw-ink);background:var(--aw-surface);cursor:pointer}
  .sym-chip.ring{width:36px;min-width:36px;height:36px;padding:0;border-radius:50%;border:1.5px solid var(--aw-ink);font-size:12px}
  .sym-chip.two{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;height:42px;padding:0 8px;line-height:1.05}
  .sym-chip.two small{font-size:10.5px;font-weight:600}
  .sym-chip.it{font-style:italic;font-weight:600}
  .sym-chip:hover,.sym-chip.cur{background:var(--aw-primary-lt);border-color:var(--aw-primary);color:var(--aw-primary)}
  .sym-own{display:inline-flex;align-items:center;gap:1px}
  .sym-del{border:none;background:none;color:var(--aw-ink-3);cursor:pointer;font-size:1rem}
  .aw-symadd{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:.78rem}
  .aw-symadd input[type=text],.aw-symadd input:not([type]){width:90px;border:1.5px solid var(--aw-border);border-radius:8px;padding:4px 6px;background:var(--aw-surface);color:var(--aw-ink)}
  .aw-symadd button{border:none;background:var(--aw-primary);color:#fff;border-radius:8px;padding:5px 12px;font-weight:600;cursor:pointer}
  .aw-cust{position:relative;display:inline-grid;place-items:center;font-size:.8rem;font-weight:700;color:#555;background:#fff;overflow:hidden}
  .aw-cust input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  /*── ribbon (Word-style) ──*/
  .aw-ribbon{position:sticky;top:8px;z-index:50;background:var(--aw-surface);border-radius:20px;box-shadow:var(--aw-shadow);margin-bottom:14px}
  .aw-rb-tabs{display:flex;align-items:center;gap:2px;padding:6px 12px 0;border-bottom:1px solid var(--aw-border)}
  .aw-rb-tab{border:none;background:none;padding:7px 16px;border-radius:10px 10px 0 0;font-weight:600;font-size:.86rem;color:var(--aw-ink-2);cursor:pointer;border-bottom:3px solid transparent}
  .aw-rb-tab:hover{background:var(--aw-surface-2)}
  .aw-rb-tab.on{color:var(--aw-primary);border-bottom-color:var(--aw-primary);font-weight:700}
  .aw-rb-tab-tbl{opacity:.55}
  .aw-rb-tab-tbl.live{opacity:1;color:#fff;background:var(--aw-primary);border-radius:10px 10px 0 0}
  .aw-rb-tab-tbl.live.on{border-bottom-color:var(--aw-primary-dk,#3a43b5)}
  .aw-rb-panel{display:flex;flex-wrap:wrap;align-items:stretch;padding:8px 10px 6px}
  .aw-rb-panel[hidden]{display:none}
  .aw-rb-panel.idle .aw-rb-grp{opacity:.5}
  .aw-rb-panel.awm{position:relative;align-items:stretch;padding:8px 6px}
  .awm .awm-col{justify-content:center;gap:6px;padding:0 14px}
  .awm .awm-col:first-child{padding-left:4px}
  .awm .awm-col:nth-last-child(2){border-right:0}
  .awm .aw-rb-row{flex-wrap:wrap;min-height:36px;gap:3px}
  @media (min-width:700px){ .awm .aw-rb-row{flex-wrap:nowrap} }
  .awm .aw-rb-b{min-width:34px;height:34px}
  .awm .awm-lab{gap:6px;font-size:.8rem;padding:0 7px}
  .awm .awm-lab svg{width:18px;height:18px;flex:none}
  .awm .aw-tcolor-sw{width:24px;height:24px;border-radius:6px;display:inline-grid;place-items:center}
  .awm .awm-chip{width:32px;height:32px;border-radius:10px;background:var(--aw-surface-2,#f3f4fb);display:inline-grid;place-items:center;color:var(--aw-ink-2);margin-right:4px;flex:none}
  .awm .aw-ls{min-width:42px}
  .awm .aw-tl-f{display:inline-flex;align-items:center;gap:5px;font-weight:700}
  .awm-pop{position:absolute;z-index:70;min-width:220px;padding:6px;background:#fff;border-radius:14px;box-shadow:0 12px 32px rgba(30,40,90,.18),0 0 0 1px var(--aw-border);display:flex;flex-direction:column;gap:2px}
  .awm-pop[hidden]{display:none}
  .awm-pop .aw-rb-b{width:100%;justify-content:flex-start;padding:0 12px}
  .aw-rb-grp{display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:0 12px;border-right:1px solid var(--aw-border)}
  .aw-rb-grp:last-child{border-right:none}
  .aw-rb-row{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
  .aw-rb-lbl{font-size:.68rem;color:var(--aw-ink-3);text-align:center;margin-top:2px}
  .aw-rb-hint{font-size:.7rem;color:var(--aw-ink-3)}
  .aw-rb-b{min-width:30px;height:30px;border:none;background:none;border-radius:8px;cursor:pointer;color:var(--aw-ink-2);display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:.84rem;font-weight:600;padding:0 6px;position:relative}
  .aw-rb-b:hover{background:var(--aw-primary-lt);color:var(--aw-primary)}
  .aw-rb-b.on{background:var(--aw-primary);color:#fff}
  .aw-rb-t{background:var(--aw-surface-2);font-size:.78rem}
  .aw-rb-big{flex-direction:column;height:54px;min-width:58px;font-size:.74rem;gap:2px}
  .aw-rb-big svg{width:22px;height:22px}
  .aw-rb-caret{min-width:14px;width:14px;padding:0;font-size:.7rem}
  .aw-rb-split{display:inline-flex;align-items:center;background:var(--aw-surface-2);border-radius:8px}
  .aw-rb-bar{position:absolute;left:6px;right:6px;bottom:2px;height:3px;border-radius:2px}
  .aw-rb-sel{height:30px;border:1.5px solid var(--aw-border);border-radius:8px;background:var(--aw-surface);color:var(--aw-ink);font-size:.8rem;padding:0 6px;font-family:inherit}
  .aw-rb-size .aw-rb-sel{width:52px;text-align:center}
  .aw-pal{position:fixed;z-index:900;background:var(--aw-surface);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:10px;width:184px}
  .aw-pal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
  .aw-pal-grid button{height:26px;border:1px solid rgba(0,0,0,.18);border-radius:4px;cursor:pointer;padding:0}
  .aw-pal-grid button:hover{outline:2px solid var(--aw-primary)}
  .aw-pal-row{display:flex;align-items:center;justify-content:space-between;width:100%;border:none;background:none;padding:6px 4px;font-size:.8rem;color:var(--aw-ink-2);cursor:pointer;border-radius:6px;text-align:left}
  .aw-pal-row:hover{background:var(--aw-surface-2)}
  .aw-selcells{position:fixed;left:0;top:0;width:0;height:0;z-index:45;pointer-events:none}
  .aw-selcell{position:fixed;box-sizing:border-box;border:2px solid var(--aw-primary);border-radius:2px}
  .aw-selcell.multi{background:rgba(86,97,224,.22)}
  .aw-tl-f{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:.78rem}
  .aw-tl-f input{width:58px;border:1.5px solid var(--aw-border);border-radius:8px;padding:4px 6px;font-size:.8rem;background:var(--aw-surface);color:var(--aw-ink)}
  .aw-tl-grid{display:inline-grid;grid-template-columns:repeat(3,28px);gap:2px}
  .aw-tl-al{min-width:28px!important;height:26px!important;padding:0!important}
  .aw-tblpick{position:fixed;z-index:900;background:var(--aw-surface);border-radius:14px;box-shadow:var(--aw-shadow-lg,0 8px 24px rgba(0,0,0,.2));padding:10px}
  .aw-tblpick-lbl{font-size:.8rem;font-weight:700;margin-bottom:6px;color:var(--aw-ink-2)}
  .aw-tblpick-grid{display:grid;grid-template-columns:repeat(10,20px);gap:2px}
  .aw-tblpick-grid i{width:20px;height:20px;border:1px solid var(--aw-border);border-radius:3px;display:block;cursor:pointer}
  .aw-tblpick-grid i.on{background:var(--aw-primary-lt);border-color:var(--aw-primary)}
  .aw-canvas img.selected{outline:2px solid var(--aw-primary);outline-offset:2px}
  .aw-img-controls{position:fixed;z-index:60;display:none;gap:3px;background:#1E2142;border-radius:14px;padding:5px 6px;box-shadow:0 4px 20px rgba(0,0,0,.4);flex-wrap:wrap;max-width:340px;align-items:center}
  /*── student help tools (raise hand / ask teacher) ──*/

<body>
<div id="app"></div>

<div class="aw-img-controls" id="imgCtrl">
  <button id="imgMatchPrev" title="Đồng bộ kích thước với ảnh liền trước">↕ Same size</button>

</div>

<div class="aw-modal-bg" id="boardModal"><div class="aw-modal2 bm-body"></div></div>
<style>
  .aw-modal-bg{position:fixed;inset:0;background:rgba(16,34,46,.5);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
  .aw-modal-bg.show{display:flex}
  .aw-modal2{background:var(--aw-surface);border-radius:var(--aw-r-lg);width:100%;max-width:460px;box-shadow:var(--aw-shadow-lg);padding:28px}
</style>

<script src="aw-common.js"></script>
<script src="aw-free.js?v=3"></script>
<script>
if (typeof AW === 'undefined') {
  document.body.innerHTML = '<div style="max-width:560px;margin:80px auto;padding:30px;border:2px solid #EA4335;border-radius:14px;font-family:system-ui;color:#1E2142"><h2>&#9888; Kh&ocirc;ng t&#7843;i &#273;&#432;&#7907;c aw-common.js</h2><p>File <b>aw-common.js</b> v&agrave; <b>aw-theme.css</b> ph&#7843;i n&#7857;m <b>c&ugrave;ng th&#432; m&#7909;c</b> v&#7899;i file HTML n&agrave;y tr&ecirc;n GitHub. Upload &#273;&#7911; ch&uacute;ng r&#7891;i t&#7843;i l&#7841;i trang.</p></div>';
  throw new Error('aw-common.js not loaded');
}

var sess = AW.session.require();
if (!sess) throw 'redirect';
/* ?view=1 : the teacher looks at a board read-only (as a student sees it), e.g. from Live Observation; ?embed=1 hides the page frame */
var VIEW = /[?&]view=1/.test(location.search), EMBED = /[?&]embed=1/.test(location.search);
var isTeacherUser = sess.role === 'teacher';
var isTeacher = isTeacherUser && !VIEW;
if (EMBED) document.body.classList.add('aw-embed');

var nav = AW.navFor(isTeacherUser ? 'teacher' : 'student', 'board');

var content = AW.renderShell({
  mount:'app', nav:nav,
  eyebrow:'', title:'Interactive Board'
});

var curBoard=null, zoom=1, saveTimer=null, pollTimer=null;
var BASE_CANVAS_PX = 16;  // matches .aw-canvas font-size; student zoom scales from this

/*──── resolve which class this board belongs to ────*/
// Teacher: use the class selected in the dashboard (localStorage 'aw_teacher_class')
// Student: use their own class from session
function myBoardClass(){
  if (isTeacherUser) return localStorage.getItem('aw_teacher_class') || sess.class || '';
  return sess.class || '';
}

/*──── board list ────*/
var teacherClasses=[];
function showList(){
  stopPoll();
  document.getElementById('awPageTitle').textContent='Interactive Board';
  content.innerHTML =
    (isTeacher ? '<button class="aw-btn aw-btn-primary" id="newBoard" style="margin-bottom:18px">+ New Board</button>' : '') +
    '<div id="boardGrid" class="aw-grid"><div class="aw-empty"><span class="aw-spin aw-spin-dark"></span></div></div>';
  if (isTeacher){
    document.getElementById('newBoard').onclick=openBoardModal;
    // preload teacher's classes for the class dropdown
    AW.api('class.list',{teacherEmail:sess.email}).then(function(r){ teacherClasses=(r&&r.data)||[]; });
  }
  AW.api('board.list',{class:myBoardClass()}).then(function(res){
    var rows=(res&&res.data)||[];
    var grid=document.getElementById('boardGrid');
    if(!rows.length){grid.innerHTML='<div class="aw-empty">'+AW.icon('modes')+'<p>'+(isTeacher?'No boards yet. Click "+ New Board".':'No boards for your class yet.')+'</p></div>';return;}
    grid.innerHTML=rows.map(function(b){
      return '<div class="aw-board-card" data-id="'+AW.esc(b.boardId)+'">' +
        '<h3>'+AW.esc(b.title)+'</h3>' +
        (b.className||b.class?'<span class="aw-tag aw-tag-type" style="font-size:.72rem">'+AW.esc(b.className||b.class)+'</span> ':'') +
        '<div class="meta">Updated: '+(b.updatedAt?new Date(b.updatedAt).toLocaleString():'—')+'</div>' +
        (isTeacher?'<button class="aw-btn aw-btn-ghost" style="padding:5px 12px;margin-top:10px" data-del="'+AW.esc(b.boardId)+'">Delete</button>':'') +
        '</div>';
    }).join('');
    AW.els('.aw-board-card').forEach(function(c){
      c.onclick=function(e){ if(e.target.hasAttribute('data-del'))return; openBoard(c.dataset.id); };
    });
    AW.els('[data-del]').forEach(function(b){
      b.onclick=function(e){ e.stopPropagation();
        if(confirm('Delete this board?')) AW.api('board.delete',{boardId:b.dataset.del}).then(showList);
      };
    });
  });
}

function openBoardModal(){
  var classOpts = teacherClasses.length
    ? teacherClasses.map(function(c){
        var sel=(c.classId===myBoardClass())?' selected':'';
        return '<option value="'+AW.esc(c.classId)+'"'+sel+'>'+AW.esc(c.className)+' ('+AW.esc(c.classId)+')</option>';
      }).join('')
    : '<option value="'+AW.esc(myBoardClass())+'">'+AW.esc(myBoardClass()||'(current class)')+'</option>';
  var bg=document.getElementById('boardModal');
  bg.querySelector('.bm-body').innerHTML=
    '<h2 style="margin:0 0 4px;font-family:var(--aw-font-display);font-size:1.4rem">Create New Board</h2>'+
    '<p style="margin:0 0 18px;color:var(--aw-ink-2);font-size:.9rem">Only students in the selected class will see this board.</p>'+
    '<div class="aw-field"><label class="aw-label">Board title</label>'+
      '<input class="aw-input" id="bmTitle" placeholder="e.g. Week 1 — Lesson Board"></div>'+
    '<div class="aw-field"><label class="aw-label">Class</label>'+
      '<select class="aw-select" id="bmClass" style="width:100%">'+classOpts+'</select></div>'+
    '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">'+
      '<button class="aw-btn aw-btn-ghost" id="bmCancel">Cancel</button>'+
      '<button class="aw-btn aw-btn-primary" id="bmCreate">Create Board</button>'+
    '</div>';
  bg.classList.add('show');
  document.getElementById('bmCancel').onclick=function(){ bg.classList.remove('show'); };
  document.getElementById('bmCreate').onclick=function(){
    var title=document.getElementById('bmTitle').value.trim();
    var cls=document.getElementById('bmClass').value;
    if(!title){AW.toast('Enter a board title.','err');return;}
    var btn=this; btn.disabled=true; btn.textContent='Creating…';
    AW.api('board.create',{class:cls,title:title,owner:sess.name||sess.email}).then(function(res){
      if(res&&res.success){ bg.classList.remove('show'); AW.toast('Board created','ok'); openBoard(res.data.boardId); }
      else AW.toast('Failed to create','err');
    }).finally(function(){ btn.disabled=false; btn.textContent='Create Board'; });
  };
}

/*──── open board ────*/
function openBoard(id){
  AW.api('board.get',{boardId:id}).then(function(res){
    if(!res||!res.success){AW.toast('Không mở được bảng','err');return;}
    curBoard=res.data; zoom=isTeacher ? boardSavedZoom() : 1;
    renderBoard();
    if(!isTeacher){ startStudentPoll(); }
  });
}

/*── Student board polling ──────────────────────────────────────
  Uses meta-first pattern: poll board.meta (lightweight — only boardId + updatedAt)
  every 15s. Only fetch the full board.get when updatedAt has changed.
  Pauses when the tab is hidden to reduce Apps Script quota usage.              */
var _boardUnsub=null;
function startStudentPoll(){
  stopPoll();
  if (AW.firebaseOn) {
    // Firebase: the board is pushed the moment the teacher saves it
    var id=curBoard.boardId;
    AW.firebaseReady().then(function(FB){
      return FB.watchBoard(id, function(b){
        if(!curBoard || curBoard.boardId!==id || b.updatedAt===curBoard.updatedAt) return;
        curBoard.content=b.content; curBoard.updatedAt=b.updatedAt;
        var canvas=document.getElementById('canvas');
        if(canvas){ canvas.innerHTML=renderForStudent(curBoard.content||''); applyZoom(); }
      });
    }).then(function(unsub){ _boardUnsub=unsub; });
    return;
  }
  pollTimer = setInterval(refreshBoardMeta, 15000);
  document.addEventListener('visibilitychange', _onBoardVisibility);
}
function _onBoardVisibility(){
  clearInterval(pollTimer); pollTimer = null;
  if(document.visibilityState === 'visible'){
    refreshBoardMeta(); // catch up immediately on refocus
    pollTimer = setInterval(refreshBoardMeta, 15000);
  }
}
function refreshBoardMeta(){
  if(!curBoard) return;
  AW.api('board.meta',{boardId:curBoard.boardId}).then(function(res){
    if(!res||!res.success) return;
    if(res.data.updatedAt !== curBoard.updatedAt){
      refreshBoard(); // content changed → fetch full board
    }
  });
}
function refreshBoard(){
  if(!curBoard)return;
  AW.api('board.get',{boardId:curBoard.boardId}).then(function(res){
    if(res&&res.success){
      curBoard=res.data;
      var canvas=document.getElementById('canvas');
      if(canvas){
        canvas.innerHTML = isTeacher ? (curBoard.content||'') : renderForStudent(curBoard.content||'');
  if(isTeacher && window.AWFree) AWFree.hydrate(canvas);
        applyZoom(); // keep the student's own zoom across live updates
      }
    }
  });
}
function stopPoll(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  if(_boardUnsub){ _boardUnsub(); _boardUnsub=null; }
  document.removeEventListener('visibilitychange', _onBoardVisibility);
}

function renderBoard(){
  document.getElementById('awPageTitle').textContent='Interactive Board';
  var toolbar = isTeacher ? buildToolbar() : studentZoomBar();
  content.innerHTML =
    '<div class="aw-board-head">' +
      '<button class="aw-btn aw-btn-ghost" style="padding:7px 14px" onclick="backList()">← Boards</button>' +
      (isTeacher
        ? '<input class="aw-board-title-in" id="boardTitle" value="'+AW.esc(curBoard.title)+'">'
        : '<span class="aw-board-title-in" style="flex:1">'+AW.esc(curBoard.title)+'</span>') +
      (isTeacher
        ? '<span class="aw-save-dot" id="saveDot">✓ Saved</span>' +
          '<button class="aw-btn aw-btn-primary" id="saveBtn" style="padding:8px 18px;font-weight:700" onclick="saveNow()">💾 Save</button>'
        : '<span class="aw-save-dot">View only</span>') +
      '<button class="aw-btn aw-btn-accent" style="padding:8px 16px" onclick="exportPDF()">Export PDF</button>' +
    '</div>' +
    toolbar +
    '<div class="aw-canvas-wrap"><div class="aw-canvas" id="canvas" '+
      (isTeacher?'contenteditable="true"':'contenteditable="false"')+
      ' data-ph="'+(isTeacher?'Type here, paste text or images, format freely…':'')+'"></div></div>';

  var canvas=document.getElementById('canvas');
  canvas.innerHTML = isTeacher ? (curBoard.content||'') : renderForStudent(curBoard.content||'');
  if(isTeacher && window.AWFree) AWFree.hydrate(canvas);

  if(isTeacher){
    if(window.AWFree) drawMockup();
    wireToolbar();
    wireTables();
    if(window.AWFree) AWFree.wire(canvas);
    document.getElementById('boardTitle').oninput=scheduleSave;
    canvas.addEventListener('input', scheduleSave);
    canvas.addEventListener('paste', onPaste);
    // Ctrl+S / Cmd+S → save immediately
    document.addEventListener('keydown', function(e){
      if((e.ctrlKey||e.metaKey) && e.key==='s'){
        e.preventDefault();
        clearTimeout(saveTimer);
        saveNow();
      }
    });
  } else {
    wireStudentZoom();
    if(!VIEW) mountBoardHelp();
  }
  applyZoom();
}

/*── Students can raise a hand / ask the teacher while reading the board ──*/
function mountBoardHelp(){
  if(document.getElementById('bdHelp'))return;
  var w=document.createElement('div');
  w.id='bdHelp';
  w.innerHTML=
    '<button class="bd-hand" id="bdHand">✋ Raise hand</button>' +
    '<button class="bd-ask" id="bdAsk">🙋 Ask Teacher</button>' +
    '<div class="bd-askpanel" id="bdAskPanel">' +
      '<div class="bd-askhead"><b>Ask your teacher</b>' +
        '<button id="bdAskClose" style="background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;line-height:1">×</button></div>' +
      '<div class="bd-asknote">Your teacher sees this live. Replies appear in <b>Q&amp;A with Teacher</b>.</div>' +
      '<textarea id="bdAskText" placeholder="Type your question about the board…"></textarea>' +
      '<button class="aw-btn aw-btn-primary" id="bdAskSend">Send</button>' +
    '</div>';
  document.body.appendChild(w);

  var raised=false;
  document.getElementById('bdHand').onclick=function(){
    raised=!raised;
    var b=this;
    AW.api('write.raiseHand',{
      studentId:sess.studentId, name:sess.name, class:sess.class,
      raised:raised, where:'Interactive Board', mode:'board'
    }).then(function(res){
      if(res&&res.success){
        b.textContent=raised?'✋ Hand raised':'✋ Raise hand';
        b.classList.toggle('on',raised);
        AW.toast(raised?'Teacher notified you raised your hand':'Hand lowered','ok');
      } else { raised=!raised; AW.toast('Could not reach the teacher','err'); }
    });
  };
  var panel=document.getElementById('bdAskPanel');
  var askFab=document.getElementById('bdAsk'), handFab=document.getElementById('bdHand');
  function showPanel(on){
    panel.classList.toggle('show', on);
    askFab.style.display = on ? 'none' : '';
    handFab.style.display = on ? 'none' : '';   // otherwise it floats over the panel
  }
  askFab.onclick=function(){ showPanel(true); document.getElementById('bdAskText').focus(); };
  document.getElementById('bdAskClose').onclick=function(){ showPanel(false); };
  document.getElementById('bdAskSend').onclick=function(){
    var t=document.getElementById('bdAskText');
    var q=(t.value||'').trim(); if(!q){AW.toast('Type your question','err');return;}
    var btn=this; btn.disabled=true; btn.textContent='Sending…';
    AW.api('query.create',{
      class:sess.class, studentId:sess.studentId, studentName:sess.name,
      mode:'board', topic:(curBoard&&curBoard.title)||'Interactive Board',
      topicId:(curBoard&&curBoard.boardId)||'', question:q, phase:'live'
    }).then(function(res){
      if(res&&res.success){ AW.toast('Sent to your teacher','ok'); t.value=''; panel.classList.remove('show'); }
      else AW.toast('Failed to send','err');
    }).finally(function(){ btn.disabled=false; btn.textContent='Send'; });
  };
}

/*── Student view ──
  Teachers enlarge text so the whole class can read it on the projector.
  On a student's own screen that huge text is unhelpful, so we strip the
  teacher's font-size choices (keeping every other format: bold, colour,
  highlight, lists, images) and give students their own zoom instead. */
function renderForStudent(html){
  var tmp=document.createElement('div');
  tmp.innerHTML=html||'';
  tmp.querySelectorAll('[style]').forEach(function(el){
    if(el.closest('.aw-fl')) return;   // text boxes on the free layer keep the size they were given
    el.style.removeProperty('font-size');
    if(!el.getAttribute('style')) el.removeAttribute('style');
  });
  // legacy <font size> tags from execCommand
  tmp.querySelectorAll('font[size]').forEach(function(el){ el.removeAttribute('size'); });
  if(window.AWFree) AWFree.hydrate(tmp);
  return tmp.innerHTML;
}
function studentZoomBar(){
  return '<div class="aw-board-toolbar" id="tb" style="justify-content:flex-end">' +
    '<button class="aw-tbtn" data-fs="1" title="Full screen: hides the side menu and the browser bars" style="font-size:.8rem;width:auto;padding:0 10px">⛶ Full screen</button>' +
    '<span style="font-size:.8rem;color:var(--aw-ink-3);margin:0 6px">Your view:</span>' +
    '<button class="aw-tbtn" data-szoom="out" title="Zoom out">➖</button>' +
    '<span class="aw-zoom-ind" id="zoomInd">100%</span>' +
    '<button class="aw-tbtn" data-szoom="in" title="Zoom in">➕</button>' +
    '<button class="aw-tbtn" data-szoom="reset" title="Reset zoom" style="font-size:.75rem">Reset</button>' +
  '</div>';
}
function wireStudentZoom(){
  AW.els('[data-szoom]').forEach(function(b){
    b.onclick=function(){
      var d=b.dataset.szoom;
      if(d==='reset') zoom=1;
      else zoom=Math.min(3, Math.max(0.5, zoom + (d==='in'?0.1:-0.1)));
      applyZoom();
    };
  });
}
window.backList=function(){ stopPoll(); if(isTeacher)saveNow(); showList(); };

/*──── full screen: the side menu, the page header and (where the browser allows) the browser bars go away ────*/
function awFullscreen(on){
  var b=document.body;
  if(on===undefined) on=!b.classList.contains('aw-fs');
  b.classList.toggle('aw-fs',on);
  var x=document.getElementById('fsExit');
  if(on){
    if(!x){ x=document.createElement('button'); x.id='fsExit'; x.type='button'; x.textContent='✕ Exit full screen'; x.onclick=function(){ awFullscreen(false); }; document.body.appendChild(x); }
    try{ var el=document.documentElement; if(!document.fullscreenElement&&el.requestFullscreen) el.requestFullscreen().catch(function(){}); else if(!document.fullscreenElement&&el.webkitRequestFullscreen) el.webkitRequestFullscreen(); }catch(e){}
  } else {
    if(x) x.remove();
    try{ if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen().catch(function(){}); else if(document.webkitFullscreenElement&&document.webkitExitFullscreen) document.webkitExitFullscreen(); }catch(e){}
  }
  setTimeout(function(){ if(window.AWFree) AWFree.fit(); window.dispatchEvent(new Event('resize')); },120);
}
document.addEventListener('fullscreenchange',function(){ if(!document.fullscreenElement&&document.body.classList.contains('aw-fs')) awFullscreen(false); });
document.addEventListener('click',function(e){ var t=e.target.closest&&e.target.closest('[data-fs]'); if(t) awFullscreen(); });
/*──── ribbon toolbar (teacher only): Home · Insert · Table Layout, like Word ────*/

function wireRibbon(){
  var canvas=document.getElementById('canvas'), tbar=document.getElementById('tb');
  var lastRange=null, pop=null, foreC='#E03131', backC='#FFF3A3', pendingPx=0;
  document.execCommand('styleWithCSS',false,false);

  // keep the caret/selection when a button or list is used
  tbar.addEventListener('mousedown',function(e){ if(!/^(INPUT|SELECT|OPTION)$/.test(e.target.tagName)) e.preventDefault(); });
  function restore(){
    var host=canvas;   // a text box on the free layer is its own editing host
    if(lastRange){ var n=lastRange.startContainer, el=n&&(n.nodeType===1?n:n.parentElement), h=el&&el.closest&&el.closest('.aw-fb'); if(h&&canvas.contains(h)) host=h; }
    host.focus();
    if(lastRange){ var s=window.getSelection(); s.removeAllRanges(); s.addRange(lastRange); }
  }
  function changed(){ scheduleSave(); state(); }
  function ed(c,v){ restore(); document.execCommand(c,false,v==null?null:v); changed(); }

  // tabs
  function showTab(name){
    [].forEach.call(tbar.querySelectorAll('.aw-rb-tab'),function(t){ t.classList.toggle('on',t.dataset.tab===name); });
    [].forEach.call(tbar.querySelectorAll('.aw-rb-panel'),function(p){ p.hidden=p.dataset.panel!==name; });
  }
  window.rbShowTab=showTab;
  [].forEach.call(tbar.querySelectorAll('.aw-rb-tab'),function(t){
    t.onclick=function(){
      if(t.dataset.tab==='table' && !document.getElementById('tabTable').classList.contains('live')) AW.toast('Bấm vào trong một ô của bảng để dùng Table Layout.','info',3000);
      showTab(t.dataset.tab);
    };
  });

  // plain editing commands
  [].forEach.call(tbar.querySelectorAll('[data-ed]'),function(b){ b.onclick=function(){ ed(b.dataset.ed); }; });
  [].forEach.call(tbar.querySelectorAll('[data-clearfmt]'),function(b){ b.onclick=function(){
    restore(); document.execCommand('removeFormat',false,null); document.execCommand('hiliteColor',false,'transparent'); changed();
  }; });

  // font family
  document.getElementById('rbFont').onchange=function(){ ed('fontName',this.value); };

  // font size (pt): a real px size on a <span>, so it survives the student view
  function applyPx(px){
    pendingPx=px; restore();
    document.execCommand('fontSize',false,'7');
    convertFonts();
    changed();
  }
  function convertFonts(){
    var fonts=canvas.querySelectorAll('font[size="7"]'); if(!fonts.length) return;
    var sel=window.getSelection(), an=sel.anchorNode, ao=sel.anchorOffset, fn=sel.focusNode, fo=sel.focusOffset, made=[];
    [].forEach.call(fonts,function(f){
      var sp=document.createElement('span'); sp.style.fontSize=pendingPx+'px';
      if(f.getAttribute('face')) sp.style.fontFamily=f.getAttribute('face');
      if(f.getAttribute('color')) sp.style.color=f.getAttribute('color');
      while(f.firstChild) sp.appendChild(f.firstChild);
      [].forEach.call(sp.querySelectorAll('[style*="font-size"]'),function(x){ x.style.removeProperty('font-size'); if(!x.getAttribute('style')) x.removeAttribute('style'); });
      f.parentNode.replaceChild(sp,f); made.push(sp);
    });
    // moving the text out of the <font> drops the selection: put it back
    if(an&&an.isConnected&&fn&&fn.isConnected&&canvas.contains(an)) sel.setBaseAndExtent(an,ao,fn,fo);
    else { var r=document.createRange(); r.setStart(made[0],0); r.setEnd(made[made.length-1],made[made.length-1].childNodes.length); sel.removeAllRanges(); sel.addRange(r); }
    if(sel.rangeCount) lastRange=sel.getRangeAt(0).cloneRange();
  }
  canvas.addEventListener('input',function(){ if(canvas.querySelector('font[size="7"]')) convertFonts(); });
  function curPt(){
    var s=window.getSelection(), n=s.rangeCount&&s.anchorNode; if(!n) return 12;
    var el=n.nodeType===3?n.parentNode:n;
    return Math.round((parseFloat(getComputedStyle(el).fontSize)||16)*0.75);
  }
  var sizeIn=document.getElementById('rbSize');
  sizeIn.onchange=function(){ var v=parseFloat(this.value); if(v>=1&&v<=400) applyPx(Math.round(v*4/3)); };
  sizeIn.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); this.onchange(); } };
  [].forEach.call(tbar.querySelectorAll('[data-grow]'),function(b){
    b.onclick=function(){
      var cur=curPt(), dir=+b.dataset.grow, nx=cur;
      if(dir>0){ nx=RB_SIZES.filter(function(s){ return s>cur+.01; })[0]||cur+8; } else { nx=RB_SIZES.filter(function(s){ return s<cur-.01; }).pop()||Math.max(1,cur-1); }
      applyPx(Math.round(nx*4/3));
    };
  });

  // colours
  function applyColour(kind,c){
    restore();
    if(kind==='fore'){ foreC=c; document.getElementById('rbForeBar').style.background=c; document.execCommand('foreColor',false,c); }
    else { if(c!=='transparent'){ backC=c; document.getElementById('rbBackBar').style.background=c; } document.execCommand('hiliteColor',false,c)||document.execCommand('backColor',false,c); }
    changed();
  }
  [].forEach.call(tbar.querySelectorAll('[data-colour]'),function(b){ b.onclick=function(){ applyColour(b.dataset.colour,b.dataset.colour==='fore'?foreC:backC); }; });
  [].forEach.call(tbar.querySelectorAll('[data-pal]'),function(b){
    b.onclick=function(e){
      e.stopPropagation();
      var kind=b.dataset.pal; closePal();
      var colours=kind==='fore'?RB_PALETTE:RB_HL;
      pop=document.createElement('div'); pop.className='aw-pal';
      pop.innerHTML='<div class="aw-pal-grid">'+colours.map(function(c){ return '<button type="button" data-c="'+c+'" style="background:'+c+'" title="'+c+'"></button>'; }).join('')+'</div>'+
        (kind==='back'?'<button type="button" class="aw-pal-row" data-c="transparent">No color</button>':'<button type="button" class="aw-pal-row" data-c="#000000">Automatic (black)</button>')+
        '<label class="aw-pal-row">More colors… <input type="color" value="#3366cc"></label>';
      var r=b.getBoundingClientRect();
      pop.style.left=Math.max(8,Math.min(r.left-40,window.innerWidth-200))+'px'; pop.style.top=(r.bottom+4)+'px';
      document.body.appendChild(pop);
      pop.addEventListener('mousedown',function(ev){ if(ev.target.tagName!=='INPUT') ev.preventDefault(); });
      pop.addEventListener('click',function(ev){ var c=ev.target.dataset&&ev.target.dataset.c; if(c){ closePal(); applyColour(kind,c); } });
      pop.querySelector('input[type=color]').onchange=function(){ var c=this.value; closePal(); applyColour(kind,c); };
    };
  });
  function closePal(){ if(pop){ pop.remove(); pop=null; } }
  document.addEventListener('mousedown',function(e){ if(pop && !pop.contains(e.target)) closePal(); });

  // paragraph: line spacing, style
  function blocksInSel(){
    var s=window.getSelection(); if(!s.rangeCount) return [];
    var r=s.getRangeAt(0);
    var all=[].slice.call(canvas.querySelectorAll('div,p,li,h1,h2,h3,blockquote')).filter(function(el){
      if(el.closest('table') && !el.closest('td,th')) return false;
      if(el.closest('.aw-fl') || el.classList.contains('aw-fl-pad')) return false;
      try{ return r.intersectsNode(el); }catch(e){ return false; }
    });
    return all.filter(function(el){ return !all.some(function(o){ return o!==el && el.contains(o); }); });
  }
  document.getElementById('rbSpacing').onchange=function(){
    var v=this.value; restore();
    var bl=blocksInSel();
    if(!bl.length){ document.execCommand('formatBlock',false,'div'); bl=blocksInSel(); }
    bl.forEach(function(el){ if(v) el.style.lineHeight=v; else el.style.removeProperty('line-height'); });
    changed();
  };
  document.getElementById('rbCols').onchange=function(){
    var n=+this.value; this.value=''; if(!n) return;
    restore();
    var sel=window.getSelection(), an=sel.anchorNode, el=an&&(an.nodeType===1?an:an.parentElement), wrap=el&&el.closest&&el.closest('.aw-cols');
    if(wrap&&canvas.contains(wrap)){
      if(n===1){ while(wrap.firstChild) wrap.parentNode.insertBefore(wrap.firstChild,wrap); wrap.remove(); } else wrap.style.columnCount=n;
      changed(); return;
    }
    if(n===1) return;
    var bl=blocksInSel();
    if(!bl.length){ document.execCommand('formatBlock',false,'div'); bl=blocksInSel(); }
    var tops=[]; bl.forEach(function(b){ while(b.parentNode&&b.parentNode!==canvas) b=b.parentNode; if(b.parentNode===canvas&&tops.indexOf(b)<0) tops.push(b); });
    if(!tops.length) return;
    var w=document.createElement('div'); w.className='aw-cols'; w.style.columnCount=n;
    tops[0].parentNode.insertBefore(w,tops[0]); tops.forEach(function(b){ w.appendChild(b); });
    changed();
  };
  document.getElementById('rbStyle').onchange=function(){
    restore(); document.execCommand('formatBlock',false,this.value); changed();
  };

  // insert: link, picture
  [].forEach.call(tbar.querySelectorAll('[data-link]'),function(b){ b.onclick=function(){
    var url=prompt('Link address (https://…)','https://'); if(!url||url==='https://') return;
    restore(); var s=window.getSelection();
    if(s.isCollapsed) document.execCommand('insertHTML',false,'<a href="'+AW.esc(url)+'" target="_blank" rel="noopener">'+AW.esc(url)+'</a>');
    else document.execCommand('createLink',false,url);
    changed();
  }; });
  document.getElementById('imgBtn').onclick=function(){ document.getElementById('imgFile').click(); };
  document.getElementById('imgFile').onchange=function(){ if(this.files[0]){ restore(); handleImage(this.files[0]); } };

  // ribbon follows the caret: pressed state of B/I/U…, font, size
  function state(){
    ['bold','italic','underline','strikeThrough','subscript','superscript','insertUnorderedList','insertOrderedList','justifyLeft','justifyCenter','justifyRight','justifyFull'].forEach(function(c){
      var on=false; try{ on=document.queryCommandState(c); }catch(e){}
      var el=tbar.querySelector('[data-ed="'+c+'"]'); if(el) el.classList.toggle('on',!!on);
    });
    var f=''; try{ f=(document.queryCommandValue('fontName')||'').replace(/["']/g,''); }catch(e){}
    var sel=document.getElementById('rbFont');
    if(f && document.activeElement!==sel) sel.value=[].some.call(sel.options,function(o){ return o.value.toLowerCase()===f.toLowerCase(); })?[].filter.call(sel.options,function(o){ return o.value.toLowerCase()===f.toLowerCase(); })[0].value:sel.value;
    if(document.activeElement!==sizeIn) sizeIn.value=String(curPt());
  }
  document.addEventListener('selectionchange',function(){
    var s=window.getSelection();
    if(s.rangeCount && canvas.contains(s.anchorNode)){ lastRange=s.getRangeAt(0).cloneRange(); state(); }
  });

  // zoom, ctrl+wheel
  [].forEach.call(tbar.querySelectorAll('[data-zoom]'),function(b){ b.onclick=function(){ boardZoomStep(b.dataset.zoom==='in'?1:-1); }; });
  var wheelSum=0, wheelAt=0;
  canvas.addEventListener('wheel', function(e){
    if(!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    if(Date.now()-wheelAt > 400) wheelSum=0;   // a pinch sends many small events
    wheelAt=Date.now(); wheelSum+=e.deltaY;
    if(Math.abs(wheelSum) >= 60){ boardZoomStep(wheelSum < 0 ? 1 : -1); wheelSum=0; }
  }, { passive:false });
}

/*── Tables (teacher): insert, drag to resize, merge, Word-style Table Layout tab ──
   Table = <table><colgroup><col style="width:Npx">…</colgroup><tr style="height:Npx">…
   Column widths live in <colgroup>, row heights on <tr>, merged cells use colspan / rowspan,
   so the HTML stays plain and the student view shows exactly what the teacher built. */
var PX_CM = 37.795;
function tblZoom(){ return (typeof zoom==='number' && zoom>0) ? zoom : 1; }
/* grid[r][c] = the cell that covers that position (merged cells appear several times) */
function tblGrid(t){
  var g=[];
  [].forEach.call(t.rows,function(tr,r){
    g[r]=g[r]||[]; var c=0;
    [].forEach.call(tr.cells,function(cell){
      while(g[r][c]) c++;
      var rs=cell.rowSpan||1, cs=cell.colSpan||1;
      for(var i=0;i<rs;i++){ g[r+i]=g[r+i]||[]; for(var j=0;j<cs;j++) g[r+i][c+j]=cell; }
      c+=cs;
    });
  });
  return g;
}
function tblCols(g){ return g.reduce(function(m,row){ return Math.max(m,row.length); },0); }
function tblPos(t,cell){ var g=tblGrid(t); for(var r=0;r<g.length;r++) for(var c=0;c<g[r].length;c++) if(g[r][c]===cell) return { r:r, c:c }; return { r:0, c:0 }; }
function tblEnsureCols(t){
  var g=tblGrid(t), n=tblCols(g), cg=t.querySelector('colgroup');
  if(!n) return null;
  if(!cg || cg.children.length!==n){
    if(cg) cg.remove();
    cg=document.createElement('colgroup');
    for(var c=0;c<n;c++){
      var w=0;
      for(var r=0;r<g.length&&!w;r++){ var cell=g[r][c]; if(cell && (cell.colSpan||1)===1) w=cell.offsetWidth; }
      var col=document.createElement('col'); col.style.width=Math.max(30,Math.round(w||100))+'px'; cg.appendChild(col);
    }
    t.insertBefore(cg,t.firstChild);
  }
  t.style.tableLayout='fixed';
  tblSyncWidth(t);
  return cg;
}
function tblWidths(t){ var cg=tblEnsureCols(t); return cg?[].map.call(cg.children,function(c){ return parseFloat(c.style.width)||60; }):[]; }
function tblSyncWidth(t){
  var cg=t.querySelector('colgroup'); if(!cg) return;
  t.style.width=[].reduce.call(cg.children,function(s,c){ return s+(parseFloat(c.style.width)||0); },0)+'px';
}
function tblSetCol(t,i,px){ var cg=tblEnsureCols(t); if(!cg||!cg.children[i]) return; cg.children[i].style.width=Math.max(30,Math.round(px))+'px'; tblSyncWidth(t); }
function tblSetRow(tr,px){ tr.style.height=Math.max(20,Math.round(px))+'px'; }
function tblHtml(rows,cols){
  var w=Math.max(60,Math.min(160,Math.floor(680/cols)));
  var h='<table class="aw-tbl" style="table-layout:fixed;width:'+(w*cols)+'px"><colgroup>';
  for(var c=0;c<cols;c++) h+='<col style="width:'+w+'px">';
  h+='</colgroup><tbody>';
  for(var r=0;r<rows;r++){ h+='<tr style="height:38px">'; for(var k=0;k<cols;k++) h+='<td><br></td>'; h+='</tr>'; }
  return h+'</tbody></table><div><br></div>';
}
function tblNewCell(){ var d=document.createElement('td'); d.innerHTML='<br>'; return d; }
/* put a new cell into row r so that it sits at grid column c */
function tblPlace(t,g,r,c,cell){
  var tr=t.rows[r], ref=null;
  for(var k=c;k<(g[r]||[]).length;k++){ var x=g[r][k]; if(x && x.parentElement===tr && x!==cell){ ref=x; break; } }
  if(ref) tr.insertBefore(cell,ref); else tr.appendChild(cell);
}

function tblPanelHtml(){
  function b(attrs,inner,title){ return '<button type="button" class="aw-rb-b aw-rb-t" '+attrs+' title="'+(title||'')+'">'+inner+'</button>'; }
  function grp(rows,label){ return '<div class="aw-rb-grp">'+rows.map(function(r){ return '<div class="aw-rb-row">'+r+'</div>'; }).join('')+'<div class="aw-rb-lbl">'+label+'</div></div>'; }
  function al(h,v,t){
    var y={t:3,m:7,b:11}[v], l1=h==='l'?[2,10]:h==='c'?[4,12]:[6,14];
    return '<button type="button" class="aw-rb-b aw-tl-al" data-al="'+({l:'left',c:'center',r:'right'}[h])+','+({t:'top',m:'middle',b:'bottom'}[v])+'" title="Align '+t+'">'+
      '<svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M'+l1[0]+' '+y+'H'+l1[1]+'M'+(l1[0]+1)+' '+(y+2.6)+'H'+(l1[1]-1)+'" fill="none"/></svg></button>';
  }
  var shades=['#FFF3A3','#B6F0C2','#BFE0FF','#FFC9D6','#E0C9FF','#E5E7EB'].map(function(c){ return '<button type="button" class="aw-tcolor-sw" data-sh="'+c+'" style="background:'+c+'" title="Shading"></button>'; }).join('')+
    '<button type="button" class="aw-tcolor-sw" data-sh="none" style="background:#fff;color:#888;font-size:.7rem;font-weight:700" title="No shading">✕</button>';
  var aligns=al('l','t','Top Left')+al('c','t','Top Center')+al('r','t','Top Right')+al('l','m','Center Left')+al('c','m','Center')+al('r','m','Center Right')+al('l','b','Bottom Left')+al('c','b','Bottom Center')+al('r','b','Bottom Right');
  return grp([
      b('data-ta="rowA"','↑ Insert Above','Insert row above')+b('data-ta="rowB"','↓ Insert Below','Insert row below')+b('data-ta="colL"','← Insert Left','Insert column left')+b('data-ta="colR"','→ Insert Right','Insert column right'),
      b('data-ta="delRow"','Delete Row')+b('data-ta="delCol"','Delete Column')+b('data-ta="delTbl"','<span style="color:#B42318">Delete Table</span>')
    ],'Rows &amp; Columns')+
    grp([
      b('data-ta="merge"','⊞ Merge Cells','Select several cells (drag across them), then merge')+b('data-ta="split"','⊟ Split Cells','Undo a merge'),
      '<span class="aw-rb-hint">Kéo chuột qua nhiều ô rồi bấm Merge</span>'
    ],'Merge')+
    grp([
      '<label class="aw-tl-f">Height <input id="tlH" type="number" step="0.1" min="0.5"> cm</label><label class="aw-tl-f">Width <input id="tlW" type="number" step="0.1" min="0.8"> cm</label>',
      b('data-ta="distR"','Distribute Rows')+b('data-ta="distC"','Distribute Columns')
    ],'Cell Size')+
    grp([ '<span class="aw-tl-grid">'+aligns+'</span>' ],'Alignment')+
    grp([ shades, b('data-ta="borders"','▦ Borders','Show / hide borders') ],'Shading &amp; Borders');
}

function wireTables(){
  var canvas=document.getElementById('canvas'), bar=document.getElementById('tblBar'), tab=document.getElementById('tabTable');
  var btn=document.getElementById('tblBtn');
  if(!canvas||!bar||!btn||!tab) return;
  var tCell=null, tCells=[], pick=null;
  // the cells that are selected are outlined by an overlay (nothing is added to the board's HTML)
  var layer=document.createElement('div'); layer.className='aw-selcells'; document.body.appendChild(layer);
  function paintSel(){
    layer.innerHTML='';
    if(!tCell||!tCell.isConnected||!tab.classList.contains('live')) return;
    var multi=tCells.length>1;
    tCells.forEach(function(c){
      var r=c.getBoundingClientRect(), d=document.createElement('div');
      d.className='aw-selcell'+(multi?' multi':'');
      d.style.cssText='left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px';
      layer.appendChild(d);
    });
  }
  window.addEventListener('scroll',paintSel,true); window.addEventListener('resize',paintSel);

  /* ── insert-table picker (Word-style grid) ── */
  btn.onclick=function(e){
    e.stopPropagation();
    if(pick){ closePick(); return; }
    pick=document.createElement('div');
    pick.className='aw-tblpick';
    var g='<div class="aw-tblpick-lbl" id="tpLbl">Insert table</div><div class="aw-tblpick-grid">';
    for(var r=1;r<=8;r++) for(var c=1;c<=10;c++) g+='<i data-r="'+r+'" data-c="'+c+'"></i>';
    pick.innerHTML=g+'</div>';
    var rc=btn.getBoundingClientRect();
    pick.style.left=Math.max(8,Math.min(rc.left,window.innerWidth-260))+'px'; pick.style.top=(rc.bottom+6)+'px';
    document.body.appendChild(pick);
    pick.addEventListener('mousedown',function(ev){ ev.preventDefault(); });
    pick.addEventListener('mouseover',function(ev){
      var t=ev.target; if(!t.dataset||!t.dataset.r) return;
      var R=+t.dataset.r, C=+t.dataset.c;
      [].forEach.call(pick.querySelectorAll('i'),function(x){ x.classList.toggle('on',+x.dataset.r<=R&&+x.dataset.c<=C); });
      pick.querySelector('#tpLbl').textContent=C+' × '+R+' table';
    });
    pick.addEventListener('click',function(ev){
      var t=ev.target; if(!t.dataset||!t.dataset.r) return;
      closePick(); insertTable(+t.dataset.r,+t.dataset.c);
    });
  };
  function closePick(){ if(pick){ pick.remove(); pick=null; } }
  document.addEventListener('mousedown',function(e){ if(pick && !pick.contains(e.target) && !btn.contains(e.target)) closePick(); });
  function insertTable(r,c){
    var sel=window.getSelection();
    if(!sel.rangeCount || !canvas.contains(sel.anchorNode)){
      canvas.focus(); var rg=document.createRange(); rg.selectNodeContents(canvas); rg.collapse(false); sel.removeAllRanges(); sel.addRange(rg);
    }
    [].forEach.call(canvas.querySelectorAll('table'),function(x){ x.__old=true; });
    document.execCommand('insertHTML',false,tblHtml(r,c));
    // caret goes into the first cell of the new table and the Table Layout tab opens
    var nt=[].filter.call(canvas.querySelectorAll('table'),function(x){ return !x.__old; })[0];
    var cell=nt&&nt.querySelector('td'); if(cell){ var rg2=document.createRange(); rg2.selectNodeContents(cell); rg2.collapse(true); var s2=window.getSelection(); s2.removeAllRanges(); s2.addRange(rg2); }
    scheduleSave(); refresh(); if(window.rbShowTab) window.rbShowTab('table');
  }

  /* ── which cells are selected (a dragged selection = the rectangle between the first and last cell) ── */
  function cellOf(n){ var el=n&&(n.nodeType===1?n:n.parentElement); var c=el&&el.closest&&el.closest('td,th'); return (c&&canvas.contains(c))?c:null; }
  function extent(t,cell){ var p=tblPos(t,cell); return { r1:p.r, c1:p.c, r2:p.r+(cell.rowSpan||1)-1, c2:p.c+(cell.colSpan||1)-1 }; }
  function rectOf(t,cells){
    var R=null;
    cells.forEach(function(c){ var e=extent(t,c); R=R?{ r1:Math.min(R.r1,e.r1), c1:Math.min(R.c1,e.c1), r2:Math.max(R.r2,e.r2), c2:Math.max(R.c2,e.c2) }:e; });
    var g=tblGrid(t), grew=true;
    while(grew){ grew=false;   // a merged cell sticking out of the rectangle pulls it wider
      for(var r=R.r1;r<=R.r2;r++) for(var c=R.c1;c<=R.c2;c++){ var cell=g[r]&&g[r][c]; if(!cell) continue; var e=extent(t,cell);
        if(e.r1<R.r1||e.c1<R.c1||e.r2>R.r2||e.c2>R.c2){ R={ r1:Math.min(R.r1,e.r1), c1:Math.min(R.c1,e.c1), r2:Math.max(R.r2,e.r2), c2:Math.max(R.c2,e.c2) }; grew=true; } }
    }
    return R;
  }
  function cellsIn(t,R){ var g=tblGrid(t), out=[]; for(var r=R.r1;r<=R.r2;r++) for(var c=R.c1;c<=R.c2;c++){ var x=g[r]&&g[r][c]; if(x&&out.indexOf(x)<0) out.push(x); } return out; }
  function selCells(){
    var sel=window.getSelection(); if(!sel.rangeCount) return [];
    var a=cellOf(sel.anchorNode); if(!a) return [];
    var f=cellOf(sel.focusNode), t=a.closest('table');
    if(!sel.isCollapsed && f && f!==a && f.closest('table')===t) return cellsIn(t,rectOf(t,[a,f]));
    return [a];
  }

  /* ── the Table Layout tab follows the caret ── */
  var raf=0;
  function refresh(){
    if(bar.contains(document.activeElement)) return;
    var c=selCells();
    if(!c.length){ tCell=null; tCells=[]; tab.classList.remove('live'); bar.classList.add('idle'); paintSel(); if(window.AWFree) AWFree.selectTable(null); return; }
    tCells=c; tCell=c[0];
    tab.classList.add('live'); bar.classList.remove('idle');
    bar.querySelector('#tlH').value=(tCell.parentElement.offsetHeight/PX_CM).toFixed(2);
    bar.querySelector('#tlW').value=(tCell.offsetWidth/PX_CM).toFixed(2);
    paintSel();
    if(window.AWFree) AWFree.selectTable(c[0].closest('table'));
  }
  bar.classList.add('idle');
  document.addEventListener('selectionchange',function(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(refresh); });
  function done(){
    scheduleSave(); paintSel();
    if(tCell && tCell.isConnected){
      var w=bar.querySelector('#tlW'),h=bar.querySelector('#tlH');
      if(document.activeElement!==w) w.value=(tCell.offsetWidth/PX_CM).toFixed(2);
      if(document.activeElement!==h) h.value=(tCell.parentElement.offsetHeight/PX_CM).toFixed(2);
    }
  }
  bar.addEventListener('mousedown',function(e){ if(!/^(INPUT|SELECT)$/.test(e.target.tagName)) e.preventDefault(); });
  function gone(){ tCell=null; tCells=[]; tab.classList.remove('live'); bar.classList.add('idle'); scheduleSave(); paintSel(); }
  function caretIn(cell){ if(!cell) return; var rg=document.createRange(); rg.selectNodeContents(cell); rg.collapse(true); var s=window.getSelection(); s.removeAllRanges(); s.addRange(rg); refresh(); }
  function need(){ if(!tCell||!tCell.isConnected){ var c=selCells(); if(c.length){ tCells=c; tCell=c[0]; } }
    if(!tCell||!tCell.isConnected){ AW.toast('Bấm vào trong một ô của bảng trước.','info',2500); return false; } return true; }

  function insRow(after){
    if(!need()) return;
    var t=tCell.closest('table'), g=tblGrid(t), n=tblCols(g), p=tblPos(t,tCell);
    var k=after?p.r+(tCell.rowSpan||1)-1:p.r;                         // reference row
    var nr=document.createElement('tr'); if(t.rows[k].style.height) nr.style.height=t.rows[k].style.height;
    var seen=[];
    for(var c=0;c<n;c++){
      var cell=g[k][c], other=after?(g[k+1]&&g[k+1][c]):(k>0&&g[k-1]&&g[k-1][c]);
      if(cell && other && other===cell){ if(seen.indexOf(cell)<0){ cell.rowSpan=(cell.rowSpan||1)+1; seen.push(cell); } continue; }   // line crosses a merged cell
      var d=tblNewCell(); if(cell){ ['textAlign','verticalAlign'].forEach(function(s){ if(cell.style[s]) d.style[s]=cell.style[s]; }); } nr.appendChild(d);
    }
    t.rows[k].parentNode.insertBefore(nr,after?t.rows[k].nextSibling:t.rows[k]); done();
  }
  function insCol(after){
    if(!need()) return;
    var t=tCell.closest('table'), cg=tblEnsureCols(t), g=tblGrid(t), p=tblPos(t,tCell);
    var ci=after?p.c+(tCell.colSpan||1):p.c, seen=[];
    for(var r=0;r<g.length;r++){
      var left=ci>0?g[r][ci-1]:null, right=g[r][ci];
      if(left && right && left===right){ if(seen.indexOf(left)<0){ left.colSpan=(left.colSpan||1)+1; seen.push(left); } continue; }
      tblPlace(t,g,r,ci,tblNewCell());
    }
    var col=document.createElement('col'); col.style.width='110px'; if(cg.children[ci]) cg.insertBefore(col,cg.children[ci]); else cg.appendChild(col);
    tblSyncWidth(t); done();
  }
  function delRow(){
    if(!need()) return;
    var t=tCell.closest('table'), g=tblGrid(t), p=tblPos(t,tCell), r=p.r;
    if(t.rows.length<=1){ delTable(); return; }
    var seen=[];
    for(var c=0;c<g[r].length;c++){
      var cell=g[r][c]; if(!cell||seen.indexOf(cell)>=0) continue; seen.push(cell);
      if((cell.rowSpan||1)>1){
        if(cell.parentElement===t.rows[r]){          // starts here: hand it to the next row
          var cp=cell.cloneNode(true); cp.rowSpan=cell.rowSpan-1; if(cp.rowSpan===1) cp.removeAttribute('rowspan');
          tblPlace(t,g,r+1,c,cp);
        } else { cell.rowSpan=cell.rowSpan-1; if(cell.rowSpan===1) cell.removeAttribute('rowspan'); }
      }
    }
    t.rows[r].remove(); scheduleSave(); caretIn(t.rows[Math.min(r,t.rows.length-1)].cells[0]); 
  }
  function delCol(){
    if(!need()) return;
    var t=tCell.closest('table'), g=tblGrid(t), ci=tblPos(t,tCell).c;
    if(tblCols(g)<=1){ delTable(); return; }
    var cg=tblEnsureCols(t), seen=[];
    for(var r=0;r<g.length;r++){
      var cell=g[r][ci]; if(!cell||seen.indexOf(cell)>=0) continue; seen.push(cell);
      if((cell.colSpan||1)>1){ cell.colSpan=cell.colSpan-1; if(cell.colSpan===1) cell.removeAttribute('colspan'); } else cell.remove();
    }
    if(cg.children[ci]) cg.children[ci].remove();
    tblSyncWidth(t); scheduleSave(); caretIn(t.rows[0].cells[Math.min(ci,t.rows[0].cells.length-1)]);
  }
  function delTable(){ if(!need()) return; if(!confirm('Xoá cả bảng này?')) return; tCell.closest('table').remove(); gone(); }
  function distRows(){ if(!need()) return; var t=tCell.closest('table'), tot=0; [].forEach.call(t.rows,function(r){ tot+=r.offsetHeight; }); var h=tot/t.rows.length; [].forEach.call(t.rows,function(r){ tblSetRow(r,h); }); done(); }
  function distCols(){ if(!need()) return; var t=tCell.closest('table'), w=tblWidths(t), tot=w.reduce(function(a,b){ return a+b; },0); w.forEach(function(_,i){ tblSetCol(t,i,tot/w.length); }); done(); }
  function setAlign(h,v){ if(!need()) return; tCells.forEach(function(c){ c.style.textAlign=h; c.style.verticalAlign=v; }); done(); }
  function setShade(col){ if(!need()) return; tCells.forEach(function(c){ if(col==='none') c.style.removeProperty('background-color'); else c.style.backgroundColor=col; }); done(); }

  function merge(){
    if(!need()) return;
    if(tCells.length<2){ AW.toast('Kéo chuột (bôi đen) qua nhiều ô liền nhau, rồi bấm Merge Cells.','info',3500); return; }
    var t=tCell.closest('table'), R=rectOf(t,tCells), cells=cellsIn(t,R);
    if(cells.length<2) return;
    var first=cells[0], keep=[];
    cells.slice(1).forEach(function(c){
      var has=c.textContent.trim()||c.querySelector('img,table');
      if(has) keep.push(c.innerHTML.replace(/(<br\s*\/?>)+$/i,''));
      c.remove();
    });
    if(keep.length){
      var own=first.textContent.trim()||first.querySelector('img,table');
      first.innerHTML=(own?first.innerHTML.replace(/(<br\s*\/?>)+$/i,'')+'<br>':'')+keep.join('<br>');
    }
    var cs=R.c2-R.c1+1, rs=R.r2-R.r1+1;
    if(cs>1) first.colSpan=cs; else first.removeAttribute('colspan');
    if(rs>1) first.rowSpan=rs; else first.removeAttribute('rowspan');
    tCell=first; tCells=[first];
    var rg=document.createRange(); rg.selectNodeContents(first); rg.collapse(true); var s=window.getSelection(); s.removeAllRanges(); s.addRange(rg);
    done();
  }
  function split(){
    if(!need()) return;
    var t=tCell.closest('table'), cs=tCell.colSpan||1, rs=tCell.rowSpan||1;
    if(cs===1&&rs===1){ AW.toast('Ô này chưa bị gộp.','info',2000); return; }
    var p=tblPos(t,tCell), g=tblGrid(t);   // positions are read from the merged layout, then the freed ones get cells
    for(var r=p.r;r<p.r+rs;r++) for(var c=p.c;c<p.c+cs;c++){
      if(r===p.r&&c===p.c) continue;
      var ref=null;
      for(var k=c+1;k<(g[r]||[]).length&&!ref;k++){ var x=g[r][k]; if(x && x!==tCell && x.parentElement===t.rows[r]) ref=x; }
      var nc=tblNewCell(); if(ref) t.rows[r].insertBefore(nc,ref); else t.rows[r].appendChild(nc);
    }
    tCell.removeAttribute('colspan'); tCell.removeAttribute('rowspan');
    done();
  }

  var acts={ rowA:function(){ insRow(false); }, rowB:function(){ insRow(true); }, colL:function(){ insCol(false); }, colR:function(){ insCol(true); },
             delRow:delRow, delCol:delCol, delTbl:delTable, distR:distRows, distC:distCols, merge:merge, split:split,
             borders:function(){ if(!need()) return; tCell.closest('table').classList.toggle('aw-nob'); done(); } };
  [].forEach.call(bar.querySelectorAll('[data-ta]'),function(b){ b.onclick=function(){ if(window.AWFree) AWFree.snap(); acts[b.dataset.ta](); }; });
  [].forEach.call(bar.querySelectorAll('[data-al]'),function(b){ b.onclick=function(){ if(window.AWFree) AWFree.snap(); var p=b.dataset.al.split(','); setAlign(p[0],p[1]); }; });
  [].forEach.call(bar.querySelectorAll('[data-sh]'),function(b){ b.onclick=function(){ if(window.AWFree) AWFree.snap(); setShade(b.dataset.sh); }; });
  bar.querySelector('#tlH').onchange=function(){ var v=parseFloat(this.value); if(!(v>0)||!need()) return; var rows=[]; tCells.forEach(function(c){ if(rows.indexOf(c.parentElement)<0) rows.push(c.parentElement); }); rows.forEach(function(r){ tblSetRow(r,v*PX_CM); }); done(); };
  bar.querySelector('#tlW').onchange=function(){
    var v=parseFloat(this.value); if(!(v>0)||!need()) return;
    var t=tCell.closest('table'), seen={};
    tCells.forEach(function(c){ var p=tblPos(t,c), cs=c.colSpan||1; for(var k=0;k<cs;k++){ if(!seen[p.c+k]){ seen[p.c+k]=1; tblSetCol(t,p.c+k,v*PX_CM/cs); } } });
    done();
  };

  /* ── Tab / Shift+Tab moves between cells; Tab in the last cell adds a row ── */
  canvas.addEventListener('keydown',function(e){
    if(e.key!=='Tab') return;
    var c=cellOf(window.getSelection().anchorNode); if(!c) return;
    e.preventDefault();
    var t=c.closest('table'), cells=[].slice.call(t.querySelectorAll('td,th')), i=cells.indexOf(c)+(e.shiftKey?-1:1);
    if(i>=cells.length){
      var g=tblGrid(t), n=tblCols(g), nr=document.createElement('tr'), last=t.rows[t.rows.length-1]; if(last.style.height) nr.style.height=last.style.height;
      for(var k=0;k<n;k++) nr.appendChild(tblNewCell());
      last.parentNode.appendChild(nr); cells=[].slice.call(t.querySelectorAll('td,th')); scheduleSave();
    }
    if(i<0) return;
    var rg=document.createRange(); rg.selectNodeContents(cells[i]); rg.collapse(true);
    var s=window.getSelection(); s.removeAllRanges(); s.addRange(rg);
  });

  /* ── drag a border to resize: column / row; corner = whole table ── */
  var EDGE=5, drag=null;
  function hit(e){
    var x=e.clientX, y=e.clientY, corner=null;
    [].forEach.call(canvas.querySelectorAll('table'),function(tb){   // the corner handle can sit just outside the table
      var r=tb.getBoundingClientRect();
      if(!corner && Math.abs(x-r.right)<=EDGE+1 && Math.abs(y-r.bottom)<=EDGE+1) corner={ mode:'both', t:tb };
    });
    if(corner) return corner;
    var t=e.target.closest&&e.target.closest('table'); if(!t||!canvas.contains(t)) return null;
    var col=null, row=null;   // the pixel on a collapsed border belongs to the <table>, so find the cell by position
    [].forEach.call(t.querySelectorAll('td,th'),function(c){
      var r=c.getBoundingClientRect();
      if(!col && y>=r.top-EDGE && y<=r.bottom+EDGE && Math.abs(x-r.right)<=EDGE){ var p=tblPos(t,c); col={ mode:'col', t:t, i:p.c+(c.colSpan||1)-1 }; }
      if(!row && x>=r.left-EDGE && x<=r.right+EDGE && Math.abs(y-r.bottom)<=EDGE){ var q=tblPos(t,c); row={ mode:'row', t:t, r:q.r+(c.rowSpan||1)-1 }; }
    });
    return col||row;
  }
  var CUR={ col:'col-resize', row:'row-resize', both:'nwse-resize' };
  var freeOn=function(){ return window.AWFree && AWFree.tool()!=='type'; };
  canvas.addEventListener('mousemove',function(e){
    if(drag||freeOn()) return;
    var h=hit(e); canvas.style.cursor=h?CUR[h.mode]:'';
  });
  canvas.addEventListener('mouseleave',function(){ if(!drag) canvas.style.cursor=''; });
  canvas.addEventListener('mousedown',function(e){
    if(e.button!==0||freeOn()) return;
    var h=hit(e); if(!h) return;
    e.preventDefault();
    var t=h.t; tblEnsureCols(t);
    drag={ h:h, x:e.clientX, y:e.clientY, w:tblWidths(t), hs:[].map.call(t.rows,function(r){ return r.offsetHeight; }) };
    document.body.style.userSelect='none';
    document.addEventListener('mousemove',onDrag); document.addEventListener('mouseup',endDrag);
  });
  function onDrag(e){
    if(!drag) return;
    paintSel();
    var h=drag.h, t=h.t, z=tblZoom()*(parseFloat(t.dataset.s)||1), dx=(e.clientX-drag.x)/z, dy=(e.clientY-drag.y)/z;
    if(h.mode==='col'){
      var i=h.i, last=i>=drag.w.length-1;
      if(last) tblSetCol(t,i,drag.w[i]+dx);
      else { var d=Math.max(-(drag.w[i]-30),Math.min(dx,drag.w[i+1]-30)); tblSetCol(t,i,drag.w[i]+d); tblSetCol(t,i+1,drag.w[i+1]-d); }
    } else if(h.mode==='row'){
      if(t.rows[h.r]) tblSetRow(t.rows[h.r],drag.hs[h.r]+dy);
    } else {
      var tw=drag.w.reduce(function(a,b){ return a+b; },0), th=drag.hs.reduce(function(a,b){ return a+b; },0);
      var fx=Math.max(.2,(tw+dx)/tw), fy=Math.max(.2,(th+dy)/th);
      drag.w.forEach(function(w,i){ tblSetCol(t,i,w*fx); });
      [].forEach.call(t.rows,function(r,i){ tblSetRow(r,drag.hs[i]*fy); });
    }
    paintSel();
  }
  function endDrag(){
    document.removeEventListener('mousemove',onDrag); document.removeEventListener('mouseup',endDrag);
    document.body.style.userSelect=''; canvas.style.cursor=''; drag=null;
    scheduleSave(); refresh();
  }
}

// Zoom is a view-only setting — it is never saved into the board content.
// Teacher (same steps, ⌘/Ctrl + wheel and remembered level as the Live
// essay window): CSS zoom grows everything — text of any size, including
// what was sized with A+/A− in px, images and spacing. The canvas keeps its
// normal auto width, so it still fills the window and the bigger text
// re-wraps to the edge.
// Student: the teacher's font sizes are stripped (renderForStudent), so
// scaling the text size is enough.
var BOARD_ZOOM_STEPS=[0.8,0.9,1,1.2,1.4,1.6,1.8,2,2.5,3];
function boardZoomStep(dir){
  var i=BOARD_ZOOM_STEPS.indexOf(zoom);
  if(i===-1){ i=0; while(i<BOARD_ZOOM_STEPS.length-1 && BOARD_ZOOM_STEPS[i]<zoom) i++; }
  i=Math.max(0,Math.min(BOARD_ZOOM_STEPS.length-1,i+(dir>0?1:-1)));
  zoom=BOARD_ZOOM_STEPS[i]; applyZoom();
  try{ localStorage.setItem('aw_board_zoom', String(zoom)); }catch(e){}
}
function boardSavedZoom(){
  var z=0; try{ z=parseFloat(localStorage.getItem('aw_board_zoom')); }catch(e){}
  return BOARD_ZOOM_STEPS.indexOf(z)>=0 ? z : 1;
}
function applyZoom(){
  var canvas=document.getElementById('canvas'); if(!canvas)return;
  canvas.style.transform='none';
  if(isTeacher){
    canvas.style.fontSize='';
    canvas.style.width='';
    canvas.style.zoom = zoom===1 ? '' : String(zoom);
  } else if('zoom' in document.documentElement.style){
    // zoom the whole board (text, images, tables) together
    canvas.style.fontSize='';
    canvas.style.zoom = zoom===1 ? '' : String(zoom);
  } else {
    // old browser without CSS zoom: only the text can scale
    canvas.style.fontSize=(BASE_CANVAS_PX*zoom).toFixed(1)+'px';
  }
  var ind=document.getElementById('zoomInd');
  if(ind) ind.textContent=Math.round(zoom*100)+'%';
}
function changeFont(dir){
  // apply real px font-size to the selection, stepping between preset sizes up to 120px
  var sizes=[14,16,18,20,24,28,32,40,48,64,80,100,120];
  var sel=window.getSelection();
  if(!sel.rangeCount || sel.isCollapsed){ AW.toast('Select some text first','err'); return; }
  // find current size from the anchor
  var node=sel.anchorNode; node=node.nodeType===3?node.parentNode:node;
  var cur=parseInt(window.getComputedStyle(node).fontSize,10)||16;
  // nearest index
  var i=0, best=1e9;
  sizes.forEach(function(s,si){ var d=Math.abs(s-cur); if(d<best){best=d;i=si;} });
  i = Math.max(0, Math.min(sizes.length-1, i + (dir>0?1:-1)));
  var px=sizes[i];
  // wrap selection in a span with the chosen size
  var range=sel.getRangeAt(0);
  var span=document.createElement('span');
  span.style.fontSize=px+'px';
  try{
    span.appendChild(range.extractContents());
    range.insertNode(span);
    // reselect
    sel.removeAllRanges();
    var nr=document.createRange(); nr.selectNodeContents(span); sel.addRange(nr);
  }catch(e){ document.execCommand('fontSize',false,dir>0?'5':'3'); }
  AW.toast('Font size: '+px+'px'+(px===120?' (max)':''),'ok',1200);
  if(typeof scheduleSave==='function') scheduleSave();
}

// ImgBB API key — free tier, 32MB/image, permanent storage, direct CDN links
// Get a free key at https://api.imgbb.com/ (takes 30 seconds)
// Stored in localStorage so teacher enters once and it persists
var IMGBB_KEY = (function(){
  try { return localStorage.getItem('aw_imgbb_key') || ''; } catch(e){ return ''; }
})();

function handleImage(file){
  // Step 1 — Optimistic UI: show image instantly via local object URL (0ms delay)
  var localUrl = URL.createObjectURL(file);
  var placeholder = insertImgPlaceholder(localUrl);

  // Step 2 — Compress with Canvas (client-side, before any upload)
  compress(file, function(compressedDataUrl, sizeKB){

    // Step 3 — Upload to ImgBB (direct from browser, fast CDN) or Drive fallback
    uploadImage(compressedDataUrl, file.name || 'board-img.jpg', function(finalUrl, err){
      if (err) {
        // Upload failed — keep the local blob URL so teacher still sees the image
        // but warn that it won't persist after page refresh
        AW.toast('⚠️ Upload thất bại — ảnh chỉ hiển thị tạm thời trên máy này. Thử paste lại.', 'err', 7000);
        // Remove placeholder — browser will GC the object URL
        if (placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
        URL.revokeObjectURL(localUrl);
        return;
      }
      // Step 4 — Swap local URL with permanent CDN URL (silent, no flicker)
      if (placeholder) placeholder.src = finalUrl;
      URL.revokeObjectURL(localUrl);
      scheduleSave();
    });
  });
}

/*── compress: resize + JPEG 0.72 quality using HTML5 Canvas ──*/
function compress(file, cb){
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var MAX = 1200, w = img.width, h = img.height;
      if (w > MAX){ h = Math.round(h * MAX / w); w = MAX; }
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      var out = cv.toDataURL('image/jpeg', 0.72);
      var sizeKB = Math.round(out.length * 0.75 / 1024);
      cb(out, sizeKB);
    };
    img.onerror = function(){ cb(reader.result, 9999); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/*── insertImgPlaceholder: insert <img> at cursor, return the element ──*/
function insertImgPlaceholder(url){
  var canvas = document.getElementById('canvas'); if(!canvas) return null;
  canvas.focus();
  // Create img node directly so we can return a reference
  var img = document.createElement('img');
  img.src = url; img.alt = 'board image';
  img.style.maxWidth = '100%';
  // Insert at current cursor position
  var sel = window.getSelection();
  if (sel && sel.rangeCount) {
    var range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(img);
    // Move cursor after img
    range.setStartAfter(img); range.setEndAfter(img);
    sel.removeAllRanges(); sel.addRange(range);
  } else {
    canvas.appendChild(img);
  }
  return img;
}

/*── uploadImage: try ImgBB first, fall back to Google Drive ──*/
function uploadImage(dataUrl, fileName, cb){
  if (IMGBB_KEY && IMGBB_KEY.length > 8) {
    uploadToImgBB(dataUrl, cb);
  } else if (!IMGBB_KEY) {
    // First time: show a small banner prompting teacher to set up ImgBB key
    showImgBBSetup(function(key){
      if (key) {
        IMGBB_KEY = key;
        try { localStorage.setItem('aw_imgbb_key', key); } catch(e){}
        uploadToImgBB(dataUrl, cb);
      } else {
        // Skipped → use Drive
        uploadToDrive(dataUrl, fileName, cb);
      }
    });
  } else {
    uploadToDrive(dataUrl, fileName, cb);
  }
}

function uploadToImgBB(dataUrl, cb){
  // Strip the data:image/...;base64, prefix — ImgBB wants raw base64
  var base64 = dataUrl.split(',')[1];
  if (!base64) { cb(null, 'Invalid image data'); return; }
  var form = new FormData();
  form.append('key', IMGBB_KEY);
  form.append('image', base64);
  fetch('https://api.imgbb.com/1/upload', { method:'POST', body:form })
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data && data.success && data.data && data.data.url) {
        cb(data.data.url, null); // permanent direct link
      } else {
        // ImgBB returned error — fallback to Drive
        uploadToDrive(dataUrl, 'board-img.jpg', cb);
      }
    })
    .catch(function(){ uploadToDrive(dataUrl, 'board-img.jpg', cb); });
}

function uploadToDrive(dataUrl, fileName, cb){
  AW.api('board.uploadImage', { dataUrl:dataUrl, name:fileName || 'board-img.jpg' })
    .then(function(res){
      if (res && res.success && res.data && res.data.url) {
        cb(res.data.url, null);
      } else {
        cb(null, (res && res.error) || 'Drive upload failed');
      }
    })
    .catch(function(e){ cb(null, e.message || 'Network error'); });
}

function scheduleSave(){

/* what is saved: the board as it is, with strokes in their short form */
function boardHtml(){ var c=document.getElementById('canvas'); return window.AWFree ? AWFree.serialize(c) : c.innerHTML; }

    if(res && res.success){
      if(dot2){ dot2.textContent='✓ Saved'; dot2.style.color='#16825B'; }
      if(btn2){ btn2.disabled=false; btn2.textContent='💾 Save'; btn2.style.background=''; }
    } else if(res && res.error==='CONTENT_TOO_LARGE') {
      if(dot2){ dot2.textContent='✗ Board too large'; dot2.style.color='var(--aw-danger)'; }
      if(btn2){ btn2.disabled=false; btn2.textContent='Retry save'; btn2.style.background='var(--aw-danger)'; }
      AW.toast('⚠️ ' + (res.detail || 'Nội dung board quá lớn — hãy xóa bớt ảnh.'), 'err', 8000);
    } else {
      if(dot2){ dot2.textContent='✗ Save failed'; dot2.style.color='var(--aw-danger)'; }
      if(btn2){ btn2.disabled=false; btn2.textContent='Retry save'; btn2.style.background='var(--aw-danger)'; }
      AW.toast('Lưu thất bại — kiểm tra kết nối mạng.','err');
    }
  }).catch(function(){
    var dot2 = document.getElementById('saveDot');
    var btn2 = document.getElementById('saveBtn');
    if(dot2){ dot2.textContent='✗ Connection error'; dot2.style.color='var(--aw-danger)'; }
    if(btn2){ btn2.disabled=false; btn2.textContent='Retry save'; }
    AW.toast('Không kết nối được máy chủ.','err');
  });
}
// Force-save immediately (no debounce) — used on tab close / sign out / visibility hidden
function saveNowImmediate(){
  if(!curBoard||!isTeacher) return;
  var canvas=document.getElementById('canvas'); if(!canvas) return;
  var title=document.getElementById('boardTitle'); title=title?title.value:curBoard.title;
  var html=boardHtml();
  if(html===curBoard.content && title===curBoard.title) return; // no changes
  curBoard.content=html; curBoard.title=title;
  var gasUrl = window.AW && AW._gasUrl ? AW._gasUrl : '';
  if (!gasUrl) return;
  var payload = JSON.stringify({
    action:'board.save',
    payload:{boardId:curBoard.boardId, title:title, content:html}
  });
  // keepalive:true tells browser to complete the request even when the page is closing
  try {
    fetch(gasUrl, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: payload,
      keepalive: true   // key: survives tab close / navigation away
    });
  } catch(e){}
}

// Save when tab becomes hidden (user switches app, closes tab, or signs out)
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='hidden' && curBoard && isTeacher){
    clearTimeout(saveTimer); // cancel debounced save
    saveNowImmediate();
  }
});
// Save before page unload (back button, close tab, navigate away)
window.addEventListener('beforeunload', function(){
  if(curBoard && isTeacher){
    clearTimeout(saveTimer);
    saveNowImmediate();
  }
});
