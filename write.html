<body>
<div id="app"></div>

<script src="aw-common.js"></script>
<script src="aw-cefr.js"></script>
<script src="aw-grader.js"></script>
<script>
// Safety shim: if aw-common.js is an older cached copy without groqKey,
// define it here so a missing helper can never blank the page.
if (window.AW && !AW.groqKey) {
  AW.groqKey = {
    get: function(){ return localStorage.getItem('aw_groq_key') || ''; },
    set: function(k){ localStorage.setItem('aw_groq_key', k || ''); }
  };
}
</script>
<script>
if (typeof AW === 'undefined') {
  document.body.innerHTML = '<div style="max-width:560px;margin:80px auto;padding:30px;border:2px solid #EA4335;border-radius:14px;font-family:system-ui;color:#10222E"><h2>&#9888; Kh&ocirc;ng t&#7843;i &#273;&#432;&#7907;c aw-common.js</h2><p>File <b>aw-common.js</b> v&agrave; <b>aw-theme.css</b> ph&#7843;i n&#7857;m <b>c&ugrave;ng th&#432; m&#7909;c</b> v&#7899;i file HTML n&agrave;y tr&ecirc;n GitHub. Upload &#273;&#7911; ch&uacute;ng r&#7891;i t&#7843;i l&#7841;i trang.</p></div>';
  throw new Error('aw-common.js not loaded');
}

/*──────── session + params ────────*/
var sess = AW.session.require('student');
if (!sess) throw 'redirect';

var qp = new URLSearchParams(location.search);
var MODE = qp.get('mode') || 'free';               // free | homework | inclass
var TOPIC = qp.get('topic') || 'Free Writing';
var PROMPT = qp.get('prompt') || 'Write about your opinion on the given topic.';
var AI_NOTES = '';  // teacher's grading rules for this task (context)
var TASK_TYPE      = qp.get('type') || 'task2';
// Normalize: old URLs may have passed 'IELTS Task 2' as the type value
if (TASK_TYPE !== 'task1') TASK_TYPE = 'task2';
var CHART_IMAGE_ID = qp.get('chartImageId') || '';  // passed from student.html for Task 1
var TOPIC_ID = qp.get('topicId') || ('T' + Date.now().toString(36));
var RETRY = qp.get('retry') === '1';
var DURATION_MIN = parseInt(qp.get('duration') || '0', 10);
// Homework is capped at 60 minutes so a student can't leave a draft open for
// hours. In-class keeps whatever the teacher set; Free Writing stays untimed.
if (MODE === 'homework' && !DURATION_MIN) DURATION_MIN = 60;

var MODE_LABEL = { free:'Free Writing', homework:'Homework', inclass:'In-class Practice' }[MODE] || 'Free Writing';

var nav = [
  { id:'modes',   label:'Practice Modes', icon:'modes', href:'student.html' },
  { id:'library', label:'Library', icon:'library', href:'library.html' },
  { id:'progress',label:'My Progress', icon:'progress', href:'student.html#progress' },
  { id:'settings',label:'Settings', icon:'settings', href:'student.html#settings' },
];

var content = AW.renderShell({
  mount:'app', nav:nav, eyebrow:'Student Interface', title:MODE_LABEL
});

var startTime = new Date();
var attempt = 1;

// If we have a real assignment topicId but no prompt in the URL (e.g. via Re-try),
// fetch the official prompt from the backend so the student sees the real đề bài.
var hasRealTopic = qp.get('topicId') && MODE !== 'free';
// MIN_WORDS: default by task type, overridden by assignment's minWords field
// GV có thể set minWords thấp hơn (VD: 80 nếu chỉ viết 1 đoạn thân bài)
var MIN_WORDS = TASK_TYPE === 'task1' ? 150 : 250;
// WRITING_TYPE: 'full_essay' | 'paragraph' | 'sentences' — controls grading constraints
var WRITING_TYPE = 'full_essay';

// If chart image was passed via URL (Task 1 assigned), render immediately
if (TASK_TYPE === 'task1' && CHART_IMAGE_ID) {
  setTimeout(function(){ renderChartViewer(CHART_IMAGE_ID); }, 200);
}

if (hasRealTopic) {
  AW.api('write.getPrompt', { topicId: TOPIC_ID }).then(function(res){
    if (res && res.success) {
      if (res.data.prompt && !qp.get('prompt')) {
        PROMPT = res.data.prompt;
        var pt = document.querySelector('.aw-prompt-text');
        if (pt) pt.innerHTML = AW.esc(AW.stripHtml(PROMPT));
      }
      AI_NOTES = res.data.aiNotes || '';
      // Override MIN_WORDS if teacher specified a custom limit for this task

    }
  });

// font size (real px, up to 120) + clear formatting
function editorChangeFont(dir){
  var sizes=[14,16,18,20,24,28,32,40,48,64,80,100,120];
  var sel=window.getSelection();
  if(!sel.rangeCount || sel.isCollapsed){ AW.toast('Select some text first','err'); return; }
  var node=sel.anchorNode; node=node.nodeType===3?node.parentNode:node;
  var cur=parseInt(window.getComputedStyle(node).fontSize,10)||16;
  var i=0,best=1e9; sizes.forEach(function(s,si){var d=Math.abs(s-cur);if(d<best){best=d;i=si;}});
  i=Math.max(0,Math.min(sizes.length-1,i+(dir>0?1:-1)));
  var px=sizes[i];
  var range=sel.getRangeAt(0), span=document.createElement('span');
  span.style.fontSize=px+'px';
  try{
    span.appendChild(range.extractContents()); range.insertNode(span);
    sel.removeAllRanges(); var nr=document.createRange(); nr.selectNodeContents(span); sel.addRange(nr);
  }catch(e){ document.execCommand('fontSize',false,dir>0?'5':'3'); }
  AW.toast('Font size: '+px+'px'+(px===120?' (max)':''),'ok',1000);
  editor.focus();
}
document.getElementById('fontUp').onclick=function(){ editorChangeFont(1); };
document.getElementById('fontDown').onclick=function(){ editorChangeFont(-1); };
document.getElementById('clearFmt').onclick=function(){
  document.execCommand('removeFormat', false, null);
  // removeFormat doesn't clear font-size spans or highlights → strip them manually in selection
  var sel=window.getSelection();
  if(sel.rangeCount && !sel.isCollapsed){
    document.execCommand('hiliteColor', false, 'transparent');
    document.execCommand('backColor', false, 'transparent');
    // unwrap font-size spans within selection
    var frag=sel.getRangeAt(0).cloneContents();
    var tmp=document.createElement('div'); tmp.appendChild(frag);
    tmp.querySelectorAll('span[style]').forEach(function(sp){ sp.removeAttribute('style'); });
    var r=sel.getRangeAt(0); r.deleteContents();
    var nodes=document.createRange().createContextualFragment(tmp.innerHTML);
    r.insertNode(nodes);
  }
  AW.toast('Formatting cleared','ok',1000);
  editor.focus();
};

/* Fired once when the countdown reaches zero.
   Strategy: programmatically trigger gradeBtnHandler (same as student pressing
   the button) so the full grade→save→Doc flow runs without duplication.
   Auto-confirms the hw/inclass submit dialog so no interaction needed.    */
function autoSubmitOnTimeout(){
  if (writePhase === 'graded') return;
  if (isGrading) return;

  var gb = document.getElementById('gradeBtn');
  AW.toast('Hết giờ! Bài của bạn đang được nộp tự động…', 'err', 4000);

  // Lock editor immediately (visual feedback)
  editor.setAttribute('contenteditable','false');
  editor.style.background='var(--aw-surface-2)';
  if (gb) { gb.disabled = true; gb.innerHTML = '<span class="aw-spin"></span> Tự động nộp bài…'; }

  var wc = AW.wordCount(editor.innerText||'');
  if (wc < 10) {
    // Nothing written — save blank and finish
    writePhase = 'grading'; isGrading = true;
    AW.api('write.saveResult', {
      studentId:sess.studentId, name:sess.name, mode:MODE, topic:TOPIC, topicId:TOPIC_ID,
      taskType:TASK_TYPE, startTime:startTime.toISOString(), finishTime:new Date().toISOString(),
      duration:Math.round((Date.now()-startTime)/1000),
      tr:'', cc:'', lr:'', gra:'', aiGrading:'', teacherGrading:'',
      essay:'(Không có nội dung)', class:(sess.class||''), feedback:''
    }).then(function(saveRes){
      writePhase = 'graded'; isGrading = false;
      if (window.clearDraft) window.clearDraft();
      if (gb) { gb.disabled = true; gb.textContent = 'Đã nộp tự động'; }
      sendHeartbeat('Submitted');
      showTimeUpBanner(0, null);
    }).catch(function(){
      writePhase = 'editing'; isGrading = false;
      if (gb) { gb.disabled = false; gb.textContent = AW_AI_ON ? 'Get AI Feedback' : 'Nộp bài'; }
    });
    return;
  }

  // Patch: override the confirm dialog for hw/inclass so it auto-accepts
  var _origConfirm = window.confirm;
  window.confirm = function(){ return true; }; // auto-accept "nộp bài?" dialog
  setTimeout(function(){ window.confirm = _origConfirm; }, 3000); // restore after 3s

  _autoSubmitActive = true; // signal transitionToGraded to show time-up banner
  // Re-enable button temporarily so gradeBtnHandler can run, then it disables itself
  if (gb) { gb.disabled = false; gb.textContent = AW_AI_ON ? 'Get AI Feedback' : 'Nộp bài'; gb.onclick = gradeBtnHandler; }
  // Trigger the full grading flow
  if (gb) gb.click();
}

/*──────── plain submission (control classes, no AI) ────────
   Same storage path as a graded attempt, minus every AI field, so the teacher
   marks it by hand in Results and the export keeps AI and teacher scores apart. */
function submitWithoutAI(btn, text){
  // Phase guard: reject if not editing
  if (writePhase !== 'editing') return;
  if(!confirm('Nộp bài này cho giáo viên?\n\nBạn vẫn có thể viết lại và nộp thêm (tối đa 3 lần). Giáo viên sẽ chấm BẢN NỘP MỚI NHẤT.')) return;
  var orig=btn.textContent;
  btn.disabled=true;
  btn.innerHTML='<span class="aw-spin"></span> Đang nộp…';
  writePhase = 'grading';

  AW.api('write.saveResult', {
    studentId:sess.studentId, name:sess.name, mode:MODE, topic:TOPIC, topicId:TOPIC_ID,
    startTime:startTime.toISOString(), finishTime:new Date().toISOString(),
    duration:Math.round((Date.now()-startTime)/1000),
    tr:'', cc:'', lr:'', gra:'', aiGrading:'', teacherGrading:'',
    essay:text, class:(sess.class||''), feedback:''
  }).then(function(res){
    if (res && res.locked) {
      writePhase = 'graded'; isGrading = false;
      AW.toast(res.error||'Bài này đã khoá.','err',4000);
      lockEditor(res.error||'Bài này đã khoá.');
      return;
    }
    if (!res || !res.success) {
      writePhase = 'editing';    // allow retry on error
      AW.toast((res&&res.error)||'Nộp bài thất bại','err');
      btn.disabled=false; btn.textContent=orig;
      return;
    }
    attempt = (res.data.attempt||attempt)+1;
    var used = attempt-1;
    if(window.clearDraft) window.clearDraft();

    var noteEl = document.getElementById('draftNote');
    if (noteEl) noteEl.style.display = 'none';
    document.querySelectorAll('.aw-notepad-label,.aw-notepad-hint').forEach(function(el){ el.style.display='none'; });
    AW.toast('Đã nộp bài (lần '+used+'/3)','ok');
    var sideBodyEl2 = document.getElementById('sideBody');
    if (sideBodyEl2) { sideBodyEl2.style.display=''; sideBodyEl2.innerHTML =
      '<div style="text-align:center;padding:18px 6px">' +
        '<div style="font-size:2.2rem;line-height:1">✅</div>' +
        '<h4 style="margin:8px 0 6px;font-family:var(--aw-font-display)">Đã nộp — chờ giáo viên chấm</h4>' +
        '<p style="color:var(--aw-ink-2);font-size:.88rem;margin:0 0 10px">Điểm và nhận xét sẽ hiện trong <b>My Progress</b> sau khi giáo viên chấm xong.</p>' +
        '<p style="color:var(--aw-ink-3);font-size:.8rem;margin:0">Lần nộp: <b>'+used+'/3</b>. Giáo viên chấm bản nộp mới nhất.</p>' +
      '</div>';
    }
    // Transition to GRADED (locks button, locks editor)
    transitionToGraded(btn, used, used >= 3);
  }).catch(function(e){
    writePhase = 'editing';    // allow retry on network error
    AW.toast(e.message||'Nộp bài thất bại','err');
    btn.disabled=false; btn.textContent=orig;
  });
}

/*──────── grading ────────*/
var lastResult=null;

/*═══════════════════════════════════════════════════════════════════
  ANTI-CHEAT STATE MACHINE
  ─────────────────────────────────────────────────────────────────
  writePhase: 'editing' | 'grading' | 'graded'

  Rules:
  • gradeBtnHandler / submitWithoutAI only run when phase==='editing'
  • Once phase==='graded', NO path reaches AW.grade() or saveResult
    for the same essay — even if student calls from DevTools.
  • Only resetForRetry() returns phase to 'editing'.
  • isGrading is a secondary in-flight guard (race protection).
  • Both guards must pass to proceed.
  ═══════════════════════════════════════════════════════════════════*/
var writePhase = 'editing'; // 'editing' | 'grading' | 'graded'
var isGrading = false;
var lastPlainEssay = '';
var _autoSubmitActive = false; // true when fired by timer timeout

/* resetForRetry — clears everything and returns to editing state.
   This is the ONLY way back from 'graded'. */
function resetForRetry(){
  editor.innerHTML = '';
  editor.setAttribute('contenteditable','true');
  editor.style.background = '';
  editor.focus();

  var sideBody = document.getElementById('sideBody');
  if (sideBody) { sideBody.style.display='none'; sideBody.innerHTML=''; }
  var docBtnWrap = document.getElementById('docBtnWrap');
  if (docBtnWrap) docBtnWrap.innerHTML='';

  if (window.clearDraft) window.clearDraft();

  lastPlainEssay = '';
  lastResult = null;
  startTime = new Date();
  isGrading = false;
  writePhase = 'editing';   // ← only place this resets

  var btn = document.getElementById('gradeBtn');
  if (btn) {
    btn.textContent = AW_AI_ON ? 'Get AI Feedback' : 'Nộp bài';
    btn.disabled = false;
    btn.onclick = gradeBtnHandler;
  }
  AW.toast('Đã xoá — viết bài mới để chấm lại.','ok',2000);
}

/* transitionToGraded — called once per attempt after saveResult succeeds.
   Sets phase, swaps the button to Re-try (Free) or locks it (hw/inclass). */
function transitionToGraded(btn, usedAttempts, done){
  writePhase = 'graded';
  isGrading  = false;

  if (MODE === 'free') {
    btn.disabled = false;
    btn.textContent = '↺ Re-try (viết lại)';
    btn.onclick = function(){
      if (!confirm('Bắt đầu lượt mới?\nBài viết và feedback hiện tại sẽ bị xoá.\nBạn sẽ phải viết lại từ đầu.')) return;
      resetForRetry();
    };
  } else {
    // hw / inclass — clear draft so next attempt starts with blank editor
    if (window.clearDraft) window.clearDraft();
    if (done) {
      lockEditor('Bạn đã hoàn thành đủ 3 lần cho bài này.');
      btn.disabled=true; btn.textContent='Đã hoàn thành 3/3';
    } else {
      editor.setAttribute('contenteditable','false');
      editor.style.background='var(--aw-surface-2)';
      btn.disabled=true;
      btn.textContent='Đã nộp lần '+usedAttempts+'/3 – Re-try trong My Progress';
      var ss=document.getElementById('submitStatus');
      if(ss) ss.style.display='';
    }
    sendHeartbeat('Submitted');
    // If this was triggered by auto-submit on timeout, show the time-up banner
    if (_autoSubmitActive) {
      _autoSubmitActive = false;
      var wc = AW.wordCount(lastPlainEssay||'');
      showTimeUpBanner(wc, lastResult);
    }
  }
}

function gradeBtnHandler(){
  // ── GUARD 1: phase check ───────────────────────────────────────────
  if (writePhase !== 'editing') return;
  // ── GUARD 2: in-flight check ───────────────────────────────────────
  if (isGrading) return;

  // ── Capture CLEAN essay text ────────────────────────────────────────
  var rawHTML = editor.innerHTML;
  var clone = document.createElement('div');
  clone.innerHTML = rawHTML;
  clone.querySelectorAll('.fix-mark, [class*="err-mark"], span[style*="→"], span[style*="wavy"]').forEach(function(sp){ sp.remove(); });
  clone.querySelectorAll('p, div, br').forEach(function(el){
    if (el.tagName === 'BR') {
      el.parentNode.insertBefore(document.createTextNode('\n'), el);
    } else {
      el.insertAdjacentText('afterbegin', '');
      el.insertAdjacentText('afterend', '\n');
    }
  });
  var text = (clone.innerText || clone.textContent || '').trim();
  text = text.replace(/\n{3,}/g, '\n\n').trim();
  if (!text) text = rawHTML.replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').trim();

  if (AW.wordCount(text) < 20) { AW.toast('Write at least 20 words before submitting.','err'); return; }

  // ── Issue 2: confirm dialog for hw/inclass before submitting ────────
  if (MODE !== 'free') {
    if (!confirm(
      '📤 Nộp bài lần ' + attempt + '/3?\n\n' +
      'Sau khi nộp, bài viết này sẽ được AI chấm và lưu lại.\n' +
      'Bạn vẫn có thể làm lại (tối đa 3 lần), nhưng mỗi lần phải viết lại từ đầu.\n\n' +
      'Bạn có chắc muốn nộp bài không?'
    )) return; // student cancelled → keep editing
  }

  if (!AW_AI_ON) { submitWithoutAI(this, text); return; }
  var key = AW.geminiKey.get();
  if (!key) { AW.toast('Please enter your Gemini API key first.','err'); return; }

  var fp = document.getElementById('freePrompt');
  if (fp && fp.value.trim()) { PROMPT = fp.value.trim(); TOPIC = fp.value.trim().slice(0,60); }

  var btn=this; btn.disabled=true; var orig=btn.textContent;
  if (typeof AW.grade !== 'function') {
    AW.toast('Lỗi tải bộ chấm (aw-grader.js). Hãy tải lại trang; nếu vẫn lỗi, báo giáo viên.', 'err', 6000);
    btn.disabled=false;
    return;
  }

  // ── Enter GRADING phase ───────────────────────────────────────────
  lastPlainEssay = text;
  writePhase = 'grading';
  isGrading  = true;
  btn.innerHTML='<span class="aw-spin"></span> Grading…';
  showGradingOverlay();

  var vocabSummary = '';
  try {
    if (window.AW && AW.analyseVocabulary) {
      lastVocabProfile = AW.analyseVocabulary(text);
      vocabSummary = AW.cefrSummary(lastVocabProfile);
    }
  } catch(e) { lastVocabProfile = null; }

  // Wrap AW.grade in a 90-second timeout so the spinner never hangs forever.
  // Gemini API occasionally stalls without rejecting; this ensures the student
  // always gets a recoverable error instead of an infinite spinner.
  var GRADE_TIMEOUT_MS = 90000;
  var gradeTimeoutId;
  var gradeWithTimeout = Promise.race([
    AW.grade({ writing:lastPlainEssay, question:PROMPT, attempt:attempt, aiNotes:AI_NOTES, vocabSummary:vocabSummary,
               minWords:MIN_WORDS, writingType:WRITING_TYPE, taskType:TASK_TYPE }, key),
    new Promise(function(_, reject){
      gradeTimeoutId = setTimeout(function(){
        reject(new Error('timeout: AI không phản hồi sau 90 giây. Vui lòng thử lại.'));
      }, GRADE_TIMEOUT_MS);
    })
  ]);

  gradeWithTimeout
    .then(function(result){
      clearTimeout(gradeTimeoutId);
      lastResult=result;
      if (MODE === 'free') {
        // Restore clean essay with paragraph structure before annotations
        editor.innerHTML = '';
        editor.style.whiteSpace = 'pre-wrap';
        editor.innerText = lastPlainEssay;
      }
      renderFeedback(result);
      return AW.api('write.saveResult', {
        studentId:sess.studentId, name:sess.name, mode:MODE, topic:TOPIC, topicId:TOPIC_ID,
        startTime:startTime.toISOString(), finishTime:new Date().toISOString(),
        duration:Math.round((Date.now()-startTime)/1000),
        tr:result.scores.TR, cc:result.scores.CC, lr:result.scores.LR, gra:result.scores.GRA,
        aiGrading:result.overall, teacherGrading:'', essay:lastPlainEssay, class:(sess.class||''),
        feedback: JSON.stringify(result)
      });
    })
    .then(function(saveRes){
      if (saveRes && saveRes.locked) {
        writePhase = 'graded'; isGrading = false;
        AW.toast(saveRes.error||'This task is locked.','err',4000);
        lockEditor(saveRes.error||'This task is locked.');
        btn.disabled=true; btn.textContent='Đã khoá';
        return;
      }
      if (saveRes && saveRes.success) attempt = (saveRes.data.attempt||attempt)+1;
      // For Free Writing, the backend generates a topicId on first save — capture it
      if (saveRes && saveRes.success && saveRes.data && saveRes.data.topicId && !TOPIC_ID) {
        TOPIC_ID = saveRes.data.topicId;
      }
      var usedAttempts = attempt - 1;
      AW.toast(MODE==='free' ? 'Graded & saved ✓' : 'Graded & saved (attempt '+usedAttempts+'/3)','ok');
      if(window.clearDraft) window.clearDraft();

      // ── Transition to GRADED (sets phase, swaps button) ──────────
      transitionToGraded(btn, usedAttempts, usedAttempts >= 3);

      // Google Doc export — trigger immediately for ALL modes using the topicId
      var exportTopicId = (saveRes && saveRes.data && saveRes.data.topicId) || TOPIC_ID;
      if (exportTopicId && sess.studentId) {
        var docBtnEl = document.getElementById('docExportBtn');
        if (docBtnEl) { docBtnEl.disabled=true; docBtnEl.innerHTML='<span class="aw-spin"></span> Đang tạo Google Doc…'; }
        AW.api('write.exportDoc', { studentId:sess.studentId, topicId:exportTopicId, mode:MODE })
          .then(function(docRes){
            var wrap = document.getElementById('docBtnWrap');
            if (!wrap) return;
            if (docRes && docRes.success && docRes.data && docRes.data.url) {
              wrap.innerHTML='<a href="'+AW.esc(docRes.data.url)+'" target="_blank" rel="noopener" '+
                'class="aw-btn aw-btn-primary" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;font-size:.9rem;text-decoration:none">'+
                '📄 Mở Feedback Google Doc →</a>'+
                '<p style="font-size:.73rem;color:var(--aw-ink-3);margin:5px 0 0;text-align:center">Nhận xét chi tiết Grammar · LR · CC · '+c1label+'</p>';
            } else {
              wrap.innerHTML='<button class="aw-btn aw-btn-ghost" style="width:100%" onclick="manualExportDoc()">📄 Tạo Google Doc (thử lại)</button>';
              AW.toast('Không tạo được Google Doc tự động — thử lại thủ công.','err',4000);
            }
          }).catch(function(){
            var wrap2=document.getElementById('docBtnWrap');
            if(wrap2) wrap2.innerHTML='<button class="aw-btn aw-btn-ghost" style="width:100%" onclick="manualExportDoc()">📄 Tạo Google Doc (thử lại)</button>';
          });
      } else {
        // No topicId available — show manual button
        var wrap3=document.getElementById('docBtnWrap');
        if(wrap3) wrap3.innerHTML='<button class="aw-btn aw-btn-ghost" style="width:100%" onclick="manualExportDoc()">📄 Tạo Google Doc</button>';
      }
    })
    .catch(function(e){
      clearTimeout(gradeTimeoutId);
      // Error: return to editing so student can retry
      writePhase = 'editing';
      isGrading  = false;
      showGradeError(e, btn, orig);
    })
    .finally(function(){
      hideGradingOverlay();
      // Phase and isGrading already set above — do not touch btn here
    });
}

var _gradeTimers=[];
/*── friendlyGradeError — chuyển lỗi kỹ thuật → thông báo tiếng Việt dễ hiểu ──*/
function friendlyGradeError(e) {
  var raw = (e && (e.message || String(e))) || '';
  var r   = raw.toLowerCase();

  // Both Gemini and Groq failed ("AI đang ngẽn")
  if (r.indexOf('ngẽn') !== -1 || r.indexOf('cả gemini và groq') !== -1)
    return { icon:'🌐', title:'AI đang ngẽn — cả hai dịch vụ không phản hồi',
             msg:'Hệ thống đã thử Gemini → Groq → Gemini nhưng đều thất bại. Đây là sự cố tạm thời của dịch vụ AI.',
             hint:'Đợi 2–3 phút rồi bấm lại. Bài viết của bạn vẫn an toàn — không bị mất.', color:'#B42318', bg:'#FEF2F2', retry:true };

  // Server overloaded (503/502/500) — highest priority, check before generic patterns
  if (r.indexOf('overloaded') !== -1 || r.indexOf('503') !== -1 || r.indexOf('502') !== -1 ||
      r.indexOf('500') !== -1 || r.indexOf('service unavailable') !== -1 ||
      r.indexOf('overload') !== -1)
    return { icon:'🌐', title:'Máy chủ AI đang quá tải', msg:'Gemini AI đang bị quá tải do nhiều người dùng cùng lúc. Hệ thống đã tự động chuyển sang AI dự phòng — nếu vẫn lỗi, hãy đợi 1–2 phút và bấm lại.', hint:'Đây là lỗi phía Google, không phải lỗi ứng dụng. Bài của bạn vẫn được lưu.', color:'#E8730C', bg:'#FFF3EA', retry:true };

  // Quota / rate limit — Groq fallback was triggered but also failed, or Groq not set up
  if (r.indexOf('quota:') !== -1)
    return { icon:'⏳', title:'AI hết lượt miễn phí hôm nay', msg:'Gemini đã hết lượt và AI dự phòng cũng chưa sẵn sàng. Đợi vài phút rồi bấm lại — lượt sẽ được làm mới sớm.', hint:'Nếu thường xuyên bị lỗi này, hãy tạo Gemini API key mới tại <a href="https://ai.google.dev" target="_blank" style="color:var(--aw-primary)">ai.google.dev</a>.', color:'#E0A32E', bg:'#FFF8EC', retry:true };

  // Quota / rate limit (generic)
  if (r.indexOf('quota') !== -1 || r.indexOf('resource_exhausted') !== -1 || r.indexOf('429') !== -1)
    return { icon:'⏳', title:'AI đã dùng hết lượt miễn phí', msg:'Bạn đã gửi quá nhiều yêu cầu trong thời gian ngắn. Đợi 1–2 phút rồi bấm <b>Get AI Feedback</b> lại.', hint:'Nếu thường xuyên bị lỗi này, hãy tạo một Gemini API key khác tại ai.google.dev.', color:'#E0A32E', bg:'#FFF8EC', retry:true };

  // Student cancelled Groq popup
  if (r.indexOf('huỷ') !== -1 || r.indexOf('cancel') !== -1)
    return { icon:'↩️', title:'Chưa nhập Groq key', msg:'Bài chưa được chấm. Bấm <b>Get AI Feedback</b> lại, nhập Groq API key để tiếp tục.', hint:'Lấy key miễn phí tại <a href="https://console.groq.com/keys" target="_blank" style="color:var(--aw-primary)">console.groq.com/keys</a>', color:'#5B6B7A', bg:'#F0F2F5', retry:true };

  // Invalid / expired API key
  if (r.indexOf('api_key') !== -1 || r.indexOf('invalid key') !== -1 || r.indexOf('api key') !== -1 || r.indexOf('401') !== -1 || r.indexOf('403') !== -1)
    return { icon:'🔑', title:'API key không hợp lệ hoặc đã hết hạn', msg:'Gemini API key của bạn bị sai hoặc đã bị thu hồi. Hãy kiểm tra và nhập lại key mới.', hint:'Lấy key miễn phí tại: <a href="https://ai.google.dev" target="_blank" style="color:var(--aw-primary)">ai.google.dev</a>', color:'#B42318', bg:'#FEF2F2', retry:false };

  // Model deprecated / not found
  if (r.indexOf('no longer available') !== -1 || r.indexOf('deprecated') !== -1 || r.indexOf('not found') !== -1 || r.indexOf('404') !== -1)
    return { icon:'🔄', title:'Phiên bản AI đã được cập nhật', msg:'Hệ thống đang chuyển sang phiên bản AI mới hơn. Vui lòng bấm lại để thử.', hint:'Nếu vẫn lỗi sau 2–3 lần thử, hãy báo giảng viên.', color:'#0A6EBD', bg:'#EBF4FF', retry:true };

  // Empty response
  if (r.indexOf('trống') !== -1 || r.indexOf('empty') !== -1 || r.indexOf('rỗng') !== -1)
    return { icon:'🤔', title:'AI không trả về kết quả', msg:'AI đã nhận bài nhưng không tạo được phản hồi. Đây là lỗi tạm thời — bấm lại sau 30 giây.', hint:'', color:'#E8730C', bg:'#FFF3EA', retry:true };

  // JSON parse error
  if (r.indexOf('parse') !== -1 || r.indexOf('json') !== -1 || r.indexOf('định dạng') !== -1 || r.indexOf('format') !== -1)
    return { icon:'⚙️', title:'AI trả lời không đúng định dạng', msg:'AI đã chấm nhưng phản hồi bị lỗi định dạng. Bấm lại để thử — thường tự khắc phục sau 1–2 lần.', hint:'', color:'#E8730C', bg:'#FFF3EA', retry:true };

  // Network / timeout
  if (r.indexOf('timeout') !== -1 || r.indexOf('network') !== -1 || r.indexOf('fetch') !== -1 || r.indexOf('failed to fetch') !== -1)
    return { icon:'📶', title:'Mất kết nối mạng', msg:'Không thể kết nối đến máy chủ AI. Kiểm tra wifi/mạng rồi bấm lại.', hint:'', color:'#5B6B7A', bg:'#F0F2F5', retry:true };

  // Groq invalid key
  if (r.indexOf('groq key') !== -1 || r.indexOf('groq') !== -1 && (r.indexOf('không hợp lệ') !== -1 || r.indexOf('invalid') !== -1))
    return { icon:'🔑', title:'Groq API key không đúng', msg:'Key bạn nhập không hợp lệ. Bấm lại và nhập đúng key từ console.groq.com.', hint:'', color:'#B42318', bg:'#FEF2F2', retry:true };

  // Groq overloaded/rate limit
  if (r.indexOf('groq') !== -1 && (r.indexOf('hết lượt') !== -1 || r.indexOf('rate') !== -1 || r.indexOf('429') !== -1))
    return { icon:'⚡', title:'Groq AI cũng đang quá tải', msg:'Cả Gemini và Groq đều đang bận. Đây là hiện tượng bình thường khi nhiều người dùng cùng lúc. Đợi 2–3 phút và thử lại.', hint:'', color:'#E8730C', bg:'#FFF3EA', retry:true };

  // Groq generic error
  if (r.indexOf('groq') !== -1)
    return { icon:'⚡', title:'AI dự phòng (Groq) gặp sự cố', msg:'Dịch vụ dự phòng Groq tạm thời không phản hồi. Vui lòng thử lại sau vài phút.', hint:'', color:'#E8730C', bg:'#FFF3EA', retry:true };

  // Groq key missing
  if (r.indexOf('chưa có groq') !== -1 || r.indexOf('groq api key') !== -1)
    return { icon:'🔑', title:'Cần Groq API key dự phòng', msg:'Gemini hết lượt và bạn chưa có Groq key dự phòng. Bấm lại để nhập key Groq miễn phí.', hint:'Lấy key tại: <a href="https://console.groq.com/keys" target="_blank" style="color:var(--aw-primary)">console.groq.com/keys</a>', color:'#B42318', bg:'#FEF2F2', retry:true };

  // Generic fallback — now with more context
  return { icon:'⚠️', title:'AI chấm thất bại', msg:'Đã xảy ra lỗi tạm thời. Bấm <b>Thử lại ngay</b> — thường tự khắc phục.', hint:'Nếu lỗi tiếp tục sau 3 lần thử, hãy báo giảng viên biết.', color:'#5B6B7A', bg:'#F0F2F5', retry:true };
}

/*── showGradeError ──*/

  var info = friendlyGradeError(e);

  // Re-enable button
  if (gradeBtn) {

  }

  // Remove old error banner if any
  var old = document.getElementById('gradeErrBanner');

  // Build banner above the submit button
  var banner = document.createElement('div');
  banner.id = 'gradeErrBanner';
  banner.style.cssText =
    'position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:1400;'+
    'background:'+info.bg+';border:1.5px solid '+info.color+';border-radius:14px;'+
    'padding:14px 18px;max-width:480px;width:calc(100% - 32px);'+
    'box-shadow:0 4px 24px rgba(0,0,0,.18);font-family:var(--aw-font-body)';
  banner.innerHTML =

      '<span style="font-size:1.5rem;flex:0 0 auto">'+info.icon+'</span>'+
      '<div style="flex:1;min-width:0">'+
        '<b style="font-size:.92rem;color:'+info.color+';display:block;margin-bottom:4px">'+info.title+'</b>'+
        '<p style="margin:0 0 4px;font-size:.82rem;color:#3D4D5A;line-height:1.5">'+info.msg+'</p>'+
        (info.hint ? '<p style="margin:0;font-size:.76rem;color:#5B6B7A;line-height:1.4">'+info.hint+'</p>' : '')+
      '</div>'+
      '<button onclick="document.getElementById(\'gradeErrBanner\').remove()" '+
        'style="background:none;border:none;cursor:pointer;color:#9CA3AF;font-size:1.1rem;flex:0 0 auto;padding:0 2px">✕</button>'+
    '</div>'+
    (info.retry
      ? '<button onclick="document.getElementById(\'gradeErrBanner\').remove();document.getElementById(\'gradeBtn\').click()" '+
          'style="margin-top:10px;width:100%;padding:8px;background:'+info.color+';color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;font-size:.85rem">'+
          '🔄 Thử lại ngay</button>'
      : '');
  document.body.appendChild(banner);

  // Also show a shorter toast for quick visibility
  AW.toast(info.icon + ' ' + info.title, 'err', 5000);

  // Auto-dismiss after 20 seconds
  setTimeout(function(){ var b=document.getElementById('gradeErrBanner'); if(b) b.remove(); }, 20000);
}

function showGradingOverlay(){
  var ov=document.getElementById('gradeOverlay');
  if(!ov){
    ov=document.createElement('div');
    ov.id='gradeOverlay';
    ov.className='aw-grade-ov';
    document.body.appendChild(ov);
  }
  var steps=[
    {t:'Reading your essay…', d:0},
    {t:'Assessing Task Response…', d:1400},
    {t:'Analysing Coherence & Cohesion…', d:3000},
    {t:'Checking Lexical Resource…', d:4600},
    {t:'Reviewing Grammatical Range & Accuracy…', d:6200},
    {t:'Writing personalised feedback…', d:8000},
    {t:'Almost done…', d:10500}
  ];
  ov.innerHTML='<div class="aw-grade-card">'+
    '<div class="aw-grade-spin"></div>'+
    '<h3 id="gradeStep">Reading your essay…</h3>'+
    '<div class="aw-grade-bar"><div class="aw-grade-fill" id="gradeFill"></div></div>'+
    '<p class="aw-grade-sub">AI is grading your writing across all 4 IELTS criteria</p>'+
  '</div>';
  ov.classList.add('show');
  _gradeTimers.forEach(clearTimeout); _gradeTimers=[];
  steps.forEach(function(s,i){
    _gradeTimers.push(setTimeout(function(){
      var el=document.getElementById('gradeStep'); if(el)el.textContent=s.t;
      var f=document.getElementById('gradeFill'); if(f)f.style.width=Math.round((i+1)/steps.length*92)+'%';
    }, s.d));
  });
}
function hideGradingOverlay(){
  _gradeTimers.forEach(clearTimeout); _gradeTimers=[];
  var ov=document.getElementById('gradeOverlay');
  if(ov){
    var f=document.getElementById('gradeFill'); if(f)f.style.width='100%';
    setTimeout(function(){ ov.classList.remove('show'); }, 300);
  }
}

/*──────── render feedback (indirect→direct by attempt) ────────*/
function renderFeedback(r){
  var s=r.scores||{};
  // Annotate essay on left (error marks inline) — always
  if(r.corrected_text || (r.gra_errors && r.gra_errors.length) || (r.lr_issues && r.lr_issues.length)){
    // Keep the student's original paragraph structure. innerText flattens
    // paragraphs into one block, so start from the real HTML and only
    // wrap error phrases inside it (text nodes only, never inside tags).
    var annotated = editor.innerHTML;
    function markPhrase(html, phrase, wrapOpen, wrapClose){
      if(!phrase) return html;
      var esc = phrase.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      // only match outside of tags: split on tags, replace within text chunks
      return html.replace(/(<[^>]+>)|([^<]+)/g, function(m, tag, textChunk){
        if(tag) return tag;
        return textChunk.replace(new RegExp(esc,'g'), wrapOpen + AW.esc(phrase) + wrapClose);
      });
    }
    if(r.gra_errors) r.gra_errors.slice(0,10).forEach(function(e){
      if(e.wrong && e.correct){
        annotated = markPhrase(annotated, e.wrong,
          '<span class="err-mark">', '</span><span class="fix-mark"> →'+AW.esc(e.correct)+'</span>');
      }
    });
    if(r.lr_issues) r.lr_issues.slice(0,6).forEach(function(e){
      if(e.original && e.better){
        annotated = markPhrase(annotated, e.original,
          '<span style="text-decoration:underline;text-decoration-color:var(--aw-accent);text-decoration-style:wavy">',
          '<span style="color:var(--aw-accent);font-size:.8em"> (→'+AW.esc(e.better)+')</span></span>');
      }
    });
    editor.innerHTML=annotated;
    editor.setAttribute('contenteditable','false');
    editor.style.background='#FAFBFC';
    editor.style.whiteSpace='pre-wrap';   // keep line breaks even if the essay was plain text
  }
  var html =
    '<div class="aw-band"><div class="aw-band-circ"><div class="aw-band-num">'+(r.overall||'—')+'</div><div class="aw-band-lbl">BAND</div></div>' +
      '<div><b>'+AW.esc(r.band_description||'Overall Band')+'</b><p style="margin:4px 0 0;font-size:.82rem;color:var(--aw-ink-3)">'+AW.esc((r.overall_feedback_vi||'').slice(0,90))+'</p></div></div>' +
    crit('Task Response', s.TR) + crit('Coherence & Cohesion', s.CC) +
    crit('Lexical Resource', s.LR) + crit('Grammar', s.GRA);

  // For attempt 2-3: highlight whether old mistakes were repeated
  if (attempt >= 2 && r.repeated_errors_vi) {
    html += '<div class="aw-fb-block" style="border-left:3px solid var(--aw-accent);background:#FFF8EC"><h4>⚠ Repeated errors from last attempt</h4><div class="aw-fb-item">'+AW.esc(r.repeated_errors_vi)+'</div></div>';
  }

  // Overall feedback — always full
  if(r.overall_feedback_vi){
    html += '<div class="aw-fb-block"><h4>Overall Assessment</h4><div class="aw-fb-item">'+AW.esc(r.overall_feedback_vi)+'</div></div>';
  }
  // Task Response detail — show bold paragraph label; quote only a single flagged sentence
  if(r.tr_comments && r.tr_comments.length){
    html += '<div class="aw-fb-block"><h4>Task Response</h4>'+r.tr_comments.slice(0,6).map(function(c){
      var label = c.paragraph_role ? '<b style="color:var(--aw-primary)">'+AW.esc(c.paragraph_role)+'</b><br>' : '';
      var quote = c.quote ? '<i style="color:var(--aw-ink-2)">"'+AW.esc(c.quote)+'"</i><br>' : '';
      return '<div class="aw-fb-item">'+label+quote+AW.esc(c.assessment_vi||'')+
        (c.suggestion_en?'<br><span style="color:var(--aw-primary);font-size:.85rem">→ '+AW.esc(c.suggestion_en)+'</span>':'')+'</div>';
    }).join('')+'</div>';
  }
  // Coherence
  if(r.cc_feedback && r.cc_feedback.assessment_vi){
    html += '<div class="aw-fb-block"><h4>Coherence & Cohesion</h4><div class="aw-fb-item">'+AW.esc(r.cc_feedback.assessment_vi)+
      ((r.cc_feedback.suggestions&&r.cc_feedback.suggestions.length)?'<br><span style="font-size:.85rem;color:var(--aw-primary)">→ '+AW.esc([].concat(r.cc_feedback.suggestions).join('; '))+'</span>':'')+'</div></div>';
  }
  // Grammar — full detail always
  if((r.gra_errors||[]).length){
    html+='<div class="aw-fb-block"><h4>Grammar ('+r.gra_errors.length+' issues)</h4>'+r.gra_errors.slice(0,8).map(function(e){
      return '<div class="aw-fb-item"><span class="err-mark">'+AW.esc(e.wrong)+'</span> → <span class="fix-mark">'+AW.esc(e.correct)+'</span>'+(e.explanation_vi?'<br><span style="font-size:.8rem;color:var(--aw-ink-3)">'+AW.esc(e.explanation_vi)+'</span>':'')+'</div>';
    }).join('')+'</div>';
  }
  // Lexical — full detail always
  if((r.lr_issues||[]).length){
    html+='<div class="aw-fb-block"><h4>Lexical Resource ('+r.lr_issues.length+' suggestions)</h4>'+r.lr_issues.slice(0,6).map(function(e){
      return '<div class="aw-fb-item"><span class="err-mark">'+AW.esc(e.original)+'</span> → <span class="fix-mark">'+AW.esc(e.better)+'</span>'+(e.explanation_vi?'<br><span style="font-size:.8rem;color:var(--aw-ink-3)">'+AW.esc(e.explanation_vi)+'</span>':'')+'</div>';
    }).join('')+'</div>';
  }
  // Vocabulary Profile moved to side panel via renderVocabStats() above
  // After submit: hide notepad, show score + vocab stats + Google Doc button
  var notepad = document.getElementById('draftNote');
  if (notepad) notepad.style.display = 'none';
  document.querySelectorAll('.aw-notepad-label,.aw-notepad-hint').forEach(function(el){ el.style.display='none'; });

  var vocabHtml = '';
  if (AW_AI_ON && window.AW && AW.analyseVocabulary && lastVocabProfile) {
    vocabHtml = renderVocabStats(lastVocabProfile);
  }

  var c1label = (TASK_TYPE === 'task1') ? 'Task Achievement' : 'Task Response';
  // Score summary — shown immediately
  var scoreSummaryHtml =
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--aw-border-2)">'+
      '<div style="width:60px;height:60px;border-radius:50%;background:var(--aw-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 4px 12px rgba(10,110,189,.35)">'+
        '<div style="font-size:1.5rem;font-weight:900;color:#fff;line-height:1">'+(r.overall||'—')+'</div>'+
        '<div style="font-size:.5rem;color:rgba(255,255,255,.85);letter-spacing:.05em;margin-top:1px">BAND</div>'+
      '</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-weight:700;font-size:.92rem;color:var(--aw-ink);margin-bottom:4px">'+AW.esc(r.band_description||'AI Grading Complete')+'</div>'+
        '<div style="font-size:.76rem;color:var(--aw-ink-3);display:flex;flex-wrap:wrap;gap:4px 10px">'+
          '<span><b style="color:var(--aw-ink-2)">'+c1label+'</b> '+AW.esc(String(s.TR||'—'))+'</span>'+
          '<span><b style="color:var(--aw-ink-2)">CC</b> '+AW.esc(String(s.CC||'—'))+'</span>'+
          '<span><b style="color:var(--aw-ink-2)">LR</b> '+AW.esc(String(s.LR||'—'))+'</span>'+
          '<span><b style="color:var(--aw-ink-2)">GRA</b> '+AW.esc(String(s.GRA||'—'))+'</span>'+
        '</div>'+
        (r.overall_feedback_vi
          ? '<div style="font-size:.78rem;color:var(--aw-ink-2);margin-top:5px;line-height:1.4">'+AW.esc(r.overall_feedback_vi.slice(0,120))+(r.overall_feedback_vi.length>120?'…':'')+'</div>'
          : '')+
      '</div>'+
    '</div>';

  // Google Doc button placeholder — will be updated after export completes
  var docBtnHtml =
    '<div id="docBtnWrap" style="margin-bottom:14px">'+
      '<button id="docExportBtn" class="aw-btn aw-btn-primary" style="width:100%;padding:12px;font-size:.9rem">'+
        '<span id="docBtnSpinner" class="aw-spin" style="display:none"></span>'+
        '📄 Đang tạo Google Doc…'+
      '</button>'+
    '</div>';

  var sideHtml =
    '<div class="aw-vocab-panel">'+
    scoreSummaryHtml+
    docBtnHtml+
    (vocabHtml
      ? '<div style="border-top:1px solid var(--aw-border-2);padding-top:12px;margin-top:2px">'+
          '<div style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--aw-ink-3);margin-bottom:8px">📊 Phân bố từ vựng</div>'+
          vocabHtml+
        '</div>'
      : '')+
    '</div>';

  var sideBodyEl = document.getElementById('sideBody');
  sideBodyEl.style.display = '';
  sideBodyEl.innerHTML = sideHtml;
  setTimeout(function(){
    AW.els('.aw-bar-fill').forEach(function(b){b.style.width=b.dataset.w;});
    // grow vocab bars from zero for a small reveal
    AW.els('.aw-voc-fill').forEach(function(b){ b.style.width=b.dataset.w; });
  },50);
}
function crit(name,val){
  var pct=val?Math.min(100,(parseFloat(val)/9)*100):0;
  return '<div class="aw-crit"><div class="aw-crit-top"><span class="aw-crit-name">'+name+'</span><span class="aw-crit-val">'+(val||'—')+'</span></div>'+
    '<div class="aw-bar"><div class="aw-bar-fill" data-w="'+pct+'%"></div></div></div>';
}

/*──────── Vocabulary Profile diagram (CEFR, client-side) ────────*/
var lastVocabProfile = null;
/* Difficulty ramp: green (easy) → blue → yellow → orange → red (hardest),
   so the colour alone tells the student how demanding the vocabulary is. */
var CEFR_BANDS = [
  { key:'A1A2', label:'A1–A2', sub:'Cơ bản',          color:'#2E9367' },
  { key:'B1',   label:'B1',    sub:'Trung cấp',       color:'#0A6EBD' },
  { key:'B2',   label:'B2',    sub:'Trên trung cấp',  color:'#E0A32E' },
  { key:'C1',   label:'C1',    sub:'Nâng cao',        color:'#E8730C' },
  { key:'C2',   label:'C2',    sub:'Thành thạo',      color:'#D93025' }
];
function vocabBandPct(p){
  return {
    A1A2: Math.round((p.pctByLevel.A1 + p.pctByLevel.A2) * 10) / 10,
    B1: p.pctByLevel.B1, B2: p.pctByLevel.B2,
    C1: p.pctByLevel.C1, C2: p.pctByLevel.C2
  };
}
/* List the actual higher-level words the student used (B1 and up), grouped by
   level with the same colour ramp — so they can see and reuse their strong
   vocabulary instead of only reading a percentage. */
function renderVocabWords(p){
  if(!p.wordsByLevel) return '';
  var bands=[
    {key:'C2',label:'C2 · Thành thạo',color:'#D93025'},

    {key:'B1',label:'B1 · Trung cấp',color:'#0A6EBD'}
  ];

  }
  return '<div class="aw-voc-words">'+
    '<div class="aw-voc-whead">💡 Từ vựng nổi bật bạn đã dùng (B1+) — hãy phát huy!</div>'+
    blocks+'</div>';

function renderVocabStats(p){
  if (!p) return '';

  var barSegs = CEFR_BANDS.map(function(b){
    var w = pct[b.key]; if (!w) return '';
    return '<div class="aw-vocab-seg" style="flex:'+w+';background:'+b.color+'" title="'+b.label+': '+w+'%">'+
      (w >= 8 ? w+'%' : '')+
    '</div>';
  }).join('');

  // Legend
  var legend = CEFR_BANDS.filter(function(b){ return pct[b.key] > 0; }).map(function(b){
    return '<span class="aw-vocab-legend-item">'+
      '<span class="aw-vocab-legend-dot" style="background:'+b.color+'"></span>'+
      '<b>'+b.label+'</b> '+pct[b.key]+'%'+
    '</span>';
  }).join('');

  // KPI row
  var kpis =
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px">'+
      kpi(p.pctAdvanced+'%', 'C1+', '#E8730C')+
      kpi(p.pctUpperMid+'%', 'B2+', '#E0A32E')+

  function kpi(val, label, color){

      '<div style="font-size:1.1rem;font-weight:800;color:'+color+'">'+val+'</div>'+
      '<div style="font-size:.65rem;color:var(--aw-ink-3);margin-top:1px">'+label+'</div>'+

  }

  // Word chips by level (B1 and up)
  var wordBands = [
    {key:'C2', label:'C2 · Thành thạo', color:'#D93025'},
    {key:'C1', label:'C1 · Nâng cao',   color:'#E8730C'},
    {key:'B2', label:'B2 · Trên TT',    color:'#E0A32E'},

    return '<div class="aw-vocab-wordlist">'+
      '<h4 style="color:'+b.color+'">'+b.label+' <span style="font-weight:400">('+words.length+')</span></h4>'+
      '<div class="aw-vocab-words">'+
        words.map(function(w){
          return '<span class="aw-vocab-word" style="background:'+b.color+'18;color:'+b.color+';border:1px solid '+b.color+'44">'+AW.esc(w)+'</span>';
        }).join('')+
      '</div>'+
    '</div>';
  }).join('');
  if (!wordHtml) {
    wordHtml = '<p style="font-size:.78rem;color:var(--aw-ink-3);margin:8px 0 0">Chưa nhận diện được từ B1 trở lên. Hãy thử dùng thêm từ vựng học thuật để nâng band LR.</p>';
  }

  return '<div>'+
    '<div style="font-size:.8rem;font-weight:700;color:var(--aw-ink-2);margin-bottom:8px">📊 Phân bố từ vựng theo CEFR</div>'+
    '<div class="aw-vocab-bar-wrap">'+
      '<div class="aw-vocab-bar">'+barSegs+'</div>'+
      '<div class="aw-vocab-legend">'+legend+'</div>'+
    '</div>'+
    kpis+
    '<div style="font-size:.73rem;color:var(--aw-ink-3);margin-bottom:8px">'+p.listed+'/'+p.totalWords+' từ được nhận diện · '+p.diversity+'% đa dạng</div>'+
    '<div style="border-top:1px solid var(--aw-border-2);padding-top:10px">'+
      '<div style="font-size:.8rem;font-weight:700;color:var(--aw-ink-2);margin-bottom:4px">💡 Từ vựng bạn đã dùng (B1+)</div>'+
      wordHtml+
    '</div>'+
  '</div>';
}

/*──────── AI Writing Tutor (Groq) — Free Writing only ────────*/
if (MODE === 'free') {
  (function(){
    var fab=document.getElementById('tutorFab'), panel=document.getElementById('tutorPanel');
    var msgs=document.getElementById('tutorMsgs'), input=document.getElementById('tutorInput');
    var history=[];  // in-memory only; never persisted or sent to server
    if(fab) fab.onclick=function(){ panel.classList.add('show'); fab.style.display='none'; input && input.focus(); };
    var closeBtn=document.getElementById('tutorClose');
    if(closeBtn) closeBtn.onclick=function(){ panel.classList.remove('show'); fab.style.display=''; };
    var ks=document.getElementById('groqKeySave');
    if(ks) ks.onclick=function(){
      var k=document.getElementById('groqKeyInput').value.trim();
      if(k){ AW.groqKey.set(k); AW.toast('Groq key saved','ok'); document.querySelector('.aw-tutor-keybar').style.display='none'; }
    };
    function addMsg(text,who){
      var d=document.createElement('div'); d.className='aw-tutor-msg '+who; d.textContent=text;
      msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; return d;
    }
    function send(){
      var q=(input.value||'').trim(); if(!q)return;
      var key=AW.groqKey.get();
      if(!key){ AW.toast('Enter your Groq API key first','err'); return; }
      addMsg(q,'user'); input.value='';
      history.push({role:'user',content:q});
      var thinking=addMsg('…','bot');
      askGroq(history,key).then(function(reply){
        thinking.textContent=reply;
        history.push({role:'assistant',content:reply});
      }).catch(function(e){ thinking.textContent='⚠️ '+(e.message||'Error contacting Groq.'); });
    }
    if(input) input.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); send(); } };
    var sendBtn=document.getElementById('tutorSend'); if(sendBtn) sendBtn.onclick=send;
    // warn on leaving that chat isn't saved (only if the tutor was used)
    window.addEventListener('beforeunload', function(e){
      if(history.length){ e.preventDefault(); e.returnValue=''; }
    });
  })();
}

async function askGroq(history, key){
  var SYSTEM = "You are an IELTS writing TUTOR for a Vietnamese student practising Free Writing. "+
    "STRICT RULES you must always follow:\n"+
    "1. You ONLY explain: grammar, vocabulary, collocations, word choice, logic, coherence, essay structure, and general writing concepts.\n"+
    "2. You NEVER write, rewrite, paraphrase, 'polish', improve, or produce full sentences/paragraphs/essays for the student. NEVER give a ready-made sentence they could copy into their essay.\n"+
    "3. If the student asks you to write/rewrite/fix/polish their text, politely REFUSE and instead guide them with questions and principles so they write it themselves.\n"+
    "4. You may give short illustrative examples on NEUTRAL topics unrelated to their essay, to teach a concept — never on their actual essay content.\n"+
    "5. Keep answers concise and encouraging. You may answer in Vietnamese if the student writes in Vietnamese.\n"+
    "Stay strictly within a teaching role.";
  var messages=[{role:'system',content:SYSTEM}].concat(history.slice(-10));
  var res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({ model:'llama-3.3-70b-versatile', messages:messages, temperature:0.4, max_tokens:600 })
  });
  if(!res.ok){ var t=await res.text(); throw new Error('Groq error: '+res.status+(t?' '+t.slice(0,120):'')); }
  var data=await res.json();
  var reply=(((data.choices||[])[0]||{}).message||{}).content||'';
  return reply.trim() || '(no response)';
}

/*──────── Ask Teacher (In-class + Homework) ────────*/
if (MODE === 'inclass' || MODE === 'homework') {
  (function(){
    var fab=document.getElementById('askFab'), panel=document.getElementById('askPanel');
    var msgs=document.getElementById('askMsgs'), input=document.getElementById('askInput');
    if(fab) fab.onclick=function(){ panel.classList.add('show'); fab.style.display='none'; input&&input.focus(); loadMyAsks(); };
    var cb=document.getElementById('askClose');
    if(cb) cb.onclick=function(){ panel.classList.remove('show'); fab.style.display=''; };
    function bubble(text,who,answer){
      var d=document.createElement('div'); d.className='aw-tutor-msg '+who;
      d.textContent=text; msgs.appendChild(d);
      if(answer){ var a=document.createElement('div'); a.className='aw-tutor-msg bot';
        a.innerHTML='<b style="color:#1E7E42">Teacher:</b> '+AW.esc(answer); msgs.appendChild(a); }
      msgs.scrollTop=msgs.scrollHeight;
    }
    function loadMyAsks(){
      AW.api('query.listForStudent',{studentId:sess.studentId,class:sess.class}).then(function(res){
        var rows=((res&&res.data)||[]).filter(function(q){return String(q.topicId)===String(TOPIC_ID);});
        msgs.innerHTML='';
        if(!rows.length){ msgs.innerHTML='<div class="aw-tutor-msg bot">No questions yet for this task. Ask your teacher anything about it.</div>'; return; }
        rows.slice().reverse().forEach(function(q){ bubble(q.question,'user',q.answer); });
      });
    }
    function send(){
      var q=(input.value||'').trim(); if(!q)return;
      input.value='';
      bubble(q,'user');
      AW.api('query.create',{
        class:sess.class, studentId:sess.studentId, studentName:sess.name,
        mode:MODE, topic:TOPIC||PROMPT.slice(0,60), topicId:TOPIC_ID, attempt:attempt,
        question:q, phase:'live'
      }).then(function(res){
        if(res&&res.success){ AW.toast('Sent to your teacher','ok'); }
        else AW.toast('Failed to send','err');
      });
    }
    if(input) input.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); send(); } };
    var sb=document.getElementById('askSend'); if(sb) sb.onclick=send;
    // refresh answers periodically while panel open (in-class real-time-ish)
    setInterval(function(){ if(panel.classList.contains('show')) loadMyAsks(); }, 12000);
  })();
}

/*──────── Teacher feedback pushed from Live Observation ────────
  The teacher marks up a snapshot of the essay and clicks "Push to Student".
  We show ALL pushes (history) in a modal — newest first — so students can
  see every round of feedback the teacher gave, not just the latest.
  We never write teacher feedback into the editor. */
if (MODE === 'inclass' || MODE === 'homework') {
  (function(){
    var lastPushCount = 0, primed = false;
    function ensureUi(){
      if(document.getElementById('tfbFab')) return;
      var fab=document.createElement('button');
      fab.id='tfbFab'; fab.className='aw-tfb-fab';
      fab.textContent='\ud83d\udce9 Nhận xét của GV';
      fab.onclick=openTeacherFeedback;
      document.body.appendChild(fab);
      var bg=document.createElement('div');
      bg.id='tfbBg'; bg.className='aw-tfb-bg';
      bg.innerHTML='<div class="aw-tfb-modal" id="tfbModal"></div>';
      bg.onclick=function(e){ if(e.target===bg) bg.classList.remove('show'); };
      document.body.appendChild(bg);
    }
    window._tfbHistory = [];
    window.openTeacherFeedback = function(){
      var hist=window._tfbHistory; if(!hist||!hist.length) return;
      var modal=document.getElementById('tfbModal');
      modal.innerHTML=
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">'+
          '<h2 style="margin:0;font-family:var(--aw-font-display);font-size:1.15rem">\ud83d\udce9 Nhận xét của giáo viên ('+hist.length+' lần)</h2>'+
          '<button class="aw-btn" style="background:#E5484D;color:#fff;font-weight:600;padding:6px 18px" '+
            'onclick="document.getElementById(\'tfbBg\').classList.remove(\'show\')">\u2715 Đóng</button>'+
        '</div>'+
        '<p style="margin:0 0 12px;font-size:.78rem;color:var(--aw-ink-3)">'+
          '<span style="color:var(--aw-danger)">gạch đỏ = lỗi</span>, '+
          '<span style="color:var(--aw-writing)">xanh = sửa đúng</span>, vàng = highlight — '+
          'đây là snapshot bài lúc GV nhận xét, không ảnh hưởng bài bạn đang viết.</p>'+
        hist.map(function(d, i){
          var when=''; try{when=new Date(d.timestamp).toLocaleString('vi-VN');}catch(e){}
          var isLatest = i===0;
          return '<details'+(isLatest?' open':'')+' style="border:1px solid var(--aw-border-2);border-radius:10px;margin-bottom:8px;overflow:hidden">'+
            '<summary style="padding:10px 14px;cursor:pointer;background:'+(isLatest?'var(--aw-primary-lt)':'var(--aw-surface-2)')+';'+
              'font-weight:700;font-size:.88rem;display:flex;align-items:center;gap:8px">'+
              '<span style="background:var(--aw-primary);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;flex:0 0 auto">'+
                (hist.length - i)+'</span>'+
              (d.teacher?AW.esc(d.teacher)+' · ':'')+ AW.esc(when)+
              (isLatest?' <span style="background:var(--aw-primary);color:#fff;border-radius:8px;padding:1px 7px;font-size:.68rem;margin-left:auto">Mới nhất</span>':'')+
            '</summary>'+
            '<div class="aw-tfb-body" style="padding:12px 14px">'+d.annotatedHtml+'</div>'+
          '</details>';
        }).join('');
      document.getElementById('tfbBg').classList.add('show');
    };
    function poll(){
      AW.api('teacher.getAnnotation',{studentId:sess.studentId, topicId:TOPIC_ID}).then(function(res){
        if(!res||!res.success||!res.data||!res.data.history) return;
        var history = res.data.history; // array, newest first
        if(!history.length) return;
        var newCount = history.length;
        window._tfbHistory = history;
        ensureUi();
        var fab = document.getElementById('tfbFab');
        if(fab){
          fab.classList.add('show');
          fab.textContent = '\ud83d\udce9 Nhận xét GV' + (newCount>1?' ('+newCount+')':'');
        }
        if(primed && newCount > lastPushCount){
          AW.toast('Giáo viên vừa gửi nhận xét mới!','ok',5000);
          openTeacherFeedback();
        }
        lastPushCount = newCount;
        primed = true;
      });
    }
    setInterval(poll, 10000);
    setTimeout(poll, 2000);
  })();
}

/*──────── confirm the class mode against the server ────────
   The first paint uses the cached flag. This re-checks it, so a student who
   opens write.html directly (or after the teacher flips the switch) still gets
   the right screen instead of the one their device happened to remember. */
AW.loadClassAI(sess.class, function(on){
  if (on === AW_AI_ON) return;      // nothing changed
  AW_AI_ON = on;
  if (!on) {
    // downgrade to control mode without a reload
    var kb = document.querySelector('.aw-keybar'); if (kb) kb.remove();
    var tf = document.getElementById('tutorFab'); if (tf) tf.remove();
    var tp = document.getElementById('tutorPanel'); if (tp) tp.remove();

    if (gb && !gb.disabled) gb.textContent = 'Nộp bài';

      lockEditor('Free Writing không khả dụng cho lớp của bạn.');
      AW.toast('Mục này không khả dụng cho lớp của bạn.','err',5000);
    }
  } else {
    location.reload();              // upgrade needs the AI controls back
  }
});

<script>
// ── Draggable write pane splitter ─────────────────────────────
(function(){
  var divider  = document.getElementById('writeDivider');
  var grid     = document.getElementById('writeGrid');
  var paneLeft = document.getElementById('writePaneLeft');
  if (!divider || !grid || !paneLeft) return;

  var PREF_KEY = 'aw_split_' + (typeof MODE !== 'undefined' ? MODE : 'w');
  var dragging = false;
  var startX, startW, gridW;

  // Restore saved split ratio
  try {
    var saved = parseFloat(localStorage.getItem(PREF_KEY));
    if (saved >= 20 && saved <= 80) paneLeft.style.flexBasis = saved + '%';
  } catch(e){}

  divider.addEventListener('mousedown', function(e){
    e.preventDefault();
    dragging = true;
    startX   = e.clientX;
    startW   = paneLeft.getBoundingClientRect().width;
    gridW    = grid.getBoundingClientRect().width;
    divider.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', function(e){
    if (!dragging) return;
    var delta   = e.clientX - startX;
    var newW    = Math.min(Math.max(startW + delta, gridW * 0.2), gridW * 0.8);
    var pct     = (newW / gridW * 100).toFixed(1);
    paneLeft.style.flexBasis = pct + '%';
  });

  document.addEventListener('mouseup', function(){
    if (!dragging) return;
    dragging = false;
    divider.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    // Persist preference
    var pct = parseFloat(paneLeft.style.flexBasis);
    try { if (pct) localStorage.setItem(PREF_KEY, pct.toFixed(1)); } catch(e){}
  });

  // Touch support (mobile)
  divider.addEventListener('touchstart', function(e){
    var t = e.touches[0];
    startX = t.clientX;
    startW = paneLeft.getBoundingClientRect().width;
    gridW  = grid.getBoundingClientRect().width;
    dragging = true;
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if (!dragging) return;
    var t = e.touches[0];
    var newW = Math.min(Math.max(startW + t.clientX - startX, gridW*0.2), gridW*0.8);
    paneLeft.style.flexBasis = (newW/gridW*100).toFixed(1)+'%';
  }, {passive:true});
  document.addEventListener('touchend', function(){ dragging=false; });

  // Double-click to reset to 50/50
  divider.addEventListener('dblclick', function(){
    paneLeft.style.flexBasis = '50%';
    try { localStorage.removeItem(PREF_KEY); } catch(e){}
  });
})();
</script>
</body>
</html>
